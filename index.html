function renderCalendar(){
  const y = calTabMonth.getFullYear(), m = calTabMonth.getMonth();
  $('#cal2Month').textContent = `${MONTHS_NOM[m]} ${y}`;
  const grid = $('#cal2Grid');
  grid.innerHTML = '';
  const fd = new Date(y, m, 1);
  const so = (fd.getDay() + 6) % 7;
  const dim = new Date(y, m + 1, 0).getDate();
  const today = todayDate();
  for(let i=0;i<so;i++){
    const el = document.createElement('button');
    el.className = 'cal-cell empty'; el.tabIndex = -1;
    grid.appendChild(el);
  }
  for(let d=1; d<=dim; d++){
    const date = new Date(y, m, d);
    const key = iso(date);
    const classes = data.days[key] || [];
    const clubs = clubsForDate(date);
    const isToday = sameDay(date, today);
    const isSelected = sameDay(date, calTabSelected);
    const hasAny = classes.length || clubs.length;
    const allDots = [...classes.map(it => classColor(it)), ...clubs.map(() => dotColorForClub())];
    const shown = allDots.slice(0, 8);
    const dotsHtml = shown.map(c => `<span class="cal2-dot" style="background:${c}"></span>`).join('');
    const prog = getDayProgress(key);
    const donutHtml = prog ? `<div class="cal-donut" style="--p:${prog.pct}"></div>` : '';
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'cal-cell' + (isToday?' today':'') + (isSelected?' selected':'') + (hasAny?' has':'');
    btn.dataset.date = key;
    btn.innerHTML = `<span class="num">${d}</span>${dotsHtml ? `<span class="cal2-dots">${dotsHtml}</span>` : ''}${donutHtml}`;
    grid.appendChild(btn);
  }
  renderCalendarEvents();
  renderCalendarHomework();
}
function renderCalendarEvents(){
  const list = $('#cal2Events');
  const title = $('#cal2EventsTitle');
  const date = calTabSelected;
  const key = iso(date);
  const rel = relativeDayLabel(date);
  title.textContent = rel ? `События на ${formatDateFull(date)} · ${rel}` : `События на ${formatDateFull(date)}`;
  const classes = data.days[key] || [];
  const clubs = clubsForDate(date);
  list.innerHTML = '';
  if(!classes.length && !clubs.length){
    list.innerHTML = '<div class="cal-empty-day">На этот день ничего нет 🎉</div>';
    return;
  }
  [...classes].sort((a,b) => (a.time||'').localeCompare(b.time||'')).forEach(item => {
    const el = document.createElement('div');
    el.className = 'cal-event';
    el.style.setProperty('--c', classColor(item));
    el.dataset.jump = key;
    const meta = [item.room, item.teacher].filter(Boolean).join(' · ');
    el.innerHTML = `<span class="ce-time">${esc(item.time||'—')}</span><span class="ce-body"><span class="ce-name">${esc(item.subject)}</span>${meta ? `<span class="ce-meta">${esc(meta)}</span>` : ''}</span><span class="ce-type">${esc(TYPE_LABEL[item.type] || 'Без типа')}</span>`;
    list.appendChild(el);
  });
  [...clubs].sort((a,b) => (a.time||'').localeCompare(b.time||'')).forEach(c => {
    const el = document.createElement('div');
    el.className = 'cal-event cl';
    el.style.setProperty('--c', dotColorForClub());
    el.dataset.clubJump = '1';
    el.innerHTML = `<span class="ce-time">${esc(c.time||'—')}</span><span class="ce-body"><span class="ce-name">${esc(c.name)}</span>${c.place ? `<span class="ce-meta">${esc(c.place)}</span>` : ''}</span><span class="ce-type">Кружок</span>`;
    list.appendChild(el);
  });
}
function renderCalendarHomework(){
  const title = $('#cal2HwTitle');
  const list = $('#cal2Hw');
  const hw = homeworkForDate(calTabSelected);
  list.innerHTML = '';
  if(!hw.length){
    title.textContent = '📝 Домашние задания на этот день';
    list.innerHTML = '<div class="cal-hw-empty">На этот день ничего не задано</div>';
    return;
  }
  title.innerHTML = `📝 Домашние задания <span class="count">${hw.length}</span>`;
  hw.forEach(h => {
    const el = document.createElement('div');
    el.className = 'cal-hw-card' + (h.done ? ' done' : '');
    el.dataset.hwId = h.id;
    el.dataset.subject = h.subject;
    el.innerHTML = `
      <label class="cl-check"><input type="checkbox" ${h.done?'checked':''}><span class="hw-box"></span></label>
      <div class="hw-body">
        <div class="hw-subj">${esc(h.subject)}</div>
        <div class="hw-txt ${h.done ? 'strike' : ''}">${esc(h.text)}</div>
      </div>`;
    list.appendChild(el);
  });
}

function openDupFromModal(targetKey){
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  const targetDate = new Date(targetKey + 'T00:00:00');
  const defaultSource = iso(addDays(targetDate, -7));
  backdrop.innerHTML = `
    <div class="modal">
      <h3>📋 Скопировать расписание</h3>
      <div style="margin-bottom:8px">
        <label style="display:block;margin-bottom:6px;font-size:13px;color:var(--muted);font-weight:600">Откуда скопировать</label>

      </div>
      <div style="font-size:12px;color:var(--muted);padding:10px;background:var(--hover);border-radius:9px">
        Скопирую пары и ДЗ на <b>${esc(formatDateFull(targetDate))}</b>. Галочки и заметки не переносятся.
      </div>
      <div class="modal-actions">
        <button class="secondary" id="dupCancel" type="button">Отмена</button>
        <button class="secondary" id="dupAppend" type="button">Добавить</button>
        <button class="primary" id="dupReplace" type="button">Заменить</button>
      </div>
    </div>`;
  document.body.appendChild(backdrop);
  const close = () => backdrop.remove();
  backdrop.addEventListener('click', e => { if(e.target === backdrop) close(); });
  backdrop.querySelector('#dupCancel').onclick = close;
  backdrop.querySelector('#dupAppend').onclick = () => {
    const src = backdrop.querySelector('#dupSrcDate').value;
    if(!src){ toast('Выбери дату'); return; }
    const n = copyDayTo(src, targetKey, false);
    close(); toast(n ? `Скопировано ${n} пар` : 'Исходный день пустой');
    if (currentTab === 'calendar') renderCalendar(); else renderHome();
  };
  backdrop.querySelector('#dupReplace').onclick = () => {
    const src = backdrop.querySelector('#dupSrcDate').value;
    if(!src){ toast('Выбери дату'); return; }
    const n = copyDayTo(src, targetKey, true);
    close(); toast(n ? `Заменено: ${n} пар` : 'Исходный день пустой');
    if (currentTab === 'calendar') renderCalendar(); else renderHome();
  };
}

const SUBJECT_PALETTE = ['#7b9ad4','#b85570','#e05555','#8a9a5b','#c4a882','#a06bc4','#5ba3a0','#d4875a','#8e7bb5','#c47a9e'];
function subjectColor(name){
  const s = String(name||'');
  let h = 0;
  for(let i=0;i<s.length;i++) h = ((h<<5) - h + s.charCodeAt(i)) | 0;
  return SUBJECT_PALETTE[Math.abs(h) % SUBJECT_PALETTE.length];
}
function updateSubjectDropdowns(){
  const subjects = new Set(Object.keys(data.homework));
  Object.values(data.days).forEach(arr => arr.forEach(i => { if(i.subject) subjects.add(i.subject); }));
  if(data.materials){
    (data.materials.notes||[]).forEach(n => { if(n.subject) subjects.add(n.subject); });

function renderHomework(){
  updateSubjectDropdowns();
  const list = $('#hwList');
  list.innerHTML = '';
  const activeBySubject = {};
  const doneItems = [];
  let total = 0, doneCount = 0;
  Object.keys(data.homework).forEach(subj => {
    (data.homework[subj] || []).forEach(h => {
      total++;
      if(h.done){ doneCount++; doneItems.push({ ...h, subject: subj }); }
      else { if(!activeBySubject[subj]) activeBySubject[subj] = []; activeBySubject[subj].push(h); }
    });
  });
  $('#hwBadge').textContent = total ? `${doneCount}/${total}` : '';
  const activeSubjects = Object.keys(activeBySubject).sort();
  if(!activeSubjects.length && !doneItems.length){
    list.innerHTML = `<div class="empty">${EMPTY_ILLUSTRATION}ДЗ пока нет.</div>`;
    return;
  }
  if(!activeSubjects.length && doneItems.length){
    list.innerHTML = `<div class="empty" style="padding-bottom:0"><div class="big" style="font-size:32px;margin-bottom:6px">🎉</div>Все задания выполнены!</div>`;
  }
  function hwItemHtml(h, subj, doneGroup){
    const fromCardTag = h.fromCard ? '<span class="hw-from-card">с карточки</span>' : '';
    const check = h.done ? 'checked' : '';
    return `<div class="hw-item${doneGroup ? ' done' : ''}" data-id="${h.id}" data-subject="${esc(subj)}">
      <label class="cl-check"><input type="checkbox" ${check}><span class="hw-box"></span></label>
      <span class="hw-text ${h.done ? 'strike' : ''}" contenteditable="true" data-hw-id="${h.id}" data-subject="${esc(subj)}">${esc(h.text)}</span>
      ${fromCardTag}
      <input type="date" class="hw-dl-input" value="${esc(h.deadline||'')}" data-hw-id="${h.id}" data-subject="${esc(subj)}">
      ${isAdmin ? '<button class="del" type="button">×</button>' : ''}
    </div>`;
  }
  activeSubjects.forEach(subject => {
    const items = activeBySubject[subject];
    const collapsed = openGroups['hw_' + subject] === false;
    const group = document.createElement('div');
    group.className = 'hw-group' + (collapsed ? ' collapsed' : '');
    group.dataset.subject = subject;
    group.style.borderLeftColor = subjectColor(subject);
    const itemsHtml = items.map(h => hwItemHtml(h, subject, false)).join('');
    group.innerHTML = `<div class="hw-group-head"><span class="hw-dot" style="background:${subjectColor(subject)}"></span><span class="hw-name">${esc(subject)}</span><span class="hw-counter">${items.length}</span><span class="hw-arrow">▾</span></div><div class="hw-group-body">${itemsHtml}</div>`;
    list.appendChild(group);
  });
  if(doneItems.length){
    const isExpanded = openGroups['hw_done_section'] === true;
    const group = document.createElement('div');
    group.className = 'hw-group hw-done-group' + (isExpanded ? '' : ' collapsed');
    group.dataset.doneSection = '1';
    const itemsHtml = doneItems.map(h => hwItemHtml(h, h.subject, true)).join('');
    group.innerHTML = `<div class="hw-group-head"><span class="hw-dot"></span><span class="hw-name">✅ Выполненные</span><span class="hw-counter">${doneItems.length}</span><span class="hw-arrow">▾</span></div><div class="hw-group-body">${itemsHtml}</div>`;
    list.appendChild(group);
  }
}

async function storeMaterialFile(file){
  const MAX_BASE64 = 1.5 * 1024 * 1024;
  try {
    const pid = profiles.current;
    const safeName = file.name.replace(/[^\w.\-]/g, '_');
    const path = `materials/${pid}/${Date.now()}-${safeName}`;
    const { error } = await supa.storage.from('materials').upload(path, file, { cacheControl: '3600', upsert: false });
    if(error) throw error;
    const { data: pub } = supa.storage.from('materials').getPublicUrl(path);
    return { url: pub.publicUrl, name: file.name };
  } catch(e) {
    if(file.size > MAX_BASE64) throw new Error('Файл слишком большой (макс. 1.5 МБ)');
    const dataUrl = await new Promise((res, rej) => {
      const r = new FileReader();
      r.onload = () => res(r.result); r.onerror = rej;
      r.readAsDataURL(file);
    });
    return { url: dataUrl, name: file.name };
  }
}

function handlePlannerClick(e){
  if (!e.target.closest('#plannerContent')) return;
  const key = iso(viewDate);

  if (e.target.closest('#pPrevDay')) { viewDate = addDays(viewDate, -1); renderPlanner(); return; }
  if (e.target.closest('#pNextDay')) { viewDate = addDays(viewDate, 1); renderPlanner(); return; }
  if (e.target.closest('#pToday')) { viewDate = todayDate(); renderPlanner(); return; }
  if (e.target.closest('#pPrevWeek')) { viewDate = addDays(viewDate, -7); renderPlanner(); return; }
  if (e.target.closest('#pNextWeek')) { viewDate = addDays(viewDate, 7); renderPlanner(); return; }
  if (e.target.closest('#pPrevMonth')) { calTabMonth.setMonth(calTabMonth.getMonth() - 1); renderPlanner(); return; }
  if (e.target.closest('#pNextMonth')) { calTabMonth.setMonth(calTabMonth.getMonth() + 1); renderPlanner(); return; }

  const gotoBtn = e.target.closest('.btn-goto-day');
  if (gotoBtn) { viewDate = new Date(gotoBtn.dataset.date + 'T00:00:00'); currentPlannerTab = 'daily'; renderPlanner(); return; }
  const mcDay = e.target.closest('.mc-day');
  if (mcDay) { viewDate = new Date(mcDay.dataset.date + 'T00:00:00'); currentPlannerTab = 'daily'; renderPlanner(); return; }

  const tskCheck = e.target.closest('.tsk-check');
  if (tskCheck && tskCheck.dataset.list) {
    const listName = tskCheck.dataset.list;
    const idx = parseInt(tskCheck.dataset.idx);
    const list = data.planner.days[key] && data.planner.days[key][listName];
    if (list && list[idx]) {
      list[idx].done = !list[idx].done;
      tskCheck.classList.toggle('checked', list[idx].done);
      const pItem = tskCheck.closest('.p-item');
      if (pItem) pItem.classList.toggle('done', list[idx].done);
      updateDayProgressInPlace();
      save();
    }
    return;
  }
  const delBtn = e.target.closest('.p-del[data-list]');
  if (delBtn) {
    const listName = delBtn.dataset.list;
    const idx = parseInt(delBtn.dataset.idx);
    const list = data.planner.days[key] && data.planner.days[key][listName];
    if (list) { list.splice(idx, 1); save(); renderPlanner(); }
    return;
  }
  const habitCell = e.target.closest('.habit-cell');
  if (habitCell) {
    const habitId = habitCell.dataset.habitId;
    const dKey = habitCell.dataset.dateKey;
    const habit = data.planner.habitList.find(h => h.id === habitId);
    if (habit) {
      if (!habit.history) habit.history = {};
      habit.history[dKey] = !habit.history[dKey];
      habitCell.classList.toggle('active', !!habit.history[dKey]);
      updateHabitStreakPills(habitId);
      save();
    }
    return;
  }
  const delHabit = e.target.closest('[data-del-habit]');
  if (delHabit) {
    if (!confirm('Удалить привычку?')) return;
    data.planner.habitList = data.planner.habitList.filter(h => h.id !== delHabit.dataset.delHabit);
    save(); renderPlanner();
    return;
  }
  const recDel = e.target.closest('[data-rec-del]');
  if (recDel) {
    data.planner.excel.daily.splice(parseInt(recDel.dataset.recDel), 1);
    save(); renderPlanner();
    return;
  }
}

function handlePlannerInput(e){
  if (!e.target.closest('#plannerContent')) return;
  const key = iso(viewDate);
  if (e.target.dataset.action === 'edit') {
    const listName = e.target.dataset.list;
    const idx = parseInt(e.target.dataset.idx);
    const list = data.planner.days[key] && data.planner.days[key][listName];
    if (list && list[idx]) { list[idx].text = e.target.value; save(); }
    return;
  }
  if (e.target.dataset.habitId && e.target.classList.contains('hn-label')) {
    const habit = data.planner.habitList.find(h => h.id === e.target.dataset.habitId);
    if (habit) { habit.name = e.target.textContent; save(); }
    return;
  }
  if (e.target.dataset.phead) {
    data.planner.headers[e.target.dataset.phead] = e.target.textContent;
    save();
    return;
  }
  if (e.target.id === 'pNotesArea') {
    if (!data.planner.days[key]) data.planner.days[key] = {};
    data.planner.days[key].notes = e.target.value;
    save();
    return;
  }
  if (e.target.dataset.recIdx) {
    data.planner.excel.daily[parseInt(e.target.dataset.recIdx)].text = e.target.value;
    save();
    return;
  }
}

function handlePlannerSubmit(e){
  if (!e.target.closest('#plannerContent')) return;
  e.preventDefault();
  const key = iso(viewDate);
  if (e.target.matches('.p-add-form[data-list]')) {
    const form = e.target;
    const listName = form.dataset.list;
    if (!data.planner.days[key]) data.planner.days[key] = {};
    if (!data.planner.days[key][listName]) data.planner.days[key][listName] = [];
    let text = form.querySelector('input[type="text"]:last-of-type').value.trim();
    let time = '';
    if (listName === 'schedule') time = form.querySelector('.p-time-input').value.trim();
    if (!text) return;
    data.planner.days[key][listName].push({ id: uid(), text, time, done: false });
    save(); form.reset(); renderPlanner();
    return;
  }
  if (e.target.id === 'pAddHabitForm') {
    const input = e.target.querySelector('input');
    if (!input.value.trim()) return;
    data.planner.habitList.push({ id: uid(), name: input.value.trim(), history: {} });
    save(); renderPlanner();
    return;
  }
  if (e.target.id === 'pRecAddForm') {
    const text = e.target.querySelector('input[type="text"]').value.trim();
    if (!text) return;
    if (!data.planner.excel) data.planner.excel = { daily: [] };
    if (!data.planner.excel.daily) data.planner.excel.daily = [];
    data.planner.excel.daily.push({ id: uid(), text, checks: [] });
    save(); renderPlanner();
    return;
  }
}

function updateDayProgressInPlace(){
  const key = iso(viewDate);
  const dayData = data.planner.days[key] || {};
  const imp = dayData.important || [];
  const add = dayData.additional || [];
  const total = imp.length + add.length;
  const done = imp.filter(t=>t.done).length + add.filter(t=>t.done).length;
  const pct = total ? Math.round(done/total*100) : 0;
  const donut = document.querySelector('#plannerContent .p-donut');
  const donutText = document.querySelector('#plannerContent .p-donut-text');
  const progressLabel = document.querySelector('#plannerContent .p-progress-label');
  if (donut) donut.style.setProperty('--p', pct);
  if (donutText) donutText.textContent = pct + '%';
  if (progressLabel) progressLabel.textContent = `${done} из ${total} задач`;
}

function updateHabitStreakPills(habitId){
  const habit = data.planner.habitList.find(h => h.id === habitId);
  if (!habit) return;
  const streaks = calcHabitStreaks(habit);
  const container = document.querySelector(`#plannerContent [data-habit-row="${habitId}"] .habit-streaks`);
  if (container) container.innerHTML = renderStreakPillsHtml(streaks);
}

function renderPlanner() {
  const container = document.getElementById('plannerContent');
  if (!container) return;
  if (!data.planner) data.planner = defaultPlanner();
  if (!data.planner.days) data.planner.days = {};
  if (!data.planner.habitList) data.planner.habitList = [];
  if (!data.planner.headers) data.planner.headers = defaultPlanner().headers;

  const key = iso(viewDate);
  document.querySelectorAll('.btn-planner').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.ptab === currentPlannerTab);
  });

  if (currentPlannerTab === 'daily') {
    const dayData = data.planner.days[key] || { important: [], additional: [], schedule: [], dontForget: [], notes: '' };
    const important = dayData.important || [];
    const additional = dayData.additional || [];
    const schedule = dayData.schedule || [];
    const dontForget = dayData.dontForget || [];
    const notes = dayData.notes || '';
    const totalTasks = important.length + additional.length;
    const doneTasks = important.filter(t=>t.done).length + additional.filter(t=>t.done).length;
    const progress = totalTasks === 0 ? 0 : Math.round((doneTasks / totalTasks) * 100);

    container.innerHTML = `
      <div class="p-day-head">
        <button class="icon-btn" id="pPrevDay">‹</button>
        <div class="p-donut" style="--p:${progress}">
          <div class="p-donut-text">${progress}%</div>
        </div>
        <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;position:relative;z-index:1;">
          <h3 class="p-day-title" contenteditable="true">${formatDateFull(viewDate)}</h3>
          <div class="p-progress-label">${doneTasks} из ${totalTasks} задач</div>
        </div>
        <button class="icon-btn" id="pNextDay">›</button>
        <button class="btn-planner" id="pToday" style="padding:8px 12px;border-radius:8px;background:var(--btn-accent);color:var(--on-btn-accent);border:none;color:#fff;">Сегодня</button>
      </div>

      <div class="daily-planner-grid">
        <div style="display:flex;flex-direction:column;gap:20px">
          <div class="p-section">
            <div class="p-section-head" contenteditable="true" data-phead="important">${esc(data.planner.headers.important)}</div>
            <div class="p-list" id="pListImportant"></div>
            <form class="p-add-form" data-list="important">
              <input type="text" placeholder="Добавить..." required>
              <button type="submit">+</button>
            </form>
          </div>
          <div class="p-section">
            <div class="p-section-head" contenteditable="true" data-phead="additional">${esc(data.planner.headers.additional)}</div>
            <div class="p-list" id="pListAdditional"></div>
            <form class="p-add-form" data-list="additional">
              <input type="text" placeholder="Добавить..." required>
              <button type="submit">+</button>
            </form>
          </div>
          <div class="p-section">
            <div class="p-section-head" contenteditable="true" data-phead="schedule">${esc(data.planner.headers.schedule)}</div>
            <div class="p-list" id="pListSchedule"></div>
            <form class="p-add-form" data-list="schedule">
              <input type="text" placeholder="Время" style="flex:0 0 60px" class="p-time-input">
              <input type="text" placeholder="Дело..." required style="flex:1">
              <button type="submit">+</button>
            </form>
          </div>
        </div>

        <div style="display:flex;flex-direction:column;gap:20px">
          <div class="p-section">
            <div class="p-section-head" contenteditable="true" data-phead="habits">${esc(data.planner.headers.habits)}</div>
            <div class="habits-wrap">
              <div class="habits-grid" id="pHabitGrid">
                <div class="habit-head-cell first">Привычка</div>
                ${['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(d=>`<div class="habit-head-cell">${d}</div>`).join('')}
              </div>
            </div>
            <form class="p-add-form" id="pAddHabitForm">
              <input type="text" placeholder="Новая привычка..." required>
              <button type="submit">+</button>
            </form>
          </div>

          <div class="p-section">
            <div class="p-section-head" contenteditable="true" data-phead="dontForget">${esc(data.planner.headers.dontForget)}</div>
            <div class="p-list" id="pListDontForget"></div>
            <form class="p-add-form" data-list="dontForget">
              <input type="text" placeholder="Добавить..." required>
              <button type="submit">+</button>
            </form>
          </div>

          <div class="p-section">
            <div class="p-section-head" contenteditable="true" data-phead="notes">${esc(data.planner.headers.notes)}</div>
            <textarea id="pNotesArea" style="width:100%;min-height:100px;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px;color:var(--text);outline:none;resize:vertical;">${esc(notes)}</textarea>
          </div>
        </div>
      </div>
    `;

    function renderPList(listId, arr, listName) {
      const listEl = container.querySelector(`#${listId}`);
      if(!listEl) return;
      listEl.innerHTML = '';
      if (!arr.length) {
        listEl.innerHTML = '<div style="color:var(--muted);font-size:12px;padding:5px">Нет задач</div>';
      } else {
        arr.forEach((task, idx) => {
          const row = document.createElement('div');
          row.className = 'p-item' + (task.done ? ' done' : '');
          row.innerHTML = `
            <div class="tsk-check ${task.done ? 'checked' : ''}" data-list="${listName}" data-idx="${idx}"></div>
            ${listName === 'schedule' ? `<span style="font-size:12px;color:var(--muted);flex:0 0 60px">${esc(task.time||'')}</span>` : ''}
            <input type="text" value="${esc(task.text)}" data-action="edit" data-list="${listName}" data-idx="${idx}">
            <button class="p-del" data-list="${listName}" data-idx="${idx}">×</button>`;
          listEl.appendChild(row);
        });
      }
    }
    renderPList('pListImportant', important, 'important');
    renderPList('pListAdditional', additional, 'additional');
    renderPList('pListSchedule', schedule, 'schedule');
    renderPList('pListDontForget', dontForget, 'dontForget');

    const weekStart = startOfWeek(viewDate);
    const habitGrid = container.querySelector('#pHabitGrid');
    data.planner.habitList.forEach((habit) => {
      const streaks = calcHabitStreaks(habit);
      const nameCell = document.createElement('div');
      nameCell.className = 'habit-name';
      nameCell.dataset.habitRow = habit.id;
      nameCell.innerHTML = `
        <div class="hn-row">
          <span class="hn-label" contenteditable="true" data-habit-id="${habit.id}">${esc(habit.name)}</span>
          <button class="p-del" style="font-size:14px" data-del-habit="${habit.id}">×</button>
        </div>
        <div class="habit-streaks">${renderStreakPillsHtml(streaks)}</div>`;
      habitGrid.appendChild(nameCell);

      for(let i=0;i<7;i++){
        const d = addDays(weekStart, i);
        const dKey = iso(d);
        const isDone = habit.history && habit.history[dKey];
        const cell = document.createElement('div');
        cell.className = 'habit-cell' + (isDone ? ' active' : '');
        cell.dataset.habitId = habit.id;
        cell.dataset.dateKey = dKey;
        habitGrid.appendChild(cell);
      }
    });

  } else if (currentPlannerTab === 'weekly') {
    const weekStart = startOfWeek(viewDate);
    let html = `<div style="display:flex;align-items:center;gap:10px;margin-bottom:20px;">
      <button class="icon-btn" id="pPrevWeek">‹</button>
      <h3 style="margin:0;flex:1;text-align:center">Неделя: ${formatWeekRange(weekStart, addDays(weekStart, 6))}</h3>
      <button class="icon-btn" id="pNextWeek">›</button>
    </div>
    <div class="weekly-planner">`;
    for (let i=0; i<7; i++) {
      const d = addDays(weekStart, i);
      const dKey = iso(d);
      const dayData = data.planner.days[dKey] || { important: [], additional: [] };
      const allTasks = [...(dayData.important||[]), ...(dayData.additional||[])];
      const done = allTasks.filter(t=>t.done).length;
      const pct = allTasks.length ? Math.round(done/allTasks.length*100) : 0;
      html += `
        <div class="weekly-day">
          <div class="weekly-day-head">
            <div>${formatDateHuman(d)}</div>
            <div style="font-size:10px;color:var(--muted);margin-top:4px">${done}/${allTasks.length} · ${pct}%</div>
          </div>
          <div class="weekly-tasks">
            ${allTasks.map(t => `<div style="font-size:12px;text-decoration:${t.done?'line-through':'none'};opacity:${t.done?0.5:1};margin-bottom:4px">• ${esc(t.text)}</div>`).join('')}
            ${!allTasks.length ? '<div style="font-size:12px;color:var(--muted);text-align:center">Пусто</div>' : ''}
          </div>
          <div style="padding:10px;border-top:1px solid var(--border)">
            <button class="btn-goto-day" data-date="${dKey}" style="width:100%;padding:6px;border-radius:6px;background:var(--btn-accent);color:var(--on-btn-accent);font-weight:bold;border:none;font-family:inherit;cursor:pointer">Открыть день</button>
          </div>
        </div>`;
    }
    html += `</div>`;
    container.innerHTML = html;

  } else if (currentPlannerTab === 'monthly') {
    let html = `
      <div class="monthly-calendar">
        <div class="mc-head">
          <button class="icon-btn" id="pPrevMonth">‹</button>
          <h3>${MONTHS_NOM[calTabMonth.getMonth()]} ${calTabMonth.getFullYear()}</h3>
          <button class="icon-btn" id="pNextMonth">›</button>
        </div>
        <div class="mc-grid" id="pMonthlyGrid">
          ${DOW_SHORT.map(d=>`<div style="text-align:center;font-size:12px;font-weight:bold;padding:10px 0">${d}</div>`).join('')}
        </div>
      </div>`;
    container.innerHTML = html;
    const grid = container.querySelector('#pMonthlyGrid');
    const y = calTabMonth.getFullYear(), m = calTabMonth.getMonth();
    const so = (new Date(y, m, 1).getDay() + 6) % 7;
    const dim = new Date(y, m + 1, 0).getDate();
    const today = todayDate();
    for(let i=0; i<so; i++) grid.innerHTML += `<div></div>`;
    for(let d=1; d<=dim; d++) {
      const date = new Date(y, m, d);
      const key = iso(date);
      const prog = getDayProgress(key);
      const isToday = sameDay(date, today);
      grid.innerHTML += `
        <div class="mc-day ${isToday?'today':''}" data-date="${key}">
          <span class="num">${d}</span>
          ${prog ? `<div class="mc-donut" style="--p:${prog.pct}"></div>` : ''}
        </div>`;
    }

  } else if (currentPlannerTab === 'recurring') {
    container.innerHTML = `
      <div class="p-section">
        <div class="p-section-head">Повторяющиеся задачи</div>
        <div class="p-list" id="pRecList"></div>
        <form class="p-add-form" id="pRecAddForm" style="margin-top:10px">
          <input type="text" placeholder="Задача..." required style="flex:2">
          <select style="flex:1;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:6px;font-family:inherit">
            <option value="daily">Каждый день</option>
            <option value="weekly">Каждую неделю</option>
            <option value="monthly">Каждый месяц</option>
          </select>
          <button type="submit">+</button>
        </form>
      </div>`;
    const list = container.querySelector('#pRecList');
    const recs = (data.planner.excel && data.planner.excel.daily) || [];
    if(!recs.length) list.innerHTML = '<div style="color:var(--muted);font-size:12px">Пока нет повторяющихся задач</div>';
    recs.forEach((r, i) => {
      const row = document.createElement('div');
      row.className = 'p-item';
      row.innerHTML = `
        <input type="text" value="${esc(r.text)}" data-rec-idx="${i}">
        <button class="p-del" data-rec-del="${i}">×</button>`;
      list.appendChild(row);
    });

  } else if (currentPlannerTab === 'extra') {
    container.innerHTML = `
      <div class="p-section">
        <div class="p-section-head">Заметки / Проекты / Идеи</div>
        <textarea id="pGlobalNotes" style="width:100%;min-height:300px;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px;color:var(--text);outline:none;resize:vertical;">${esc((data.planner.excel && data.planner.excel.extra) || '')}</textarea>
      </div>`;
    container.querySelector('#pGlobalNotes').addEventListener('input', e => {
      if(!data.planner.excel) data.planner.excel = {};
      data.planner.excel.extra = e.target.value; save();
    });
  }
}

function openActionsModal(adminMode){
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  const btnStyle = 'display:block;width:100%;text-align:left;border:1px solid var(--border);background:var(--hover);color:var(--text);padding:12px 14px;border-radius:12px;font:inherit;font-size:14px;cursor:pointer;font-family:inherit;margin-bottom:6px';
  let buttons = '';
  buttons += `<button style="${btnStyle}" data-act="reminders">🔔 Напоминания о парах</button>`;
  buttons += `<button style="${btnStyle}" data-act="ics">📆 Экспорт в календарь (.ics)</button>`;
  buttons += `<button style="${btnStyle}" data-act="jsonOut">💾 Скачать бэкап (.json)</button>`;
  buttons += `<button style="${btnStyle}" data-act="jsonIn">📥 Загрузить расписание (.json)</button>`;
  buttons += `<button style="${btnStyle};color:#e03131" data-act="wipePersonal">🗑 Очистить личные данные</button>`;
  backdrop.innerHTML = `
    <div class="modal">
      <h3>⚙️ ${adminMode ? 'Действия и экспорт' : 'Мои действия'}</h3>
      ${buttons}
      <div class="modal-actions"><button class="primary" id="actClose">Закрыть</button></div>
    </div>`;
  document.body.appendChild(backdrop);
  const close = () => backdrop.remove();
  backdrop.addEventListener('click', e => { if(e.target === backdrop) close(); });
  backdrop.querySelector('#actClose').onclick = close;
  backdrop.addEventListener('click', e => {
    const btn = e.target.closest('[data-act]');
    if(!btn) return;
    const a = btn.dataset.act;
    close();
    if(a === 'reminders') openRemindersModal();
    if(a === 'ics') exportICS();
    if(a === 'jsonOut') exportJSON();
    if(a === 'jsonIn') $('#fileInput').click();
    if(a === 'wipePersonal'){
      if(confirm('Очистить только твои личные данные?')){
        data.checklists = {}; data.clubs = []; data.planner = defaultPlanner();
        data.itemStates = {}; data.hwStates = {}; data.materialStates = {};
        data.settings = { notifyEnabled: true, notifyMinutes: 15 };
        save(); renderAll(); toast('Личные данные очищены');
      }
    }
  });
}

function openProfileLinksModal(){

      <button type="button" class="copy-link-btn" data-url="${esc(url)}" style="border:none;background:var(--btn-accent);color:var(--on-btn-accent);padding:6px 10px;border-radius:6px;cursor:pointer;font-family:inherit;font-size:12px;font-weight:600">Копировать</button>

profileBtn.addEventListener('click', e => { e.stopPropagation(); closeMenus(); openProfileMenu(); });

      <button data-act="adminLogout">🚪 Выйти из админа</button>
      <button data-act="profileLinks">🔗 Ссылки профилей</button>
      <button data-act="actions">⚙️ Действия и экспорт</button>
      <hr>
      <button data-act="changeAvatar">🖼 Сменить аватарку</button>
      <button data-act="newProfile">➕ Новый профиль</button>`;
  } else {
    extra = `
      <button data-act="openPlannerNewTab">🗓 Открыть планер в новой вкладке</button>
      <hr>
      <button data-act="adminLogin">🔑 Войти как админ</button>
      <button data-act="changeAvatar">🖼 Сменить аватарку</button>
      <button data-act="actionsUser">⚙️ Мои действия</button>`;
  }
  menu.innerHTML = `<div class="label">${isAdmin ? 'Профили' : 'Мой профиль'}</div>${items}<hr>${extra}`;
  document.body.appendChild(menu);
  menu.addEventListener('click', ev => {
    const del = ev.target.closest('[data-del]');
    if(del){
      ev.stopPropagation();
      if(!isAdmin){ toast('Только админ может удалять профили'); return; }
      const pid = del.dataset.del;
      const prof = profiles.list.find(p => p.id === pid);
      if(profiles.list.length <= 1){ toast('Нельзя удалить последний'); return; }
      if(!confirm(`Удалить профиль «${prof.name}»?`)) return;
      cancelPendingSaves();
      profiles.list = profiles.list.filter(p => p.id !== pid);
      if(profiles.current === pid) profiles.current = profiles.list[0].id;
      try{ localStorage.removeItem(dataKeyFor(pid)); }catch(e){}
      try{ supa.from('personal_data').delete().eq('id', 'personal-' + pid).then(()=>{}, ()=>{}); }catch(e){}
      saveProfiles(profiles); closeMenus();
      (async () => {
        const p = await fetchPersonal(profiles.current);
        lastPersonal = p || defaultPersonal();
        rebuildAndRender(); subscribeRealtime();
      })();
      toast(`Профиль «${prof.name}» удалён`);
      return;
    }
    const sw = ev.target.closest('[data-switch]');
    if(sw){
      if(!isAdmin){ closeMenus(); return; }
      const pid = sw.dataset.switch;
      if(pid === profiles.current){ closeMenus(); return; }
      persistLocal(); cancelPendingSaves();
      profiles.current = pid;
      saveProfiles(profiles);
      history.replaceState(null, '', '?p=' + pid);
      closeMenus(); localPersonalCache = null;
      try{ const p = localStorage.getItem(dataKeyFor(pid)); if(p) localPersonalCache = splitData(JSON.parse(p)).personal; }catch(e){}
      (async () => {
        const p = await fetchPersonal(pid);
        lastPersonal = p || localPersonalCache || defaultPersonal();
        rebuildAndRender(); subscribeRealtime();
        toast(`Профиль: ${currentProfile().name}`);
      })();
      return;
    }
    const act = ev.target.closest('[data-act]');
    if(!act) return;
    const a = act.dataset.act;
    if(a === 'openPlannerNewTab'){ closeMenus(); window.open(window.location.pathname + '?planner=true', '_blank'); return; }
    if(a === 'adminLogin'){ closeMenus(); adminLogin(); return; }
    if(a === 'adminLogout'){ closeMenus(); adminLogout(); return; }
    if(a === 'profileLinks'){
      if(!isAdmin){ toast('Только для админа'); return; }
      closeMenus(); openProfileLinksModal(); return;
    }
    if(a === 'actions'){ closeMenus(); openActionsModal(true); return; }
    if(a === 'actionsUser'){ closeMenus(); openActionsModal(false); return; }
    if(a === 'changeAvatar'){
      closeMenus();
      const p = currentProfile();
      openAvatarPicker(p.name, p.avatarImg, (name, img) => {
        const prof = profiles.list.find(x => x.id === profiles.current);
        if(!prof) return;
        prof.name = name; prof.avatarImg = img;
        saveProfiles(profiles); renderProfileBadge();
        toast('Аватарка обновлена');
      });
      return;
    }
    if(a === 'newProfile'){
      if(!isAdmin){ toast('Только для админа'); return; }
      closeMenus();
      openAvatarPicker('', '', (name, img) => {
        const newP = { id: 'p_'+Date.now().toString(36)+Math.random().toString(36).slice(2,4), name, avatarImg: img };
        persistLocal(); cancelPendingSaves();
        profiles.list.push(newP); profiles.current = newP.id;
        saveProfiles(profiles);
        history.replaceState(null, '', '?p=' + newP.id);
        lastPersonal = defaultPersonal(); localPersonalCache = null;
        personalWriteInFlight = true;
        pushPersonal(newP.id, lastPersonal).finally(() => { personalWriteInFlight = false; });
        rebuildAndRender(); subscribeRealtime();
        toast(`Создан профиль «${name}»`);
      });
    }
  });
}
function openAvatarPicker(initialName, initialImg, onSave){
  let selectedImg = initialImg || '';
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.innerHTML = `
    <div class="modal">
      <h3>${initialName ? 'Настройки профиля' : 'Новый профиль'}</h3>
      <input class="modal-input" id="avName" placeholder="Имя профиля" maxlength="30" value="${esc(initialName||'')}" autocomplete="off">
      <div style="margin-top:12px">
        <div style="font-size:12px;color:var(--muted);margin-bottom:8px;font-weight:600">Аватарка</div>
        <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
          <div id="avPreview" style="width:64px;height:64px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800;overflow:hidden;flex:0 0 auto"></div>
          <input type="file" id="avFile" accept="image/*" hidden>
          <button type="button" id="avUploadBtn" style="padding:8px 14px;border-radius:12px;border:1px solid var(--border);background:var(--hover);color:var(--text);cursor:pointer;font-family:inherit;font-size:13px">🖼 Загрузить из галереи</button>
          <span id="avFileName" style="font-size:12px;color:var(--muted)"></span>
        </div>
      </div>
      <div class="modal-actions">
        <button class="secondary" id="avCancel" type="button">Отмена</button>
        <button class="primary" id="avSave" type="button">Сохранить</button>
      </div>
    </div>`;
  document.body.appendChild(backdrop);
  const nameInput = backdrop.querySelector('#avName');
  const avFile = backdrop.querySelector('#avFile');
  const avPreview = backdrop.querySelector('#avPreview');
  function updatePreview(){
    if(selectedImg) avPreview.innerHTML = `<img src="${esc(selectedImg)}" style="width:100%;height:100%;object-fit:cover">`;
    else {
      const n = nameInput.value.trim();
      avPreview.textContent = (n||'?').charAt(0).toUpperCase() || '?';
    }
  }
  setTimeout(() => nameInput.focus(), 50);
  updatePreview();
  nameInput.addEventListener('input', updatePreview);
  backdrop.querySelector('#avUploadBtn').onclick = () => avFile.click();
  avFile.onchange = () => {
    const file = avFile.files && avFile.files[0];
    if(!file) return;
    if(file.size > 300 * 1024){ toast('Макс. 300 КБ для аватарки'); avFile.value = ''; return; }
    const r = new FileReader();
    r.onload = () => {
      selectedImg = r.result;
      backdrop.querySelector('#avFileName').textContent = file.name;
      updatePreview();
    };
    r.readAsDataURL(file);
  };
  nameInput.addEventListener('keydown', e => { if(e.key === 'Enter') backdrop.querySelector('#avSave').click(); });
  const close = () => backdrop.remove();
  backdrop.addEventListener('click', e => { if(e.target === backdrop) close(); });
  backdrop.querySelector('#avCancel').onclick = close;
  backdrop.querySelector('#avSave').onclick = () => {
    const name = nameInput.value.trim().slice(0, 30);
    if(!name){ toast('Введи имя'); nameInput.focus(); return; }
    close();
    onSave(name, selectedImg);
  };
}

function download(name, text, type){
  const blob = new Blob([text], {type});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}
function exportJSON(){
  const payload = { ...data, profileName: currentProfile().name };
  download(`raspisanie-${currentProfile().name}.json`, JSON.stringify(payload, null, 2), 'application/json');
  toast('Бэкап сохранён');
}
$('#fileInput').addEventListener('change', e => {
  const file = e.target.files && e.target.files[0]; if(!file) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const parsed = JSON.parse(r.result);
      if(!parsed || typeof parsed !== 'object') throw new Error('bad');
      const sp = splitData(parsed);
      data = mergeData(sp.shared, sp.personal);
      save(); renderAll();
      toast('Расписание загружено ✓');
    }catch(err){ toast('Не удалось прочитать файл'); }
  };
  r.readAsText(file); e.target.value = '';
});

function icsEsc(s){ return String(s||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n'); }
function icsStamp(d){ return `${d.getUTCFullYear()}${pad(d.getUTCMonth()+1)}${pad(d.getUTCDate())}T${pad(d.getUTCHours())}${pad(d.getUTCMinutes())}${pad(d.getUTCSeconds())}Z`; }
function icsDT(date, minutes){
  const d = new Date(date.getFullYear(), date.getMonth(), date.getDate(), 0, minutes, 0);
  return `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}00`;
}
function fold(line){
  if(line.length <= 74) return line;
  let out = line.slice(0,74), rest = line.slice(74);
  while(rest.length){ out += '\r\n ' + rest.slice(0,73); rest = rest.slice(73); }
  return out;
}
function exportICS(){
  const stamp = icsStamp(new Date());
  const lines = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Study Schedule//RU','CALSCALE:GREGORIAN','METHOD:PUBLISH',
    'X-WR-CALNAME:' + icsEsc('Расписание — ' + currentProfile().name),
    'X-WR-TIMEZONE:' + (Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC')];
  let count = 0;
  Object.keys(data.days).sort().forEach(key => {
    const date = new Date(key + 'T00:00:00');
    (data.days[key] || []).forEach(item => {
      const slot = parseSlot(item.time);
      if(!slot || !item.subject) return;
      count++;
      const tLabel = TYPE_LABEL[item.type] || '';
      const summary = tLabel ? `${item.subject} (${tLabel})` : item.subject;
      lines.push('BEGIN:VEVENT');
      lines.push('UID:' + date.getTime() + '-' + item.id + '@study-schedule');
      lines.push('DTSTAMP:' + stamp);
      lines.push('DTSTART:' + icsDT(date, slot.start));
      lines.push('DTEND:' + icsDT(date, slot.end));
      lines.push('SUMMARY:' + icsEsc(summary));
      if(item.room) lines.push('LOCATION:' + icsEsc(item.room));
      lines.push('END:VEVENT');
    });
  });
  data.clubs.forEach(c => {
    if(!c.date || !c.name) return;
    const date = new Date(c.date + 'T00:00:00');
    const slot = parseSlot(c.time) || {start: 0, end: 60};
    count++;
    lines.push('BEGIN:VEVENT');
    lines.push('UID:' + date.getTime() + '-' + c.id + '@clubs');
    lines.push('DTSTAMP:' + stamp);
    lines.push('DTSTART:' + icsDT(date, slot.start));
    lines.push('DTEND:' + icsDT(date, slot.end));
    lines.push('SUMMARY:' + icsEsc('🎨 ' + c.name));
    if(c.place) lines.push('LOCATION:' + icsEsc(c.place));
    lines.push('END:VEVENT');
  });
  lines.push('END:VCALENDAR');
  if(!count){ toast('Нет данных'); return; }
  download('raspisanie.ics', lines.map(fold).join('\r\n') + '\r\n', 'text/calendar;charset=utf-8');
  toast(`Экспортировано ${count} событий`);
}

$('#searchInput').addEventListener('input', () => renderList());
$('#searchClear').addEventListener('click', () => { $('#searchInput').value = ''; renderList(); });

function renderAll(){
  renderProfileBadge();
  const ae = document.activeElement;
  const typingInPlanner = ae && ae.closest('#plannerContent') && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA' || ae.isContentEditable);
  if (document.body.classList.contains('planner-page')) {
    if (!typingInPlanner) renderPlanner();
    return;
  }
  renderHome();
  if(currentTab === 'calendar') renderCalendar();
  if(currentTab === 'homework') renderHomework();
  if(currentTab === 'clubs') renderClubs();
  if(currentTab === 'materials') renderMaterials();
  if(currentTab === 'links') renderLinks();
}

async function initApp(){
  const urlParams = new URLSearchParams(location.search);

  if (urlParams.get('planner') === 'true') {
    document.body.classList.add('planner-page');
    const standalone = document.getElementById('planner-standalone');
    standalone.innerHTML = `
      <div class="planner-modal-content">
        <div class="planner-header">
          <h2>
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <rect x="3" y="5" width="18" height="16" rx="3"/>
              <line x1="3" y1="10" x2="21" y2="10"/>
              <line x1="8" y1="3" x2="8" y2="7"/>
              <line x1="16" y1="3" x2="16" y2="7"/>
            </svg>
            Мой планер
          </h2>
          <button class="icon-btn" id="pCloseWindow" title="Закрыть">✕</button>
        </div>
        <div class="planner-body">
          <div class="planner-tabs-wrap">
            <div class="planner-tabs">
              <button class="btn-planner active" data-ptab="daily">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 15"/></svg>
                День
              </button>
              <button class="btn-planner" data-ptab="weekly">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="8" y1="3" x2="8" y2="7"/><line x1="16" y1="3" x2="16" y2="7"/><line x1="8" y1="14" x2="16" y2="14"/></svg>
                Неделя
              </button>
              <button class="btn-planner" data-ptab="monthly">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/><circle cx="8" cy="14" r="1"/><circle cx="12" cy="14" r="1"/><circle cx="16" cy="14" r="1"/><circle cx="8" cy="18" r="1"/><circle cx="12" cy="18" r="1"/></svg>
                Месяц
              </button>
              <button class="btn-planner" data-ptab="recurring">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
                Повторяющиеся
              </button>
              <button class="btn-planner" data-ptab="extra">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="16" y2="17"/></svg>
                Заметки
              </button>
            </div>
          </div>
          <div id="plannerContent"></div>
        </div>
      </div>`;
    document.getElementById('pCloseWindow').onclick = () => window.close();
    bindPlannerTabs();
    bindPlannerEvents();

    try {
      const urlP = urlParams.get('p');
      if (urlP && profiles.list.some(p => p.id === urlP)) {
        profiles.current = urlP; saveProfiles(profiles);
      }
    } catch(e){}

    await loadCloudData();
    if (!data || !data.planner) data = defaultData();
    renderPlanner();
    subscribeRealtime();
    return;
  }

  try{
    const urlP = new URLSearchParams(location.search).get('p');
    if(urlP && profiles.list.some(p => p.id === urlP)){
      profiles.current = urlP; saveProfiles(profiles);
    }
  }catch(e){}

  switchTab('home');
  await loadCloudData();
  autoCrossOut();
  setInterval(autoCrossOut, 30000);
  checkReminders();
  setInterval(checkReminders, 30000);
}

async function loadCloudData() {
  try{
    const s = localStorage.getItem(SHARED_LOCAL_KEY);
    if(s) localSharedCache = JSON.parse(s);
    const p = localStorage.getItem(dataKeyFor(profiles.current));
    if(p) localPersonalCache = splitData(JSON.parse(p)).personal;
  }catch(e){}
  if(localSharedCache) lastShared = localSharedCache;
  if(localPersonalCache) lastPersonal = localPersonalCache;
  if(lastShared || lastPersonal) rebuildAndRender();

  setSyncStatus('saving');
  const cloudShared = await fetchShared();
  const cloudPersonal = await fetchPersonal(profiles.current);

  if(cloudShared){ lastShared = cloudShared; }
  else if(localSharedCache){ lastShared = localSharedCache; await pushShared(lastShared); }
  else { lastShared = { days:{}, homework:{}, materials:{} }; await pushShared(lastShared); }

  if(cloudPersonal){ lastPersonal = cloudPersonal; }
  else if(localPersonalCache){ lastPersonal = localPersonalCache; await pushPersonal(profiles.current, lastPersonal); }
  else { lastPersonal = defaultPersonal(); await pushPersonal(profiles.current, lastPersonal); }

  rebuildAndRender();
  setSyncStatus('synced');
  subscribeRealtime();
}

initApp();
</script>
