<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Моё расписание</title>

<link rel="manifest" href='data:application/manifest+json,{"name":"Моё расписание","short_name":"Расписание","start_url":"./","display":"standalone","background_color":"%231B1A2F","theme_color":"%231B1A2F","icons":[{"src":"data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Crect width=%22100%22 height=%22100%22 rx=%2224%22 fill=%22%231B1A2F%22/%3E%3Crect x=%2214%22 y=%2226%22 width=%2272%22 height=%2260%22 rx=%2212%22 fill=%22%23b41b2d%22/%3E%3Crect x=%2214%22 y=%2226%22 width=%2272%22 height=%2218%22 rx=%2212%22 fill=%22%23f0d9c0%22/%3E%3Crect x=%2224%22 y=%2216%22 width=%229%22 height=%2222%22 rx=%224.5%22 fill=%22%23f0d9c0%22/%3E%3Crect x=%2267%22 y=%2216%22 width=%229%22 height=%2222%22 rx=%224.5%22 fill=%22%23f0d9c0%22/%3E%3Ccircle cx=%2234%22 cy=%2258%22 r=%225%22 fill=%22%23f0d9c0%22/%3E%3Ccircle cx=%2250%22 cy=%2258%22 r=%225%22 fill=%22%23f0d9c0%22/%3E%3Ccircle cx=%2266%22 cy=%2258%22 r=%225%22 fill=%22%23f0d9c0%22/%3E%3Ccircle cx=%2234%22 cy=%2272%22 r=%225%22 fill=%22%23f0d9c0%22 opacity=%220.55%22/%3E%3Ccircle cx=%2250%22 cy=%2272%22 r=%225%22 fill=%22%23f0d9c0%22 opacity=%220.55%22/%3E%3C/svg%3E","sizes":"192x192","type":"image/svg+xml"}]}'>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  /* ===== ЦВЕТОВАЯ ПАЛИТРА И ТЕМЫ ===== */
  :root{
    --c-dark-bg:#1B1A2F; --c-dark-card:#242E49; --c-dark-border:#37415C;
    --c-dark-accent:#b41b2d; --c-dark-burgundy:#54162B; --c-dark-navy:#37415C;
    --c-dark-peach:#f0d9c0; --c-dark-text:#fdfbf7; --c-dark-muted:#9ba4c4;
    --c-light-bg:#f5f0e8; --c-light-card:#fffdf8; --c-light-border:#e0d5c5;
    --c-light-accent:#b41b2d; --c-light-text:#1f1a2f; --c-light-muted:#6a6478;
    --c-warm-bg:#2a1e1a; --c-warm-card:#3d2c25; --c-warm-border:#5a3e32;
    --c-warm-accent:#d4473a; --c-warm-text:#f8ede0; --c-warm-muted:#b89a85;
    --c-pink-bg:#fdf2f8; --c-pink-card:#ffffff; --c-pink-border:#fbcfe8;
    --c-pink-accent:#db2777; --c-pink-text:#1f2937; --c-pink-muted:#6b7280;
  }
  [data-theme="dark"]{
    --bg:var(--c-dark-bg); --card:var(--c-dark-card); --text:var(--c-dark-text);
    --muted:var(--c-dark-muted); --border:var(--c-dark-border); --accent:var(--c-dark-accent);
    --on-accent:#fff; --hover:#2d3a56; --lms:#7b9ad4; --miss:var(--c-dark-accent);
    --shadow:0 8px 30px rgba(0,0,0,.55); --icon-bg:var(--card);
    --icon-border:1px solid var(--border); --card-radius:16px; --card-border:1px solid var(--border);
    --tab-active-bg:var(--accent); --on-tab-active:#fff;
    --strike-color:var(--c-dark-accent); --btn-accent:var(--c-dark-accent); --on-btn-accent:#fff;
    /* Синий, Золотой, Красный (БЕЗ ЗЕЛЕНОГО) */
    --type-lec:#5d8bf4; --type-prac:#e09f3e; --type-lab:#b41b2d;
    --peach-accent:var(--c-dark-peach);
  }
  [data-theme="light"]{
    --bg:var(--c-light-bg); --card:var(--c-light-card); --text:var(--c-light-text);
    --muted:var(--c-light-muted); --border:var(--c-light-border); --accent:var(--c-light-accent);
    --on-accent:#fff; --hover:#ede4d5; --lms:#2d7a4f; --miss:var(--c-light-accent);
    --shadow:0 4px 20px rgba(0,0,0,.06); --icon-bg:var(--card);
    --icon-border:1px solid var(--border); --card-radius:14px; --card-border:1px solid var(--border);
    --tab-active-bg:var(--accent); --on-tab-active:#fff;
    --strike-color:currentColor; --btn-accent:var(--c-light-accent); --on-btn-accent:#fff;
    --type-lec:#2563eb; --type-prac:#d97706; --type-lab:#dc2626;
    --peach-accent:#c4a882;
  }
  [data-theme="warm"]{
    --bg:var(--c-warm-bg); --card:var(--c-warm-card); --text:var(--c-warm-text);
    --muted:var(--c-warm-muted); --border:var(--c-warm-border); --accent:var(--c-warm-accent);
    --on-accent:#fff; --hover:#4a362c; --lms:#8a9a5b; --miss:var(--c-warm-accent);
    --shadow:0 8px 30px rgba(0,0,0,.5); --icon-bg:var(--card);
    --icon-border:1px solid var(--border); --card-radius:16px; --card-border:1px solid var(--border);
    --tab-active-bg:var(--accent); --on-tab-active:#fff;
    --strike-color:var(--c-warm-accent); --btn-accent:var(--c-warm-accent); --on-btn-accent:#fff;
    --type-lec:#6b8ecf; --type-prac:#e09f3e; --type-lab:#d4473a;
    --peach-accent:#c4a882;
  }
  /* РОЗОВАЯ ТЕМА */
  [data-theme="pink"]{
    --bg:var(--c-pink-bg); --card:var(--c-pink-card); --text:var(--c-pink-text);
    --muted:var(--c-pink-muted); --border:var(--c-pink-border); --accent:var(--c-pink-accent);
    --on-accent:#fff; --hover:#fce7f3; --lms:#059669; --miss:#e11d48;
    --shadow:0 4px 20px rgba(219,39,119,.08); --icon-bg:var(--card);
    --icon-border:1px solid var(--border); --card-radius:14px; --card-border:1px solid var(--border);
    --tab-active-bg:var(--accent); --on-tab-active:#fff;
    --strike-color:var(--c-pink-accent); --btn-accent:var(--c-pink-accent); --on-btn-accent:#fff;
    --type-lec:#8b5cf6; --type-prac:#f59e0b; --type-lab:#db2777;
    --peach-accent:#db2777;
  }

  *{box-sizing:border-box;}
  html{transition:background .3s ease;scroll-behavior:smooth;overflow-x:hidden;}
  body{margin:0;padding:14px 14px 110px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;
    background:var(--bg);color:var(--text);transition:background .3s ease,color .3s ease;
    -webkit-font-smoothing:antialiased;overflow-x:hidden;}
  body *{transition:background-color .2s ease,border-color .2s ease,color .2s ease;}
  input[type="checkbox"]{position:absolute;opacity:0;width:0;height:0;pointer-events:none;}
  button{font-family:inherit;cursor:pointer;border:none;background:transparent;color:inherit;padding:0;}

  /* ЗАЧЕРКИВАНИЕ */
  .strike{position:relative;text-decoration:none !important;opacity:.6;}
  .strike::after{content:'';position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);
    height:1.5px;background-color:var(--strike-color);pointer-events:none;}
  .strike-inline {
    text-decoration: line-through !important;
    text-decoration-thickness: 2px !important;
    text-decoration-color: var(--strike-color) !important;
    opacity: 0.6;
    display: inline-block;
    width: 100%;
    word-break: break-word;
    overflow-wrap: anywhere;
  }

  /* СЛАЙДЕР */
  .slider-container{position:relative;overflow:hidden;}
  .slider-bg{position:absolute;background:var(--tab-active-bg);border-radius:16px;
    transition:transform .35s cubic-bezier(.2,.9,.2,1),width .35s cubic-bezier(.2,.9,.2,1);
    z-index:1;pointer-events:none;will-change:transform,width;}
  .slider-container button,.slider-container .day{position:relative;z-index:2;transition:color .2s ease;}

  .view-wrapper{position:relative;width:100%;overflow:hidden;}
  .view{display:flex;flex-direction:column;width:100%;}
  .view[hidden]{display:none !important;}
  
  /* Плавный и быстрый переход (без тяжелых сдвигов) */
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .view.active-view { animation: fadeIn .2s ease forwards; }

  .app{max-width:900px;margin:0 auto;}

  /* ШАПКА */
  header.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;}
  header.topbar h1{font-size:20px;margin:0;letter-spacing:-.3px;}
  .sync-status{display:flex;align-items:center;justify-content:center;font-size:18px;width:40px;height:40px;
    border-radius:50%;background:var(--icon-bg);border:var(--icon-border);box-shadow:var(--shadow);flex:0 0 auto;}
  .sync-status.spin{animation:syncSpin 1s linear infinite;}
  @keyframes syncSpin{0%{transform:rotate(0)}50%{transform:rotate(180deg)}100%{transform:rotate(360deg)}}
  .actions{display:flex;gap:8px;align-items:center;}
  .icon-btn{background:var(--icon-bg);border:var(--icon-border);width:40px;height:40px;border-radius:50%;
    font-size:16px;cursor:pointer;box-shadow:var(--shadow);color:var(--text);display:flex;align-items:center;
    justify-content:center;position:relative;flex:0 0 auto;}
  .icon-btn:active{transform:scale(.9);}
  .icon-btn .bell-dot{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;
    background:var(--lms);border:2px solid var(--icon-bg);display:none;}
  .icon-btn.bell-on .bell-dot{display:block;}
  .profile-btn{display:flex;align-items:center;gap:8px;background:var(--icon-bg);border:var(--icon-border);
    height:40px;padding:0 16px 0 7px;border-radius:20px;cursor:pointer;box-shadow:var(--shadow);
    font-family:inherit;color:var(--text);font-size:13px;font-weight:600;}
  .profile-btn .profile-emoji{width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--on-accent);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;overflow:hidden;}
  .profile-btn .profile-emoji img{width:100%;height:100%;object-fit:cover;border-radius:50%;}
  .profile-btn .profile-name{max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

  /* HERO BANNER */
  .hero-banner{
    position:relative;overflow:hidden;border-radius:22px;padding:20px 22px;margin-bottom:14px;
    background:linear-gradient(135deg,#1B1A2F 0%,#242E49 50%,#54162B 100%);
    border:1px solid var(--border);box-shadow:0 12px 40px rgba(0,0,0,.4);
    display:flex;align-items:center;gap:16px;
  }
  [data-theme="light"] .hero-banner, [data-theme="pink"] .hero-banner { background:linear-gradient(135deg,var(--card) 0%,color-mix(in srgb,var(--accent) 15%,var(--card)) 100%); }
  .hero-banner .hero-blob{position:absolute;border-radius:50%;pointer-events:none;filter:blur(30px);animation:floatBlob 12s ease-in-out infinite alternate;}
  .hero-blob-1{width:180px;height:180px;background:rgba(180,27,45,.55);right:-60px;top:-80px;}
  .hero-blob-2{width:140px;height:140px;background:rgba(123,154,212,.35);left:-40px;bottom:-70px;animation-delay:-4s;}
  .hero-blob-3{width:90px;height:90px;background:rgba(84,22,43,.7);right:35%;top:40%;animation-delay:-8s;}
  @keyframes floatBlob{0%{transform:translate(0,0) scale(1);}100%{transform:translate(16px,-18px) scale(1.08);}}
  .hero-banner .hero-content{position:relative;z-index:1;flex:1;min-width:0;}
  .hero-banner .hero-eyebrow{font-size:10px;font-weight:800;letter-spacing:1.6px;color:var(--peach-accent);opacity:.85;margin-bottom:4px;}
  .hero-banner .hero-title{margin:0 0 4px;font-size:20px;font-weight:800;color:var(--text);letter-spacing:-.3px;}
  .hero-banner .hero-sub{font-size:13px;color:var(--muted);font-weight:500;}
  .hero-banner .hero-art{position:relative;z-index:1;flex:0 0 auto;display:flex;align-items:center;justify-content:center;}

  /* ГЛАВНАЯ */
  .search-wrap{position:relative;margin-bottom:10px;}
  .search{width:100%;padding:12px 42px 12px 40px;border-radius:16px;background:var(--card);
    border:var(--card-border);box-shadow:var(--shadow);font:inherit;font-size:14px;color:var(--text);outline:none;}
  .search::placeholder{color:var(--muted);opacity:.8;}
  .search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:14px;pointer-events:none;}
  .search-clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:none;background:transparent;
    color:var(--muted);font-size:16px;cursor:pointer;padding:5px 9px;border-radius:8px;line-height:1;display:none;}
  .search-wrap.has-value .search-clear{display:block;}

  .week-nav{display:flex;align-items:center;gap:4px;margin-bottom:12px;background:var(--card);
    border:var(--card-border);border-radius:16px;padding:5px 7px;box-shadow:var(--shadow);}
  .week-nav .arrow{border:none;background:transparent;color:var(--text);font-size:24px;line-height:1;
    height:44px;min-width:44px;padding:0 10px;border-radius:12px;cursor:pointer;display:flex;
    align-items:center;justify-content:center;font-family:inherit;}
  .week-nav .arrow.week-btn{font-size:22px;letter-spacing:-6px;font-weight:600;padding-right:12px;}
  .week-range{flex:1 1 auto;text-align:center;font-size:14px;font-weight:600;padding:0 4px;min-width:0;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .week-range .sub{font-size:12px;color:var(--muted);font-weight:500;display:block;margin-top:1px;}
  .today-btn{border:none;background:var(--btn-accent);color:var(--on-btn-accent);font:inherit;font-size:13px;
    font-weight:600;padding:9px 15px;border-radius:12px;cursor:pointer;flex:0 0 auto;}
  .today-btn[hidden]{display:none;}

  .days{display:flex;gap:6px;padding-bottom:4px;margin-bottom:10px;position:relative;}
  .day{flex:1 1 0;min-width:42px;border:none;background:transparent;color:var(--muted);padding:8px 3px;
    border-radius:16px;font-weight:600;cursor:pointer;position:relative;font-family:inherit;
    display:flex;flex-direction:column;align-items:center;gap:2px;border:1px solid transparent;z-index:2;}
  .day .rel{font-size:8px;font-weight:600;line-height:11px;height:11px;white-space:nowrap;color:var(--muted);
    opacity:.7;width:100%;text-align:center;overflow:hidden;text-overflow:ellipsis;padding:0 2px;}
  .day.today .rel{color:var(--accent);opacity:1;font-weight:800;}
  .day.active .rel{color:var(--on-tab-active);opacity:.9;}
  .day .dow{font-size:11px;opacity:.85;}
  .day .num{font-size:16px;font-weight:700;color:var(--text);line-height:1.15;}
  .day .mini-dots{display:flex;gap:2px;margin-top:2px;flex-wrap:wrap;justify-content:center;max-width:100%;
    height:5px;align-items:center;}
  .day .mini-dot{width:5px;height:5px;border-radius:50%;flex:0 0 auto;}
  .day .mini-more{font-size:8px;color:var(--muted);line-height:1;margin-left:1px;}
  .day.active{color:var(--on-tab-active);}
  .day.active .num{color:var(--on-tab-active);}
  .day.today:not(.active) .num{color:var(--accent);}
  .day.today:not(.active){border-color:var(--accent);}

  .stats{font-size:13px;color:var(--muted);margin:0 0 10px 4px;min-height:16px;}
  .empty{text-align:center;color:var(--muted);padding:24px 12px 16px;font-size:14px;}
  .empty svg{display:block;margin:0 auto 10px;opacity:.65;color:var(--muted);}

  /* КАРТОЧКИ ЗАНЯТИЙ */
  .card{display:flex;gap:10px;align-items:flex-start;position:relative;background:var(--card);
    border-radius:var(--card-radius);padding:14px 14px 14px 12px;border-left:6px solid var(--c,#999);
    box-shadow:var(--shadow);margin-bottom:10px;border-top:var(--card-border);
    border-right:var(--card-border);border-bottom:var(--card-border);overflow:hidden;word-break:break-word;}
  [data-theme="dark"] .card{border:1px solid var(--border);border-left:none;}
  [data-theme="dark"] .card::before{content:'';position:absolute;left:0;top:16px;bottom:16px;width:6px;
    border-radius:0 6px 6px 0;background:var(--c,#999);}
  .card.done .strike-target{opacity:.6;}
  .card.done .grip,.card.done .type,.card.done .check,.card.done .dot,.card.done .lms-block{opacity:.5;}
  .card.done{background:color-mix(in srgb,var(--card) 70%,var(--bg));}
  .grip{flex:0 0 auto;border:none;background:transparent;color:var(--muted);cursor:grab;font-size:20px;
    padding:2px 3px;line-height:1;opacity:.45;font-family:inherit;}
  .check{display:flex;padding-top:2px;cursor:pointer;flex:0 0 auto;}
  .box{width:22px;height:22px;border-radius:50%;border:2px solid var(--c,#999);display:block;position:relative;flex:0 0 auto;}
  .check input:checked + .box{background:var(--c,#999);}
  .check input:checked + .box::after{content:'';position:absolute;left:7px;top:3px;width:5px;height:10px;
    border:solid var(--on-accent);border-width:0 2.5px 2.5px 0;transform:rotate(45deg);}
  .body{flex:1 1 auto;min-width:0;}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .dot{flex:0 0 auto;width:12px;height:12px;border-radius:50%;background:#8b90a6;}
  .card.current .dot,.card.future .dot{background:var(--c);}
  input,textarea,select{font:inherit;background:transparent;border:none;color:inherit;outline:none;padding:2px 0;min-width:0;max-width:100%;}
  input::placeholder,textarea::placeholder{color:var(--muted);opacity:.7;}
  .time{width:92px;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;}
  .subject{flex:1 1 120px;font-weight:600;font-size:15px;word-break:break-word;}
  .room{width:80px;font-size:14px;color:var(--muted);text-align:right;}
  .teacher{width:100%;margin-top:3px;font-size:13px;color:var(--muted);font-style:italic;word-break:break-word;}
  textarea{resize:none;width:100%;margin-top:6px;font-size:13px;color:var(--muted);line-height:1.45;overflow:hidden;}
  .type{appearance:none;border:1px solid var(--border);border-radius:8px;padding:3px 22px 3px 9px;
    font-size:11.5px;font-weight:700;cursor:pointer;background:var(--hover);color:var(--muted);
    text-transform:uppercase;outline:none;font-family:inherit;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='8' height='5' viewBox='0 0 8 5'><path d='M0 0l4 4 4-4' fill='none' stroke='%238b90a6' stroke-width='1.4'/></svg>");
    background-repeat:no-repeat;background-position:right 6px center;}
  .type[data-t="lec"]{background-color:color-mix(in srgb,var(--type-lec) 18%,transparent);color:var(--type-lec);border-color:color-mix(in srgb,var(--type-lec) 45%,transparent);}
  .type[data-t="prac"]{background-color:color-mix(in srgb,var(--type-prac) 18%,transparent);color:var(--type-prac);border-color:color-mix(in srgb,var(--type-prac) 45%,transparent);}
  .type[data-t="lab"]{background-color:color-mix(in srgb,var(--type-lab) 18%,transparent);color:var(--type-lab);border-color:color-mix(in srgb,var(--type-lab) 45%,transparent);}
  .lms-block{flex:0 0 auto;align-self:flex-start;display:flex;flex-direction:column;align-items:center;
    gap:4px;padding-top:1px;}
  .lms-label{font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.3px;color:var(--muted);
    text-align:center;line-height:1.15;white-space:nowrap;}
  .lms-btns{display:flex;gap:4px;}
  .lms-btn{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--border);background:transparent;
    color:var(--muted);cursor:pointer;font-size:13px;font-weight:800;line-height:1;display:flex;
    align-items:center;justify-content:center;font-family:inherit;padding:0;}
  .lms-btn.attended.active{background:var(--lms);color:#fff;border-color:var(--lms);}
  .lms-btn.missed.active{background:var(--miss);color:#fff;border-color:var(--miss);}
  .more{flex:0 0 auto;align-self:flex-start;background:transparent;border:none;color:var(--muted);
    cursor:pointer;font-size:20px;padding:3px 7px;border-radius:50%;opacity:.6;line-height:1;font-family:inherit;}

  /* ДЗ В КАРТОЧКЕ НА ГЛАВНОЙ */
  .card-hw { margin-top: 8px; border-top: 1px dashed var(--border); padding-top: 8px; }
  .card-hw-title { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); margin-bottom: 6px; }
  .card-hw-title .hw-count { background: var(--hover); padding: 1px 5px; border-radius: 4px; font-size: 10px; color: var(--text); margin-left: 4px; }
  .card-hw-list { display: flex; flex-direction: column; gap: 4px; }
  .card-hw-empty { font-size: 12px; color: var(--muted); opacity: .8; font-style: italic; }
  .card-hw-item { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .chw-check { display: flex; align-items: center; cursor: pointer; flex: 0 0 auto; }
  .chw-box { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--accent); display: block; position: relative; background: transparent; }
  .chw-check input:checked + .chw-box { background: var(--accent); }
  .chw-check input:checked + .chw-box::after { content: ''; position: absolute; left: 4px; top: 1px; width: 4px; height: 8px; border: solid var(--on-accent); border-width: 0 2px 2px 0; transform: rotate(45deg); }
  .chw-text { flex: 1; word-break: break-word; }
  .chw-del { background: none; border: none; color: var(--muted); opacity: .5; font-size: 14px; cursor: pointer; }
  .card-hw-add { display: flex; gap: 6px; margin-top: 6px; }
  .card-hw-add input { flex: 1; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 4px 8px; font-size: 12px; color: var(--text); }
  .card-hw-add button { background: var(--btn-accent); color: var(--on-btn-accent); border: none; border-radius: 6px; padding: 0 10px; font-weight: 700; font-size: 16px; cursor: pointer; }

  /* МЕНЮ */
  .menu{position:fixed;z-index:2000;background:var(--card);border:var(--card-border);border-radius:16px;
    box-shadow:0 10px 40px rgba(0,0,0,.5);padding:7px;min-width:210px;max-height:80vh;overflow-y:auto;
    overscroll-behavior:contain;}
  .menu::-webkit-scrollbar{width:6px;}
  .menu::-webkit-scrollbar-thumb{background:var(--peach-accent);opacity:.5;border-radius:3px;}
  .menu .label{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);
    padding:7px 10px 5px;font-weight:700;}
  .menu button{display:block;width:100%;text-align:left;border:none;background:transparent;color:var(--text);
    padding:9px 11px;border-radius:10px;font:inherit;font-size:14px;cursor:pointer;font-family:inherit;}
  .menu button:hover{background:var(--hover);}
  .menu button.danger:hover{background:rgba(255,107,107,.18);color:#ff6b6b;}
  .menu hr{border:none;border-top:1px dashed var(--border);margin:6px 4px;}
  .chips{display:flex;flex-wrap:wrap;gap:5px;padding:2px 8px 8px;}
  .chips button{width:auto;display:inline-block;padding:6px 10px;font-size:12.5px;font-weight:600;
    background:var(--hover);border-radius:8px;}
  .profile-menu{min-width:230px;}
  .profile-item{display:flex;align-items:center;gap:9px;width:100%;padding:8px 10px;background:transparent;
    color:var(--text);border-radius:10px;cursor:pointer;font-size:14px;text-align:left;}
  .profile-item:hover{background:var(--hover);}
  .profile-item.current{background:color-mix(in srgb,var(--accent) 18%,transparent);}
  .profile-item .pi-emoji{width:30px;height:30px;border-radius:50%;flex:0 0 auto;background:var(--accent);
    color:var(--on-accent);display:flex;align-items:center;justify-content:center;font-size:12px;
    font-weight:800;overflow:hidden;}
  .profile-item .pi-emoji img{width:100%;height:100%;object-fit:cover;border-radius:50%;}
  .profile-item .pi-name{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;}
  .profile-item .pi-badge{font-size:10px;font-weight:700;color:var(--accent);text-transform:uppercase;}
  .profile-item .pi-del{flex:0 0 auto;border:none;background:transparent;color:var(--muted);cursor:pointer;
    font-size:16px;padding:2px 6px;border-radius:50%;opacity:.5;font-family:inherit;}
  .modal-input{width:100%;background:var(--hover);border:1px solid var(--border);border-radius:12px;
    padding:10px 12px;font-size:14px;color:var(--text);outline:none;font-family:inherit;margin-bottom:4px;}

  /* ЧЕК-ЛИСТ НА ГЛАВНОЙ */
  .home-checklist-sec{margin-top:14px;background:var(--card);border:var(--card-border);
    border-radius:var(--card-radius);padding:16px;box-shadow:var(--shadow);}
  .home-checklist-sec h3{margin:0 0 12px;font-size:15px;display:flex;align-items:center;gap:6px;}
  .home-checklist-add{display:flex;gap:8px;align-items:center;}
  .home-checklist-add input{flex:1;background:var(--hover);border:1px solid var(--border);
    border-radius:12px;padding:10px 14px;color:var(--text);outline:none;font-size:14px;}
  .home-checklist-add button{background:var(--btn-accent);color:var(--on-btn-accent);border:none;
    border-radius:50%;width:36px;height:36px;cursor:pointer;font-size:24px;display:flex;
    align-items:center;justify-content:center;flex:0 0 auto;padding:0;line-height:1;}

  .checklist-item{display:flex;gap:10px;align-items:center;padding:8px 6px;border-radius:10px;}
  .checklist-item .cl-check{position:relative;display:flex;align-items:center;cursor:pointer;flex:0 0 auto;}
  .cl-box{width:22px;height:22px;border-radius:50%;border:2px solid var(--accent);display:block;
    position:relative;background:transparent;flex:0 0 auto;}
  .cl-check input:checked + .cl-box{background:var(--accent);}
  .cl-check input:checked + .cl-box::after{content:'';position:absolute;left:7px;top:3px;width:5px;
    height:10px;border:solid var(--on-accent);border-width:0 2.5px 2.5px 0;transform:rotate(45deg);}
  .checklist-item .text{flex:1 1 auto;font-size:14px;color:var(--text);padding:2px 0;min-width:0;outline:none;}
  .checklist-item .del{flex:0 0 auto;border:none;background:transparent;color:var(--muted);cursor:pointer;
    font-size:16px;padding:2px 7px;border-radius:50%;opacity:.5;font-family:inherit;}

  /* КАЛЕНДАРЬ */
  .cal-box{background:var(--card);border-radius:var(--card-radius);padding:16px;box-shadow:var(--shadow);
    border:var(--card-border);margin-bottom:14px;}
  .cal-head{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:12px;}
  .cal-head .cal-month{font-size:15px;font-weight:700;text-align:center;flex:1 1 auto;}
  .cal-head .arrow{border:none;background:transparent;color:var(--text);font-size:22px;height:36px;
    min-width:36px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit;}
  .cal-dow{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:4px;}
  .cal-dow span{font-size:10.5px;font-weight:700;color:var(--muted);text-align:center;letter-spacing:.4px;padding:2px 0;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
  .cal-cell{aspect-ratio:1;border:1px solid transparent;background:transparent;border-radius:12px;
    cursor:pointer;position:relative;display:flex;flex-direction:column;align-items:center;
    justify-content:center;padding:4px;font-family:inherit;overflow:hidden;}
  .cal-cell.empty{visibility:hidden;pointer-events:none;}
  .cal-cell .num{font-size:14px;font-weight:700;color:var(--text);line-height:1;
    width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;}
  .cal-cell.today .num{background:var(--accent);color:var(--on-accent);}
  .cal-cell.selected{border-color:var(--accent);}
  .cal-cell.selected .num{background:var(--accent);color:var(--on-accent);}
  .cal2-dots{display:flex;gap:2px;justify-content:center;flex-wrap:wrap;max-width:100%;min-height:6px;margin-top:2px;}
  .cal2-dot{width:6px;height:6px;border-radius:50%;flex:0 0 auto;}
  .cal-donut{width:16px;height:16px;border-radius:50%;margin-top:2px;position:relative;
    background:conic-gradient(var(--accent) calc(var(--p) * 1%), var(--border) 0);}
  .cal-donut::after{content:'';position:absolute;inset:4px;border-radius:50%;background:var(--card);}
  .cal-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:12px;
    padding:0 4px;border-top:1px dashed var(--border);padding-top:10px;}
  .cal-legend .lg{display:flex;align-items:center;gap:6px;}
  .cal-legend .lg .dot{width:9px;height:9px;border-radius:50%;}
  .cal-events-title{font-size:14px;font-weight:700;margin:16px 0 8px 4px;color:var(--text);}
  .cal-event{display:flex;gap:10px;align-items:center;background:var(--card);border-radius:16px;
    padding:12px 14px;box-shadow:var(--shadow);margin-bottom:8px;cursor:pointer;
    border:var(--card-border);border-left:4px solid var(--c,#999);}
  .cal-event .ce-time{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;flex:0 0 80px;}
  .cal-event .ce-body{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;}
  .cal-event .ce-name{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .cal-event .ce-meta{font-size:12px;color:var(--muted);margin-top:1px;}
  .cal-event .ce-type{font-size:10px;font-weight:800;padding:2px 6px;border-radius:6px;background:var(--hover);
    color:var(--muted);text-transform:uppercase;letter-spacing:.3px;}
  .cal-empty-day{text-align:center;color:var(--muted);padding:18px 12px;font-size:13px;
    background:var(--card);border-radius:16px;box-shadow:var(--shadow);}
  .cal-hw-title{font-size:14px;font-weight:700;margin:16px 0 8px 4px;color:var(--text);
    display:flex;align-items:center;gap:8px;}
  .cal-hw-title .count{font-size:11px;font-weight:700;color:var(--muted);background:var(--card);
    padding:3px 9px;border-radius:8px;box-shadow:var(--shadow);}
  .cal-hw-list{display:flex;flex-direction:column;gap:6px;}
  .cal-hw-card{display:flex;align-items:flex-start;gap:10px;background:var(--card);border-radius:16px;
    padding:12px 14px;border-left:4px solid var(--accent);box-shadow:var(--shadow);
    border-top:var(--card-border);border-right:var(--card-border);border-bottom:var(--card-border);}
  .cal-hw-card .cl-check{position:relative;display:flex;align-items:center;cursor:pointer;flex:0 0 auto;}
  .cal-hw-card .hw-box{width:20px;height:20px;border-radius:50%;border:2px solid var(--accent);
    display:block;position:relative;background:transparent;margin-top:2px;}
  .cal-hw-card .cl-check input:checked + .hw-box{background:var(--accent);}
  .cal-hw-card .cl-check input:checked + .hw-box::after{content:'';position:absolute;left:6px;top:2px;
    width:5px;height:10px;border:solid var(--on-accent);border-width:0 2.5px 2.5px 0;transform:rotate(45deg);}
  .cal-hw-card .hw-body{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;}
  .cal-hw-card .hw-subj{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.3px;
    color:var(--accent);margin-bottom:2px;}
  .cal-hw-card .hw-txt{font-size:14px;font-weight:600;color:var(--text);word-break:break-word;
    overflow-wrap:anywhere;line-height:1.4;}
  .cal-hw-card.done{opacity:.65;}
  .cal-hw-card.done .hw-txt{text-decoration:line-through;color:var(--muted);}
  .cal-hw-empty{text-align:center;color:var(--muted);padding:14px 12px;font-size:13px;
    background:var(--card);border-radius:16px;box-shadow:var(--shadow);opacity:.8;}

  /* ДЗ */
  .page-title{font-size:18px;margin:0 0 14px;letter-spacing:-.3px;display:flex;align-items:center;gap:8px;}
  .page-title .badge{font-size:11px;font-weight:700;color:var(--muted);background:var(--card);
    padding:3px 9px;border-radius:8px;box-shadow:var(--shadow);}
  .hw-add{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-bottom:16px;}
  .hw-add input,.hw-add select{background:var(--card);border:1px solid var(--border);border-radius:12px;
    padding:10px 14px;font-size:14px;color:var(--text);outline:none;}
  .hw-add button{background:var(--btn-accent);color:var(--on-btn-accent);border:none;padding:10px 18px;
    border-radius:12px;font-weight:700;cursor:pointer;font-size:14px;font-family:inherit;white-space:nowrap;}
  .hw-add .full{grid-column:1 / -1;}
  .hw-group{background:var(--card);border-radius:var(--card-radius);box-shadow:var(--shadow);
    border:var(--card-border);margin-bottom:12px;border-left:6px solid var(--accent);overflow:hidden;}
  .hw-group-head{display:flex;align-items:center;gap:10px;padding:14px 16px;cursor:pointer;}
  .hw-dot{width:12px;height:12px;border-radius:50%;flex:0 0 auto;background:var(--accent);}
  .hw-name{flex:1 1 auto;font-weight:700;font-size:15px;min-width:0;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap;}
  .hw-counter{font-size:11px;font-weight:700;color:var(--muted);background:var(--hover);
    padding:4px 8px;border-radius:8px;}
  .hw-arrow{color:var(--muted);font-size:14px;transition:transform .3s;}
  .hw-group.collapsed .hw-arrow{transform:rotate(-90deg);}
  .hw-group.collapsed .hw-group-body{display:none;}
  .hw-group-body{padding:0 16px 14px;}
  .hw-item{display:flex;gap:10px;align-items:center;padding:8px 6px;border-radius:10px;flex-wrap:wrap;}
  .hw-item .cl-check{position:relative;display:flex;align-items:center;cursor:pointer;flex:0 0 auto;}
  .hw-box{width:20px;height:20px;border-radius:50%;border:2px solid var(--accent);display:block;
    position:relative;background:transparent;}
  .hw-item .cl-check input:checked + .hw-box{background:var(--accent);}
  .hw-item .cl-check input:checked + .hw-box::after{content:'';position:absolute;left:6px;top:2px;
    width:5px;height:10px;border:solid var(--on-accent);border-width:0 2.5px 2.5px 0;transform:rotate(45deg);}
  .hw-text{flex:1 1 auto;font-size:14px;color:var(--text);padding:2px 0;min-width:0;
    word-break:break-word;outline:none;border-radius:6px;}
  .hw-text:focus{background:var(--hover);padding:2px 6px;}
  .hw-item.done .hw-text{text-decoration:line-through;color:var(--muted);opacity:.7;}
  .hw-dl-input{flex:0 0 auto;font-size:11px;font-weight:700;padding:4px 8px;border-radius:8px;
    border:1px solid var(--border);background:var(--hover);color:var(--muted);font-family:inherit;
    width:120px;outline:none;cursor:pointer;}
  .hw-dl-input:focus{border-color:var(--accent);}
  .hw-from-card{font-size:10px;color:var(--accent);background:color-mix(in srgb,var(--accent) 15%,transparent);
    padding:1px 5px;border-radius:4px;font-weight:700;margin-left:6px;}
  .hw-item .del,.club-item .del{flex:0 0 auto;border:none;background:transparent;color:var(--muted);
    cursor:pointer;font-size:16px;padding:2px 7px;border-radius:50%;opacity:.5;font-family:inherit;}
  .hw-group.hw-done-group{border-left-color:var(--lms);}
  .hw-group.hw-done-group .hw-dot{background:var(--lms);}
  .hw-group.hw-done-group .hw-arrow{color:var(--lms);}

  /* КРУЖКИ */
  .club-day{background:var(--card);border-radius:var(--card-radius);box-shadow:var(--shadow);
    border:var(--card-border);margin-bottom:12px;overflow:hidden;border-left:6px solid var(--accent);}
  .club-day-head{display:flex;align-items:center;gap:10px;padding:14px 16px;cursor:pointer;}
  .club-day-name{flex:1 1 auto;font-weight:700;font-size:15px;}
  .club-day-cnt{font-size:11px;font-weight:700;color:var(--muted);background:var(--hover);
    padding:4px 8px;border-radius:8px;}
  .club-day.collapsed .hw-arrow{transform:rotate(-90deg);}
  .club-day.collapsed .club-day-body{display:none;}
  .club-day-body{padding:0 16px 14px;}
  .club-item{display:grid;grid-template-columns:72px 1fr 1fr auto;gap:8px;align-items:center;
    padding:6px 4px;border-radius:10px;}
  .club-item input{background:transparent;border:none;color:var(--text);font-size:14px;padding:4px 2px;
    min-width:0;outline:none;}
  .club-item input.club-time{font-size:13px;color:var(--muted);}
  .club-item input.club-name{font-weight:600;}
  .club-item input.club-place{font-size:13px;color:var(--muted);}

  /* ССЫЛКИ */
  .links-add{display:grid;grid-template-columns:1fr 2fr auto;gap:8px;margin-bottom:16px;}
  .links-add input{background:var(--card);border:1px solid var(--border);border-radius:12px;
    padding:10px 14px;font-size:14px;color:var(--text);outline:none;}
  .links-add button{background:var(--btn-accent);color:var(--on-btn-accent);border:none;padding:10px 18px;
    border-radius:12px;font-weight:700;cursor:pointer;font-size:14px;font-family:inherit;white-space:nowrap;}
  .link-item{display:flex;align-items:center;gap:14px;padding:14px 16px;background:var(--card);
    border-radius:var(--card-radius);box-shadow:var(--shadow);border:var(--card-border);margin-bottom:8px;
    text-decoration:none;color:var(--text);}
  .link-fav{width:40px;height:40px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;
    justify-content:center;font-weight:800;font-size:16px;color:var(--on-accent);background:var(--accent);}
  .link-info{flex:1 1 auto;min-width:0;}
  .link-title{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .link-url{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px;}
  .link-del{flex:0 0 auto;border:none;background:transparent;color:var(--muted);cursor:pointer;
    font-size:16px;padding:4px 8px;border-radius:50%;opacity:.5;font-family:inherit;}

  /* НИЖНЕЕ МЕНЮ (СКРОЛЛ) */
  .tabbar {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: 14px;
    width: calc(100% - 28px); max-width: 900px; background: var(--card);
    border: var(--card-border); border-radius: 24px; box-shadow: 0 8px 30px rgba(0,0,0,.4);
    display: flex; overflow-x: auto; padding: 8px; gap: 4px; z-index: 100;
    scrollbar-width: none; -webkit-overflow-scrolling: touch;
  }
  .tabbar::-webkit-scrollbar { display: none; }
  .tabbar button {
    border: none; background: transparent; color: var(--muted);
    padding: 8px 12px; border-radius: 16px; cursor: pointer; font-family: inherit;
    font-size: 10px; font-weight: 600; display: flex; flex-direction: column;
    align-items: center; gap: 4px; line-height: 1; flex: 1 0 auto; min-width: 56px;
  }
  .tabbar button .tb-icon { font-size: 20px; line-height: 1; }
  .tabbar button.active { color: var(--on-tab-active); }

  /* МОДАЛКИ */
  .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;
    justify-content:center;z-index:300;padding:16px;}
  .modal{background:var(--card);border-radius:24px;padding:24px;max-width:440px;width:100%;
    box-shadow:0 20px 60px rgba(0,0,0,.6);border:var(--card-border);max-height:90vh;overflow-y:auto;}
  .modal h3{margin:0 0 16px;font-size:18px;}
  .modal-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;
    border-top:1px dashed var(--border);flex-wrap:wrap;}
  .modal-row:first-of-type{border-top:none;padding-top:0;}
  .modal-row label{font-size:14px;font-weight:500;}
  .modal select,.modal input{background:var(--hover);border:1px solid var(--border);border-radius:12px;
    padding:10px 14px;font-size:14px;color:var(--text);outline:none;font-family:inherit;}
  .modal-actions{display:flex;gap:8px;margin-top:20px;justify-content:flex-end;flex-wrap:wrap;}
  .modal-actions button{border:none;padding:12px 20px;border-radius:12px;font-family:inherit;
    font-size:14px;font-weight:600;cursor:pointer;}
  .modal-actions .primary{background:var(--btn-accent);color:var(--on-btn-accent);}
  .modal-actions .secondary{background:var(--hover);color:var(--text);}

  /* МАТЕРИАЛЫ */
  .materials-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;}
  @media (max-width:720px){.materials-grid{grid-template-columns:1fr;}}
  .materials-col{background:var(--card);border-radius:var(--card-radius);box-shadow:var(--shadow);
    border:var(--card-border);padding:16px;min-height:200px;display:flex;flex-direction:column;overflow:hidden;}
  .materials-col h3{margin:0 0 12px;font-size:15px;display:flex;align-items:center;justify-content:space-between;gap:6px;cursor:pointer;}
  .materials-col h3 .m-arrow{font-size:12px;transition:transform .3s;color:var(--muted);}
  .materials-col.collapsed h3 .m-arrow{transform:rotate(-90deg);}
  .materials-col.collapsed .materials-list,
  .materials-col.collapsed .mat-add {display:none;}
  .materials-list{display:flex;flex-direction:column;gap:8px;margin-bottom:12px;flex:1;
    overflow-y:auto;max-height:400px;}
  .mat-item{background:var(--hover);border-radius:12px;padding:10px 12px;font-size:14px;position:relative;
    display:flex;flex-direction:column;gap:6px;border:1px solid transparent;word-break:break-word;overflow-wrap:anywhere;}
  .mat-item:hover{border-color:var(--border);}
  .mat-item .mat-text{white-space:pre-wrap;padding-right:24px;outline:none;border-radius:6px;transition:background .2s;display:inline-block;width:100%;}
  .mat-item .mat-text:focus{background:color-mix(in srgb,var(--accent) 10%,transparent);padding:4px;margin:-4px -4px 0 -4px;}
  .mat-item img.mat-img{max-width:100%;border-radius:8px;display:block;margin-top:4px;}
  .mat-item a.mat-link{color:var(--accent);text-decoration:none;font-weight:600;font-size:13px;
    display:inline-flex;align-items:center;gap:4px;padding-right:24px;word-break:break-all;margin-top:4px;}
  .mat-item .mat-del{position:absolute;top:6px;right:6px;border:none;background:transparent;
    color:var(--muted);cursor:pointer;font-size:15px;opacity:.5;padding:2px 6px;border-radius:50%;
    font-family:inherit;line-height:1;}
  .mat-add{display:flex;gap:6px;flex-wrap:wrap;align-items:center;width:100%;}
  .mat-add select{flex:1 1 80px;background:var(--hover);border:1px solid var(--border);border-radius:10px;
    padding:8px 12px;font-size:13px;color:var(--text);outline:none;font-family:inherit;min-width:0;}
  .mat-add input[type=text]{flex:2 1 120px;background:var(--hover);border:1px solid var(--border);
    border-radius:10px;padding:8px 12px;font-size:13px;color:var(--text);outline:none;font-family:inherit;min-width:0;}
  .mat-add button{background:var(--btn-accent);color:var(--on-btn-accent);border:none;padding:8px 14px;
    border-radius:10px;font-weight:600;cursor:pointer;font-family:inherit;font-size:13px;flex:0 0 auto;}
  .mat-file-btn{background:var(--hover)!important;color:var(--text)!important;
    border:1px solid var(--border)!important;}
  .mat-item.done .mat-text,.mat-item.done .mat-link{text-decoration:line-through;opacity:.5;}

  /* ===== ПЛАНЕР ===== */
  body.planner-page #main-app{display:none;}
  body.planner-page #planner-standalone{display:block;min-height:100vh;background:var(--bg);padding:20px;}
  #planner-standalone{display:none;}
  .planner-modal-content{background:var(--bg);width:100%;max-width:1400px;margin:0 auto;
    border-radius:22px;display:flex;flex-direction:column;border:1px solid var(--border);overflow:hidden;
    box-shadow:0 20px 60px rgba(0,0,0,.5);}
  
  .planner-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;
    background:linear-gradient(135deg,#1B1A2F 0%,#242E49 50%,#54162B 100%);
    border-bottom:1px solid var(--border);flex-wrap:wrap;gap:10px;
    position:sticky;top:0;z-index:10;position:relative;overflow:hidden;}
  [data-theme="light"] .planner-header, [data-theme="pink"] .planner-header { background:linear-gradient(135deg,var(--card) 0%,color-mix(in srgb,var(--accent) 15%,var(--card)) 100%); }
  .planner-header h2{margin:0;font-size:18px;font-weight:800;display:flex;align-items:center;gap:8px;letter-spacing:-.3px;color:var(--text);position:relative;z-index:1;}
  .planner-header .icon-btn {color: var(--text); background: var(--hover); border: var(--icon-border); z-index: 1;}
  .planner-body{flex:1;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:20px;}

  /* Планер-табы */
  .planner-tabs-wrap { position: relative; width: 100%; margin-bottom: 24px; overflow: hidden; }
  .planner-tabs{display:flex;gap:8px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:4px;}
  .planner-tabs::-webkit-scrollbar { display: none; }
  .btn-planner{
    padding:10px 16px;border-radius:14px;border:1px solid var(--border);
    background:var(--card);color:var(--text);font-weight:700;font-family:inherit;cursor:pointer;
    transition:background .25s,color .25s,transform .15s,border-color .25s;
    display:flex;align-items:center;gap:8px;font-size:13px;flex:0 0 auto;
  }
  .btn-planner svg{width:18px;height:18px;flex:0 0 auto;}
  .btn-planner:active{transform:scale(.96);}
  .btn-planner.active{background:var(--accent)!important;color:#fff!important;border-color:var(--accent);}

  .daily-planner-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
  @media (max-width:900px){.daily-planner-grid{grid-template-columns:1fr;}}

  .p-section{background:var(--card);border-radius:var(--card-radius);border:1px solid var(--border);
    padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow);
    position:relative;overflow:hidden;}
  .p-section::before{
    content:'';position:absolute;inset:0;pointer-events:none;
    background-image:radial-gradient(rgba(255,255,255,.03) 1px, transparent 1px);
    background-size:16px 16px;border-radius:inherit;}
  .p-section-head{font-weight:800;font-size:16px;display:flex;align-items:center;gap:8px;
    outline:none;color:var(--text);border-radius:6px;padding:2px 4px;position:relative;z-index:1;}
  .p-section-head:focus{background:var(--hover);}
  .p-list{display:flex;flex-direction:column;gap:4px;position:relative;z-index:1;}
  .p-item{display:flex;align-items:center;gap:8px;padding:6px;background:var(--bg);border-radius:8px;}
  .p-item.done .p-text{text-decoration:line-through;color:var(--muted);}
  .p-item input[type="text"]{flex:1;background:transparent;border:none;outline:none;color:var(--text);font-size:14px;}
  .p-item .tsk-check{width:18px;height:18px;border-radius:50%;border:2px solid var(--btn-accent);
    cursor:pointer;flex:0 0 auto;position:relative;transition:background .2s;}
  .p-item .tsk-check.checked{background:var(--btn-accent);}
  .p-item .tsk-check.checked::after{content:'';position:absolute;left:5px;top:1px;width:4px;height:8px;
    border:solid var(--on-btn-accent);border-width:0 2px 2px 0;transform:rotate(45deg);}
  .p-item .p-del{background:none;border:none;color:var(--muted);cursor:pointer;font-size:16px;}
  .p-add-form{display:flex;gap:6px;margin-top:4px;position:relative;z-index:1;}
  .p-add-form input{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:8px;
    padding:6px 10px;color:var(--text);font-size:13px;outline:none;}
  .p-add-form button{background:var(--btn-accent);color:var(--on-btn-accent);border:none;border-radius:50%;
    width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto;}

  /* Заголовок дня с донатом */
  .p-day-head{
    display:flex;align-items:center;gap:14px;margin-bottom:16px;
    background:linear-gradient(135deg,#1B1A2F 0%,#242E49 50%,#54162B 100%);
    padding:16px 18px;border-radius:22px;border:1px solid var(--border);box-shadow:0 12px 40px rgba(0,0,0,.4);
    position:relative;overflow:hidden;color:#fff;
  }
  [data-theme="light"] .p-day-head, [data-theme="pink"] .p-day-head { background:linear-gradient(135deg,var(--card) 0%,color-mix(in srgb,var(--accent) 15%,var(--card)) 100%); color: var(--text); }
  .p-day-head::before{
    content:'';position:absolute;width:200px;height:200px;right:-80px;top:-100px;
    border-radius:50%;background:radial-gradient(circle,rgba(180,27,45,.55) 0%,transparent 70%);
    pointer-events:none;
  }
  .p-day-head::after{
    content:'';position:absolute;width:160px;height:160px;left:-40px;bottom:-70px;
    border-radius:50%;background:radial-gradient(circle,rgba(123,154,212,.35) 0%,transparent 70%);
    pointer-events:none;
  }
  .p-day-head .p-day-title{flex:1;text-align:center;margin:0;font-size:16px;outline:none;
    border-radius:6px;padding:4px;position:relative;z-index:1;}
  .p-day-head .p-day-title:focus{background:rgba(255,255,255,0.1);}
  .p-day-head .p-progress-label{font-size:12px;color:var(--muted);text-align:center;position:relative;z-index:1;}
  .p-day-head .icon-btn { background: var(--hover); border: var(--icon-border); z-index: 1;}
  .p-donut{
    width:92px;height:92px;border-radius:50%;position:relative;flex:0 0 auto;
    background:conic-gradient(var(--accent) calc(var(--p) * 1%), var(--border) 0);
    transition:background .4s ease;display:flex;align-items:center;justify-content:center;
    box-shadow:0 0 26px color-mix(in srgb,var(--accent) 40%,transparent);
    z-index:1;
  }
  .p-donut::before{content:'';position:absolute;inset:10px;border-radius:50%;background:var(--card);}
  .p-donut-text{position:relative;z-index:1;font-weight:800;font-size:20px;color:var(--text);}

  /* Привычки */
  .habits-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px;position:relative;z-index:1;}
  .habits-grid{display:grid;grid-template-columns:minmax(150px,1.4fr) repeat(7,1fr);gap:4px;
    align-items:stretch;min-width:420px;}
  .habit-head-cell{font-size:10px;text-align:center;color:var(--muted);padding:2px 0;font-weight:700;}
  .habit-head-cell.first{text-align:right;padding-right:8px;}
  .habit-name{font-size:12px;font-weight:600;text-align:right;padding:4px 8px 4px 0;
    overflow:hidden;border-radius:6px;display:flex;flex-direction:column;gap:4px;align-items:flex-end;}
  .habit-name .hn-row{display:flex;gap:4px;align-items:center;justify-content:flex-end;width:100%;}
  .habit-name .hn-label{outline:none;text-align:right;flex:1;min-width:0;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap;}
  .habit-name .hn-label:focus{background:var(--hover);border-radius:4px;padding:0 4px;margin-right:-4px;}
  .habit-name .p-del{font-size:14px;opacity:.6;}
  .habit-streaks{display:flex;gap:3px;flex-wrap:wrap;justify-content:flex-end;width:100%;}
  .hs-pill{font-size:9px;font-weight:800;padding:2px 5px;border-radius:6px;background:var(--bg);
    color:var(--muted);line-height:1.1;white-space:nowrap;border:1px solid var(--border);
    transition:background .2s;}
  .hs-pill.active.hs-d{background:#e05555;color:#fff;border-color:transparent;}
  .hs-pill.active.hs-w{background:#7b9ad4;color:#fff;border-color:transparent;}
  .hs-pill.active.hs-m{background:#a83a55;color:#fff;border-color:transparent;}
  .habit-cell{aspect-ratio:1;border-radius:6px;background:var(--border);cursor:pointer;
    transition:background .2s,transform .1s;min-width:22px;}
  .habit-cell:active{transform:scale(.9);}
  .habit-cell.active{background:var(--btn-accent);}

  .weekly-planner{display:flex;gap:16px;overflow-x:auto;padding-bottom:10px;}
  .weekly-day{flex:0 0 280px;background:var(--card);border-radius:16px;border:1px solid var(--border);
    display:flex;flex-direction:column;box-shadow:var(--shadow);}
  .weekly-day-head{padding:12px;text-align:center;border-bottom:1px solid var(--border);font-weight:bold;}
  .weekly-tasks{padding:10px;flex:1;overflow-y:auto;min-height:180px;}
  .monthly-calendar{background:var(--card);border-radius:var(--card-radius);padding:20px;
    border:1px solid var(--border);box-shadow:var(--shadow);}
  .mc-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}
  .mc-head h3{margin:0;font-size:20px;}
  .mc-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
  .mc-day{aspect-ratio:1;border-radius:12px;display:flex;flex-direction:column;align-items:center;
    justify-content:center;cursor:pointer;border:1px solid transparent;padding:4px;}
  .mc-day:hover{background:var(--hover);}
  .mc-day.today{border-color:var(--accent);}
  .mc-day .num{font-size:16px;font-weight:bold;}
  .mc-day.today .num{color:var(--accent);}
  .mc-donut{width:20px;height:20px;border-radius:50%;margin-top:3px;position:relative;
    background:conic-gradient(var(--accent) calc(var(--p) * 1%), var(--border) 0);}
  .mc-donut::after{content:'';position:absolute;inset:5px;border-radius:50%;background:var(--card);}

  @media (max-width:720px){
    .bottom{grid-template-columns:1fr;gap:16px;}
    .hw-add{grid-template-columns:1fr;}
    .links-add{grid-template-columns:1fr;}
    .hero-banner{padding:16px;}
    .hero-banner .hero-title{font-size:18px;}
    .hero-banner .hero-art svg{width:64px;height:64px;}
  }
  @media (max-width:420px){
    .time{width:76px;} .room{width:64px;}
    h1{font-size:17px;}
    .day{padding:6px 2px;min-width:38px;}
    .day .num{font-size:14px;}
    .day .dow{font-size:10px;}
    .day .mini-dot{width:4px;height:4px;}
    .more{font-size:18px;} .grip{font-size:18px;}
    .lms-btn{width:24px;height:24px;font-size:12px;}
    .lms-label{font-size:8px;}
    .week-nav .arrow{min-width:36px;padding:0 5px;font-size:22px;}
    .profile-btn .profile-name{display:none;}
    .profile-btn{padding:0;width:40px;justify-content:center;height:40px;}
    .tabbar{bottom:10px;width:calc(100% - 20px);}
    .tabbar button{font-size:8px;}
    .club-item{grid-template-columns:64px 1fr auto;}
    .cal-cell .num{font-size:15px;width:24px;height:24px;}
    .habits-grid{min-width:360px;}
    .p-donut{width:76px;height:76px;}
    .p-donut-text{font-size:17px;}
    .hero-banner .hero-art{display:none;}
    .p-day-head { flex-direction: column; gap: 8px; text-align: center; }
    .p-day-head .icon-btn { position: absolute; top: 50%; transform: translateY(-50%); }
    #pPrevDay { left: 10px; }
    #pNextDay { right: 10px; }
    .p-day-head #pToday { margin-top: 8px; }
  }
</style>
</head>
<body>
<div id="main-app" class="app">
  <header class="topbar">
    <h1>📚 Моё расписание</h1>
    <div class="actions">
      <span id="syncStatus" class="sync-status">🟢</span>
      <button class="profile-btn" id="profileBtn">
        <span class="profile-emoji" id="profileEmoji"></span>
        <span class="profile-name" id="profileName">Основной</span>
      </button>
      <button class="icon-btn" id="bellBtn"><span>🔔</span><span class="bell-dot" id="bellDot"></span></button>
      <button class="icon-btn" id="themeBtn">☀️</button>
    </div>
  </header>

  <div class="view-wrapper">
    <main class="view" data-view="home" id="viewHome">
      <div class="hero-banner">
        <div class="hero-blob hero-blob-1"></div>
        <div class="hero-blob hero-blob-2"></div>
        <div class="hero-blob hero-blob-3"></div>
        <div class="hero-content">
          <div class="hero-eyebrow">📚 МОЁ РАСПИСАНИЕ</div>
          <h2 class="hero-title">Всё под контролем</h2>
          <div class="hero-sub" id="heroDateLabel">Сегодня</div>
        </div>
        <div class="hero-art">
          <svg viewBox="0 0 120 120" width="88" height="88">
            <rect x="20" y="30" width="80" height="70" rx="12" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>
            <path d="M20 42 Q20 30 32 30 L88 30 Q100 30 100 42 L100 48 L20 48 Z" fill="rgba(180,27,45,0.4)"/>
            <rect x="34" y="20" width="6" height="18" rx="3" fill="rgba(240,217,192,0.7)"/>
            <rect x="80" y="20" width="6" height="18" rx="3" fill="rgba(240,217,192,0.7)"/>
            <circle cx="38" cy="65" r="5" fill="rgba(255,255,255,0.6)"/>
            <circle cx="60" cy="65" r="5" fill="rgba(255,255,255,0.3)"/>
            <circle cx="82" cy="65" r="5" fill="rgba(255,255,255,0.3)"/>
            <circle cx="38" cy="83" r="5" fill="rgba(255,255,255,0.2)"/>
            <circle cx="60" cy="83" r="5" fill="rgba(255,255,255,0.15)"/>
            <circle cx="15" cy="15" r="2" fill="rgba(240,217,192,0.6)"/>
            <circle cx="105" cy="15" r="3" fill="rgba(240,217,192,0.4)"/>
            <circle cx="110" cy="105" r="2" fill="rgba(240,217,192,0.5)"/>
          </svg>
        </div>
      </div>

      <div class="search-wrap" id="searchWrap">
        <span class="search-icon">🔍</span>
        <input class="search" id="searchInput" type="search" placeholder="Поиск: предмет, преподаватель, аудитория…" autocomplete="off">
        <button class="search-clear" id="searchClear">✕</button>
      </div>
      <div id="weekSection">
        <div class="week-nav">
          <button class="arrow week-btn" id="prevWeek">«</button>
          <button class="arrow" id="prevDay">‹</button>
          <div class="week-range" id="weekRange"></div>
          <button class="arrow" id="nextDay">›</button>
          <button class="arrow week-btn" id="nextWeek">»</button>
          <button class="today-btn" id="todayBtn" hidden>Сегодня</button>
        </div>
        <nav class="days slider-container" id="days"></nav>
        <p class="stats" id="stats"></p>
        <div id="list"></div>
      </div>
      <div class="home-checklist-sec">
        <h3>📝 Мои дела</h3>
        <div class="checklist" id="homeChecklistList"></div>
        <form class="home-checklist-add" id="homeChecklistAddForm" autocomplete="off">
          <input name="task" placeholder="Добавить дело..." required>
          <button type="submit">+</button>
        </form>
      </div>
      <div class="bottom">
        <form class="add" id="addForm" autocomplete="off">
          <input name="time" placeholder="09:00-10:30">
          <input name="subject" placeholder="Название пары" required>
          <select name="type"><option value="">Тип</option><option value="lec">Лекция</option><option value="prac">Практика</option><option value="lab">Лаба</option></select>
          <input name="teacher" placeholder="Преподаватель">
          <input name="room" placeholder="ауд.">
          <button type="submit">+ Добавить</button>
          <div class="add-note" id="addNote"></div>
        </form>
      </div>
    </main>

    <main class="view" data-view="calendar" id="viewCalendar" hidden>
      <h2 class="page-title">📅 Календарь</h2>
      <div class="cal-box">
        <div class="cal-head">
          <button class="arrow" id="cal2Prev">‹</button>
          <div class="cal-month" id="cal2Month"></div>
          <button class="arrow" id="cal2Next">›</button>
        </div>
        <div class="cal-dow"><span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span>Сб</span><span>Вс</span></div>
        <div class="cal-grid" id="cal2Grid"></div>
        <div class="cal-legend">
          <div class="lg"><span class="dot" style="background:var(--type-lec)"></span>лекция</div>
          <div class="lg"><span class="dot" style="background:var(--type-prac)"></span>практика</div>
          <div class="lg"><span class="dot" style="background:var(--type-lab)"></span>лаба</div>
          <div class="lg">◔ прогресс дня</div>
        </div>
      </div>
      <div class="cal-events-title" id="cal2EventsTitle"></div>
      <div id="cal2Events"></div>
      <div class="cal-hw-title" id="cal2HwTitle"></div>
      <div class="cal-hw-list" id="cal2Hw"></div>
    </main>

    <main class="view" data-view="homework" id="viewHomework" hidden>
      <h2 class="page-title">📝 Домашние задания <span class="badge" id="hwBadge"></span></h2>
      <form class="hw-add" id="hwAddForm" autocomplete="off">
        <select name="subject" id="hwSubjectSelect" required>
          <option value="">— Предмет —</option>
        </select>
        <input name="newSubject" id="hwNewSubject" placeholder="Новый предмет (если нет в списке)">
        <input name="text" placeholder="Что задано" required>
        <input name="deadline" type="date">
        <button type="submit" class="full">+ Добавить задание</button>
      </form>
      <div id="hwList"></div>
    </main>

    <main class="view" data-view="clubs" id="viewClubs" hidden>
      <h2 class="page-title">🎨 Кружки и секции <span class="badge" id="clubsBadge"></span></h2>
      <form class="hw-add" id="clubsAddForm" autocomplete="off">
        <input name="date" type="date" required>
        <select name="repeat" style="background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 12px;font-size:14px;color:var(--text);">
          <option value="once">Один раз</option>
          <option value="weekly">Каждую неделю</option>
        </select>
        <input name="name" placeholder="Название" required>
        <input name="time" placeholder="15:00-16:30">
        <input name="place" placeholder="Где">
        <button type="submit" class="full">+ Добавить кружок</button>
      </form>
      <div id="clubsList"></div>
    </main>

    <main class="view" data-view="materials" id="viewMaterials" hidden>
      <h2 class="page-title">📂 Учебные материалы</h2>
      <div class="materials-grid">
        <section class="materials-col" id="matColNotes">
          <h3 onclick="document.getElementById('matColNotes').classList.toggle('collapsed')">
            <span>📝 Конспекты</span>
            <span class="m-arrow">▾</span>
          </h3>
          <div class="materials-list" id="materialsNotesList"></div>
          <form class="mat-add" id="materialsNotesForm" autocomplete="off">
            <select name="subject" class="mat-subj"><option value="">Предмет</option></select>
            <input type="text" name="text" placeholder="Текст конспекта…">
            <input type="file" id="materialsNotesFile" hidden>
            <button type="button" class="mat-file-btn" data-col="notes">📎</button>
            <button type="submit">+</button>
          </form>

function getDayProgress(key){

  if(!dayData) return null;

  const done = imp.filter(t => t.done).length + add.filter(t => t.done).length;
  return { done, total, pct: Math.round(done / total * 100) };
}

function shiftMonthKey(mk, delta){
  const [y, m] = mk.split('-').map(Number);
  let total = y * 12 + (m - 1) + delta;
  const ny = Math.floor(total / 12);
  const nm = (total % 12) + 1;
  return `${ny}-${String(nm).padStart(2,'0')}`;
}
function calcHabitStreaks(habit){
  const history = habit.history || {};
  const doneDates = Object.keys(history).filter(k => history[k]).sort();
  const today = todayDate();
  const todayKey = iso(today);
  let dailyCurrent = 0;
  let d = new Date(today);
  if(!history[todayKey]) d = addDays(d, -1);
  while(history[iso(d)]){ dailyCurrent++; d = addDays(d, -1); }
  let bestDaily = 0, run = 0, prev = null;
  doneDates.forEach(k => {
    const dt = new Date(k + 'T00:00:00');
    if(prev && daysBetween(dt, prev) === 1) run++; else run = 1;
    prev = dt;
    if(run > bestDaily) bestDaily = run;
  });
  const weekSet = new Set();
  doneDates.forEach(k => {
    const dt = new Date(k + 'T00:00:00');
    weekSet.add(iso(startOfWeek(dt)));
  });
  let weeklyCurrent = 0;
  let cw = weekSet.has(iso(startOfWeek(today))) ? new Date(iso(startOfWeek(today)) + 'T00:00:00') : addDays(startOfWeek(today), -7);
  while(weekSet.has(iso(cw))){ weeklyCurrent++; cw = addDays(cw, -7); }
  let bestWeekly = 0; run = 0; prev = null;
  [...weekSet].sort().forEach(wk => {
    const dt = new Date(wk + 'T00:00:00');
    if(prev && daysBetween(dt, prev) === 7) run++; else run = 1;
    prev = dt;
    if(run > bestWeekly) bestWeekly = run;
  });
  const monthSet = new Set();
  doneDates.forEach(k => monthSet.add(k.slice(0,7)));
  let monthlyCurrent = 0;
  let cm = monthSet.has(todayKey.slice(0,7)) ? todayKey.slice(0,7) : shiftMonthKey(todayKey.slice(0,7), -1);
  while(monthSet.has(cm)){ monthlyCurrent++; cm = shiftMonthKey(cm, -1); }
  let bestMonthly = 0; run = 0; prev = null;
  [...monthSet].sort().forEach(mk => {
    if(prev){
      const [py, pm] = prev.split('-').map(Number);
      const [cy, cmm] = mk.split('-').map(Number);
      const diff = (cy - py) * 12 + (cmm - pm);
      if(diff === 1) run++; else run = 1;
    } else run = 1;
    prev = mk;
    if(run > bestMonthly) bestMonthly = run;
  });
  return { dailyCurrent, bestDaily, weeklyCurrent, bestWeekly, monthlyCurrent, bestMonthly };
}

}

  const fd = new FormData(e.target);
  const subject = String(fd.get('subject')||'').trim();
  if(!subject) return;
  const typeVal = String(fd.get('type')||'');
  const key = currentKey();
  itemsFor(key).push({
    id: uid(), time: String(fd.get('time')||'').trim(), subject,
    type: ['lec','prac','lab'].includes(typeVal) ? typeVal : '',
    teacher: String(fd.get('teacher')||'').trim(),
    room: String(fd.get('room')||'').trim(),
    notes: '', done: false, lmsStatus: '', hwIds: []
  });
  save(); renderHome();
  e.target.reset();
  e.target.querySelector('[name="subject"]').focus();
  const d = viewDate;
  toast(`+ на ${d.getDate()} ${MONTHS_SHORT[d.getMonth()]}`);
});
function addHomeworkFromCard(card, text){
  const trimmed = text.trim();
  if(!trimmed) return false;
  const item = findItem(card.dataset.dateKey, card.dataset.id);
  if(!item) return false;
  const subject = (item.subject||'').trim();
  if(!subject){ toast('Сначала укажи название пары'); return false; }
  const deadline = card.dataset.dateKey;
  const hwId = uid();
  if(!data.homework[subject]) data.homework[subject] = [];
  data.homework[subject].push({ id: hwId, text: trimmed, done: false, deadline, fromCard: card.dataset.id });
  if(!item.hwIds) item.hwIds = [];
  item.hwIds.push(hwId);
  save();
  return true;
}
$('#list').addEventListener('change', e => {
  const act = e.target.dataset.act, field = e.target.dataset.field;
  if(act === 'done'){
    const card = e.target.closest('.card');
    if(card.classList.contains('readonly')) return;
    const item = findItem(card.dataset.dateKey, card.dataset.id);
    if(!item) return;
    item.done = e.target.checked;
    card.classList.toggle('done', item.done);
    card.querySelectorAll('.strike-target').forEach(el => el.classList.toggle('strike', item.done));
    save(); updateStats(0, false);
    return;
  }
  if(field === 'type'){
    const card = e.target.closest('.card');
    if(card.classList.contains('readonly')) return;
    const item = findItem(card.dataset.dateKey, card.dataset.id);
    if(!item) return;
    item.type = e.target.value;
    e.target.dataset.t = item.type;
    applyCardColor(card, item);
    save();
  }
  if(e.target.matches('.card-hw-item input[type=checkbox]')){
    const row = e.target.closest('.card-hw-item');
    const hw = findHWById(row.dataset.hwId);
    if(!hw) return;
    hw.item.done = e.target.checked;
    save(); renderList();
    if(currentTab === 'homework') renderHomework();
    if(currentTab === 'calendar') renderCalendarHomework();
  }
});
$('#list').addEventListener('input', e => {
  const field = e.target.dataset.field;
  if(!field || field === 'type' || e.target.readOnly) return;
  const card = e.target.closest('.card');
  if(card.classList.contains('readonly')) return;
  const item = findItem(card.dataset.dateKey, card.dataset.id);
  if(!item) return;
  item[field] = e.target.value;
  save();
  if(e.target.tagName === 'TEXTAREA') autoGrow(e.target);
});
$('#list').addEventListener('click', e => {
  const lmsBtn = e.target.closest('[data-lms]');
  if(lmsBtn){
    const card = lmsBtn.closest('.card');
    if(card.classList.contains('readonly')) return;
    e.stopPropagation();
    const item = findItem(card.dataset.dateKey, card.dataset.id);
    if(!item) return;
    const newStatus = lmsBtn.dataset.lms;
    item.lmsStatus = item.lmsStatus === newStatus ? '' : newStatus;
    card.classList.toggle('attended', item.lmsStatus === 'attended');
    card.classList.toggle('missed', item.lmsStatus === 'missed');
    card.querySelectorAll('[data-lms]').forEach(b => b.classList.toggle('active', b.dataset.lms === item.lmsStatus));
    save(); return;
  }
  const chwDel = e.target.closest('.chw-del');
  if(chwDel){
    if(!isAdmin){ toast('Удалять ДЗ может только админ'); return; }
    e.stopPropagation();
    const row = chwDel.closest('.card-hw-item');
    const card = chwDel.closest('.card');
    const hwId = row.dataset.hwId;
    const found = findHWById(hwId);
    if(found){
      data.homework[found.subject] = (data.homework[found.subject]||[]).filter(h => h.id !== hwId);
      if(!data.homework[found.subject].length) delete data.homework[found.subject];
    }
    const item = findItem(card.dataset.dateKey, card.dataset.id);
    if(item && item.hwIds) item.hwIds = item.hwIds.filter(id => id !== hwId);
    save(); renderList();
    if(currentTab === 'homework') renderHomework();
    return;
  }
  const chwAddBtn = e.target.closest('.card-hw-add button');
  if(chwAddBtn){
    e.stopPropagation();
    const wrap = chwAddBtn.closest('.card-hw-add');
    const input = wrap.querySelector('input');
    const card = chwAddBtn.closest('.card');
    if(addHomeworkFromCard(card, input.value)){
      input.value = ''; renderList();
      if(currentTab === 'homework') renderHomework();
      toast('ДЗ добавлено ✓');
    }
    return;
  }
  const btn = e.target.closest('.more');
  if(!btn) return;
  const card = btn.closest('.card');
  if(card.classList.contains('readonly')) return;
  closeMenus(); openCardMenu(card);
});
$('#list').addEventListener('keydown', e => {
  if(e.key !== 'Enter') return;
  if(!e.target.matches('.card-hw-add input')) return;
  e.preventDefault();
  const wrap = e.target.closest('.card-hw-add');
  const card = wrap.closest('.card');
  if(addHomeworkFromCard(card, e.target.value)){
    e.target.value = ''; renderList();
    if(currentTab === 'homework') renderHomework();
    toast('ДЗ добавлено ✓');
  }
});
function closeMenus(){ $$('.menu').forEach(m => m.remove()); $$('.card.menu-open').forEach(c => c.classList.remove('menu-open')); document.body.style.overflow = ''; }
function openCardMenu(card){
  document.body.style.overflow = 'hidden';
  const id = card.dataset.id, fromKey = card.dataset.dateKey;
  card.classList.add('menu-open');
  const menu = document.createElement('div');
  menu.className = 'menu';
  const options = [];
  for(let i=0;i<7;i++){ const d = dateForIdx(i); options.push({ label:`${DOW_SHORT[i]} ${d.getDate()}`, key: iso(d), disabled: iso(d)===fromKey }); }
  menu.innerHTML = `
    <div class="label">Перенести на дату</div>
    <div class="chips">${options.map(o => `<button data-move="${o.key}" ${o.disabled?'disabled':''}>${o.label}</button>`).join('')}</div>
    <hr>
    <button data-act="dup">Дублировать здесь</button>
    <button data-act="dupNext7">Дублировать +7 дней</button>
    <button data-act="dupNext14">Дублировать +14 дней</button>
    <hr>
    <button class="danger" data-act="delete">Удалить пару</button>`;
  document.body.appendChild(menu);
  const rect = card.getBoundingClientRect();
  menu.style.top = `${rect.bottom + 5}px`;
  menu.style.left = `${rect.left}px`;
  if(rect.bottom + 400 > window.innerHeight) menu.style.top = `${rect.top - menu.offsetHeight - 5}px`;
  menu.addEventListener('click', ev => {
    const moveBtn = ev.target.closest('[data-move]');
    if(moveBtn){ moveItem(id, fromKey, moveBtn.dataset.move); closeMenus(); return; }
    const act = ev.target.closest('[data-act]'); if(!act) return;
    const a = act.dataset.act;
    const item = findItem(fromKey, id);
    if(!item){ closeMenus(); return; }
    if(a === 'delete'){
      data.days[fromKey] = itemsFor(fromKey).filter(i => i.id !== id);
      if(!data.days[fromKey].length) delete data.days[fromKey];
      save(); renderHome(); toast('Пара удалена');
    }
    if(a === 'dup'){
      const copy = {...item, id: uid(), done:false, lmsStatus:'', hwIds: []};
      const arr = itemsFor(fromKey);
      arr.splice(arr.indexOf(item) + 1, 0, copy);
      save(); renderHome(); toast('Пара продублирована');
    }
    if(a === 'dupNext7'){
      const toKey = iso(addDays(new Date(fromKey + 'T00:00:00'), 7));
      itemsFor(toKey).push({...item, id: uid(), done:false, lmsStatus:'', hwIds: []});
      save(); toast('Дублировано на +7 дней');
    }
    if(a === 'dupNext14'){
      const toKey = iso(addDays(new Date(fromKey + 'T00:00:00'), 14));
      itemsFor(toKey).push({...item, id: uid(), done:false, lmsStatus:'', hwIds: []});
      save(); toast('Дублировано на +14 дней');
    }
    closeMenus();
  });
}
function moveItem(id, fromKey, toKey){
  if(fromKey === toKey) return;
  const fromArr = itemsFor(fromKey);
  const idx = fromArr.findIndex(i => i.id === id);
  if(idx < 0) return;
  const [item] = fromArr.splice(idx, 1);
  if(!fromArr.length) delete data.days[fromKey];
  itemsFor(toKey).push(item);
  save(); renderHome();
}

function autoCrossOut(){
  const now = new Date();
  const todayKey = iso(new Date(now.getFullYear(), now.getMonth(), now.getDate()));
  const nowMin = now.getHours()*60 + now.getMinutes();
  let changed = false;
  Object.keys(data.days).forEach(key => {
    const arr = data.days[key];
    if(!Array.isArray(arr)) return;
    arr.forEach(item => {
      if(item.done) return;
      if(key < todayKey){ item.done = true; changed = true; return; }
      if(key === todayKey){
        const slot = parseSlot(item.time);
        if(!slot) return;
        if(nowMin >= slot.end){ item.done = true; changed = true; }
      }
    });
  });
  if(changed) save();
  if(currentTab === 'home'){
    const ae = document.activeElement;
    const typing = ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA' || ae.isContentEditable) && ae.closest('.card');
    if(!typing) renderList();
  }
}

let notifiedKeys = new Set();
try { notifiedKeys = new Set(JSON.parse(localStorage.getItem(NOTIFIED_KEY) || '[]')); } catch(e){}
function saveNotified(){ try{ localStorage.setItem(NOTIFIED_KEY, JSON.stringify([...notifiedKeys])); }catch(e){} }
function checkReminders(){
  const s = data.settings || {};
  if(!s.notifyEnabled || !('Notification' in window) || Notification.permission !== 'granted') return;
  const now = new Date();
  const todayKey = iso(new Date(now.getFullYear(), now.getMonth(), now.getDate()));
  const arr = data.days[todayKey] || [];
  const nowMin = now.getHours()*60 + now.getMinutes();
  const mins = parseInt(s.notifyMinutes, 10) || 15;
  let changed = false;
  const icon = document.querySelector('link[rel=icon]')?.href;
  arr.forEach(item => {
    if(!item.subject) return;
    const slot = parseSlot(item.time); if(!slot) return;
    const mb = slot.start - nowMin;
    if(mb <= 0 || mb > mins) return;
    const nKey = todayKey + ':' + item.id;
    if(notifiedKeys.has(nKey)) return;
    try{
      new Notification(`Скоро пара — ${item.subject}`, { body: `Начало в ${item.time}${item.room ? ' · ауд. ' + item.room : ''}`, tag: nKey, icon });
      if(navigator.vibrate) try{ navigator.vibrate([180, 90, 180]); }catch(_){}
    }catch(err){}
    notifiedKeys.add(nKey); changed = true;
  });
  const cutoff = iso(addDays(new Date(), -3));
  [...notifiedKeys].forEach(k => { if(k.split(':')[0] < cutoff){ notifiedKeys.delete(k); changed = true; } });
  if(changed) saveNotified();
}
function openRemindersModal(){
  const s = data.settings;
  const support = 'Notification' in window;
  const perm = support ? Notification.permission : 'unsupported';
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.innerHTML = `
    <div class="modal">
      <h3>🔔 Напоминания о парах</h3>
      <div class="modal-row"><label>Включить</label><button class="toggle ${s.notifyEnabled ? 'on' : ''}" id="toggleNotify" type="button"></button></div>
      <div class="modal-row"><label>За сколько</label>
        <select id="notifyMinutes">
          <option value="5" ${s.notifyMinutes===5?'selected':''}>5 минут</option>
          <option value="10" ${s.notifyMinutes===10?'selected':''}>10 минут</option>
          <option value="15" ${s.notifyMinutes===15?'selected':''}>15 минут</option>
          <option value="30" ${s.notifyMinutes===30?'selected':''}>30 минут</option>
          <option value="60" ${s.notifyMinutes===60?'selected':''}>60 минут</option>
        </select></div>
      <div class="modal-row"><label>Разрешение</label>
        <span class="modal-status ${perm==='granted'?'ok':perm==='denied'?'no':'none'}">${perm==='granted'?'✓ разрешено':perm==='denied'?'✗ запрещено':perm==='unsupported'?'не поддерживается':'не выдано'}</span></div>
      <div class="modal-actions">
        <button class="secondary" id="testNotify" type="button">Проверить</button>
        <button class="primary" id="closeModal" type="button">Готово</button>
      </div>
    </div>`;
  document.body.appendChild(backdrop);
  const close = () => backdrop.remove();
  backdrop.addEventListener('click', e => { if(e.target === backdrop) close(); });
  $('#closeModal').onclick = close;
  $('#toggleNotify').onclick = async () => {
    data.settings.notifyEnabled = !data.settings.notifyEnabled;
    if(data.settings.notifyEnabled && 'Notification' in window && Notification.permission === 'default'){
      try{ await Notification.requestPermission(); }catch(e){}
    }
    save(); close(); setTimeout(openRemindersModal, 150); renderProfileBadge();
  };
  $('#notifyMinutes').onchange = (e) => { data.settings.notifyMinutes = parseInt(e.target.value,10) || 15; save(); };
  $('#testNotify').onclick = async () => {
    if(!('Notification' in window)){ toast('Не поддерживается'); return; }
    let p = Notification.permission;
    if(p === 'default') p = await Notification.requestPermission();
    if(p === 'granted'){
      try{ new Notification('Моё расписание', { body: 'Уведомления работают ✓' }); }catch(e){}
      toast('Отправлено'); close(); setTimeout(openRemindersModal, 200);
    } else toast('Разрешение не выдано');
  };
}
