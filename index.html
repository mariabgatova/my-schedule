<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Моё расписание</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23b41b2d'/%3E%3Crect x='16' y='24' width='68' height='62' rx='10' fill='white'/%3E%3Crect x='16' y='24' width='68' height='16' rx='10' fill='%2354162B'/%3E%3Crect x='24' y='16' width='8' height='20' rx='4' fill='white'/%3E%3Crect x='68' y='16' width='8' height='20' rx='4' fill='white'/%3E%3C/svg%3E">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
  :root {
    /* ПАЛИТРА: #1B1A2F #242E49 #37415C #54162B #b41b2d + персиковый для мелкого */
    --c-bg:      #1B1A2F;
    --c-card:    #242E49;
    --c-border:  #37415C;
    --c-accent-dark: #54162B;
    --c-accent:  #b41b2d;
    --c-peach:   #e8b89a;
    --c-text:    #f2f2f7;
    --c-muted:   #8a91a8;
    --c-hover:   #2d3754;

    --c-light-bg: #f4f4f9;
    --c-light-card: #ffffff;
    --c-light-border: #dde0e8;
    --c-light-text: #1a1a2a;
    --c-light-muted: #6b7280;
    --c-light-peach: #c48a5a;
  }

  [data-theme="dark"] {
    --bg: var(--c-bg);
    --card: var(--c-card);
    --text: var(--c-text);
    --muted: var(--c-muted);
    --border: var(--c-border);
    --accent: var(--c-accent);
    --accent-dark: var(--c-accent-dark);
    --peach: var(--c-peach);
    --on-accent: #ffffff;
    --hover: var(--c-hover);
    --lms: #7a9e8a;
    --miss: var(--c-accent);
    --shadow: 0 8px 30px rgba(0,0,0,.55);
    --icon-bg: var(--c-card);
    --icon-border: 1px solid var(--c-border);
    --card-radius: 16px;
    --card-border: 1px solid var(--c-border);
    --tab-active-bg: var(--c-accent);
    --on-tab-active: #ffffff;
    --strike-color: var(--c-accent);
    --btn-accent: var(--c-accent);
    --on-btn-accent: #ffffff;
    /* Типы пар: лекция (синий) / практика (бордовый) / лаба (красный) */
    --type-lec: #6a85b8;
    --type-prac: #8a3a52;
    --type-lab: var(--c-accent);
  }

  [data-theme="light"] {
    --bg: var(--c-light-bg);
    --card: var(--c-light-card);
    --text: var(--c-light-text);
    --muted: var(--c-light-muted);
    --border: var(--c-light-border);
    --accent: var(--c-accent);
    --accent-dark: var(--c-accent-dark);
    --peach: var(--c-light-peach);
    --on-accent: #ffffff;
    --hover: #eef0f5;
    --lms: #10b981;
    --miss: var(--c-accent);
    --shadow: 0 4px 20px rgba(27,26,47,.08);
    --icon-bg: var(--card);
    --icon-border: 1px solid var(--border);
    --card-radius: 14px;
    --card-border: 1px solid var(--border);
    --tab-active-bg: var(--c-accent);
    --on-tab-active: #ffffff;
    --strike-color: currentColor;
    --btn-accent: var(--c-accent);
    --on-btn-accent: #ffffff;
    --type-lec: #2c4a6e;
    --type-prac: #54162B;
    --type-lab: #8a1220;
  }

  * { box-sizing: border-box; }
  html { transition: background .3s ease; scroll-behavior: smooth; overflow-x: hidden; }
  body { margin:0; padding:14px 14px 110px; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif; background:var(--bg); color:var(--text); transition: background .3s ease, color .3s ease; -webkit-font-smoothing:antialiased; overflow-x: hidden; }
  body * { transition: background-color .2s ease, border-color .2s ease, color .2s ease; }

  input[type="checkbox"] { position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none; }
  button { font-family: inherit; cursor: pointer; border: none; background: transparent; color: inherit; padding: 0; }

  .slider-container { position: relative; overflow: hidden; }
  .slider-bg { position: absolute; background: var(--tab-active-bg); border-radius: 16px; transition: transform .3s cubic-bezier(.2,.8,.2,1), width .3s cubic-bezier(.2,.8,.2,1); z-index: 1; pointer-events: none; will-change: transform, width; }
  .slider-container button, .slider-container .day { position: relative; z-index: 2; transition: color .2s ease; }

  .view-wrapper { position: relative; width: 100%; overflow: hidden; }
  .view { display: flex; flex-direction: column; width: 100%; will-change: transform, opacity; }
  .view[hidden] { display: none !important; }

  @keyframes slideInRight { from { transform: translate3d(50px, 0, 0); opacity: 0; } to { transform: translate3d(0, 0, 0); opacity: 1; } }
  @keyframes slideInLeft { from { transform: translate3d(-50px, 0, 0); opacity: 0; } to { transform: translate3d(0, 0, 0); opacity: 1; } }

  .view.slide-in-right { animation: slideInRight .3s cubic-bezier(.2,.8,.2,1) both; }
  .view.slide-in-left { animation: slideInLeft .3s cubic-bezier(.2,.8,.2,1) both; }

  .app { max-width: 900px; margin: 0 auto; }

  header.topbar { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px; position:relative; }
  header.topbar h1 { font-size:20px; margin:0; letter-spacing:-.3px; }
  .sync-status { display:flex; align-items:center; justify-content:center; font-size:18px; width:40px; height:40px; border-radius:50%; background:var(--icon-bg); border:var(--icon-border); box-shadow:var(--shadow); flex:0 0 auto; }
  .sync-status.spin { animation: syncSpin 1s linear infinite; }
  @keyframes syncSpin { 0%{transform:rotate(0)} 50%{transform:rotate(180deg)} 100%{transform:rotate(360deg)} }

  .actions { display:flex; gap:8px; align-items:center; }
  .icon-btn { background:var(--icon-bg); border:var(--icon-border); width:40px; height:40px; border-radius:50%; font-size:16px; cursor:pointer; box-shadow:var(--shadow); color:var(--text); display:flex; align-items:center; justify-content:center; position:relative; flex:0 0 auto; }
  .icon-btn:active { transform:scale(.9); }
  .icon-btn .bell-dot { position:absolute; top:6px; right:6px; width:8px; height:8px; border-radius:50%; background:var(--lms); border:2px solid var(--icon-bg); display:none; }
  .icon-btn.bell-on .bell-dot { display:block; }

  .profile-btn { display:flex; align-items:center; gap:8px; background:var(--icon-bg); border:var(--icon-border); height:40px; padding:0 16px 0 7px; border-radius:20px; cursor:pointer; box-shadow:var(--shadow); font-family:inherit; color:var(--text); font-size:13px; font-weight:600; }
  .profile-btn .profile-emoji { width:28px; height:28px; border-radius:50%; background:var(--accent); color:var(--on-accent); display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:800; overflow:hidden; }
  .profile-btn .profile-emoji img { width:100%; height:100%; object-fit:cover; border-radius:50%; }
  .profile-btn .profile-name { max-width:110px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  .strike { position: relative; text-decoration: none !important; opacity: 0.6; }
  .strike::after { content: ''; position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); height: 1.5px; background-color: var(--strike-color); pointer-events: none; }

  .search-wrap { position:relative; margin-bottom:10px; }
  .search { width:100%; padding:12px 42px 12px 40px; border-radius:16px; background:var(--card); border:var(--card-border); box-shadow:var(--shadow); font:inherit; font-size:14px; color:var(--text); outline:none; }
  .search::placeholder { color:var(--muted); opacity:.8; }
  .search-icon { position:absolute; left:14px; top:50%; transform:translateY(-50%); color:var(--muted); font-size:14px; pointer-events:none; }
  .search-clear { position:absolute; right:8px; top:50%; transform:translateY(-50%); border:none; background:transparent; color:var(--muted); font-size:16px; cursor:pointer; padding:5px 9px; border-radius:8px; line-height:1; display:none; }
  .search-wrap.has-value .search-clear { display:block; }

  .week-nav { display:flex; align-items:center; gap:4px; margin-bottom:12px; background:var(--card); border:var(--card-border); border-radius:16px; padding:5px 7px; box-shadow:var(--shadow); }
  .week-nav .arrow { border:none; background:transparent; color:var(--text); font-size:24px; line-height:1; height:44px; min-width:44px; padding:0 10px; border-radius:12px; cursor:pointer; display:flex; align-items:center; justify-content:center; font-family:inherit; }
  .week-nav .arrow.week-btn { font-size:22px; letter-spacing:-6px; font-weight:600; padding-right:12px; }
  .week-range { flex:1 1 auto; text-align:center; font-size:14px; font-weight:600; padding:0 4px; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .week-range .sub { font-size:12px; color:var(--peach); font-weight:500; display:block; margin-top:1px; }
  .today-btn { border:none; background:var(--btn-accent); color:var(--on-btn-accent); font:inherit; font-size:13px; font-weight:600; padding:9px 15px; border-radius:12px; cursor:pointer; flex:0 0 auto; }
  .today-btn[hidden] { display:none; }

  .days { display:flex; gap:6px; padding-bottom:4px; margin-bottom:10px; position:relative; }
  .day { flex:1 1 0; min-width:42px; border:none; background:transparent; color:var(--muted); padding:8px 3px; border-radius:16px; font-weight:600; cursor:pointer; position:relative; font-family:inherit; display:flex; flex-direction:column; align-items:center; gap:2px; border:1px solid transparent; z-index:2; }
  .day .rel { font-size:8px; font-weight:600; line-height:11px; height:11px; white-space:nowrap; color:var(--peach); opacity:.65; width:100%; text-align:center; overflow:hidden; text-overflow:ellipsis; padding:0 2px; }
  .day.today .rel { color:var(--accent); opacity:1; font-weight:800; }
  .day.active .rel { color:var(--on-tab-active); opacity:.9; }
  .day .dow { font-size:11px; opacity:.85; }
  .day .num { font-size:16px; font-weight:700; color:var(--text); line-height:1.15; }
  .day .mini-dots { display:flex; gap:2px; margin-top:2px; flex-wrap:wrap; justify-content:center; max-width:100%; height:5px; align-items:center; }
  .day .mini-dot { width:5px; height:5px; border-radius:50%; flex:0 0 auto; }
  .day .mini-more { font-size:8px; color:var(--muted); line-height:1; margin-left:1px; }
  .day.active { color:var(--on-tab-active); }
  .day.active .num { color:var(--on-tab-active); }
  .day.today:not(.active) .num { color:var(--accent); }
  .day.today:not(.active) { border-color:var(--accent); }

  .stats { font-size:13px; color:var(--muted); margin:0 0 10px 4px; min-height:16px; }
  .empty { text-align:center; color:var(--muted); padding:28px 12px 16px; font-size:14px; }
  .empty .big { font-size:30px; margin-bottom:6px; opacity:.7; }

  .card { display:flex; gap:10px; align-items:flex-start; position:relative; background:var(--card); border-radius:var(--card-radius); padding:14px 14px 14px 12px; border-left:6px solid var(--c,#999); box-shadow:var(--shadow); margin-bottom:10px; border-top: var(--card-border); border-right: var(--card-border); border-bottom: var(--card-border); }
  [data-theme="dark"] .card { border: 1px solid var(--border); border-left: none; }
  [data-theme="dark"] .card::before { content: ''; position: absolute; left: 0; top: 16px; bottom: 16px; width: 6px; border-radius: 0 6px 6px 0; background: var(--c, #999); }

  .card.done .strike-target { opacity: 0.6; }
  .card.done .grip, .card.done .type, .card.done .check, .card.done .dot, .card.done .lms-block { opacity:.5; }
  .card.done { background:color-mix(in srgb,var(--card) 70%,var(--bg)); }

  .grip { flex:0 0 auto; border:none; background:transparent; color:var(--muted); cursor:grab; font-size:20px; padding:2px 3px; line-height:1; opacity:.45; font-family:inherit; }
  .check { display:flex; padding-top:2px; cursor:pointer; flex:0 0 auto; }
  .box { width:22px; height:22px; border-radius:50%; border:2px solid var(--c,#999); display:block; position:relative; }
  .check input:checked + .box { background:var(--c,#999); }
  .check input:checked + .box::after { content:''; position:absolute; left:7px; top:3px; width:5px; height:10px; border:solid var(--on-accent); border-width:0 2.5px 2.5px 0; transform:rotate(45deg); }

  .body { flex:1 1 auto; min-width:0; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .dot { flex:0 0 auto; width:12px; height:12px; border-radius:50%; background:#8b90a6; }
  .card.current .dot, .card.future .dot { background:var(--c); }

  input, textarea, select { font:inherit; background:transparent; border:none; color:inherit; outline:none; padding:2px 0; min-width:0; }
  input::placeholder, textarea::placeholder { color:var(--muted); opacity:.7; }
  .time { width:92px; font-size:14px; color:var(--muted); font-variant-numeric:tabular-nums; }
  .subject { flex:1 1 120px; font-weight:600; font-size:15px; }
  .room { width:80px; font-size:14px; color:var(--muted); text-align:right; }
  .teacher { width:100%; margin-top:3px; font-size:13px; color:var(--muted); font-style:italic; }
  textarea { resize:none; width:100%; margin-top:6px; font-size:13px; color:var(--muted); line-height:1.45; overflow:hidden; }

  .type { appearance:none; border:1px solid var(--border); border-radius:8px; padding:3px 22px 3px 9px; font-size:11.5px; font-weight:700; cursor:pointer; background:var(--hover); color:var(--muted); text-transform:uppercase; outline:none; font-family:inherit; background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='8' height='5' viewBox='0 0 8 5'><path d='M0 0l4 4 4-4' fill='none' stroke='%238a91a8' stroke-width='1.4'/></svg>"); background-repeat:no-repeat; background-position:right 6px center; }
  .type[data-t="lec"] { background-color:color-mix(in srgb, var(--type-lec) 18%, transparent); color:var(--type-lec); border-color:color-mix(in srgb, var(--type-lec) 45%, transparent); }
  .type[data-t="prac"] { background-color:color-mix(in srgb, var(--type-prac) 18%, transparent); color:var(--type-prac); border-color:color-mix(in srgb, var(--type-prac) 45%, transparent); }
  .type[data-t="lab"] { background-color:color-mix(in srgb, var(--type-lab) 18%, transparent); color:var(--type-lab); border-color:color-mix(in srgb, var(--type-lab) 45%, transparent); }

  .lms-block { flex:0 0 auto; align-self:flex-start; display:flex; flex-direction:column; align-items:center; gap:4px; padding-top:1px; }
  .lms-label { font-size:9px; font-weight:800; text-transform:uppercase; letter-spacing:.3px; color:var(--peach); opacity:.7; text-align:center; line-height:1.15; white-space:nowrap; }
  .lms-btns { display:flex; gap:4px; }
  .lms-btn { width:28px; height:28px; border-radius:50%; border:1.5px solid var(--border); background:transparent; color:var(--muted); cursor:pointer; font-size:13px; font-weight:800; line-height:1; display:flex; align-items:center; justify-content:center; font-family:inherit; padding:0; }
  .lms-btn.attended.active { background:var(--lms); color:#fff; border-color:var(--lms); }
  .lms-btn.missed.active { background:var(--miss); color:#fff; border-color:var(--miss); }
  .more { flex:0 0 auto; align-self:flex-start; background:transparent; border:none; color:var(--muted); cursor:pointer; font-size:20px; padding:3px 7px; border-radius:50%; opacity:.6; line-height:1; font-family:inherit; }

  /* ===== ДЗ ВНУТРИ КАРТОЧКИ ПАРЫ ===== */
  .card-hw { margin-top: 8px; border-top: 1px dashed var(--border); padding-top: 8px; }
  .card-hw-title { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .3px; color: var(--peach); opacity: .85; margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
  .card-hw-title .hw-count { font-size: 10px; background: var(--hover); color: var(--text); padding: 1px 6px; border-radius: 6px; }
  .card-hw-list { display: flex; flex-direction: column; gap: 4px; }
  .card-hw-item { display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-radius: 8px; background: var(--hover); }
  .chw-check { position: relative; display: flex; align-items: center; cursor: pointer; flex: 0 0 auto; }
  .chw-box { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--accent); display: block; position: relative; background: transparent; }
  .chw-check input:checked + .chw-box { background: var(--accent); }
  .chw-check input:checked + .chw-box::after { content: ''; position: absolute; left: 4px; top: 1px; width: 4px; height: 8px; border: solid var(--on-accent); border-width: 0 2px 2px 0; transform: rotate(45deg); }
  .chw-text { flex: 1 1 auto; font-size: 13px; color: var(--text); min-width: 0; word-break: break-word; }
  .chw-del { flex: 0 0 auto; border: none; background: transparent; color: var(--muted); cursor: pointer; font-size: 14px; padding: 0 4px; border-radius: 50%; opacity: .5; font-family: inherit; }
  .card-hw-empty { font-size: 12px; color: var(--muted); padding: 6px 4px; opacity: .75; text-align: center; }
  .card-hw-add { display: flex; gap: 6px; margin-top: 6px; }
  .card-hw-add input { flex: 1; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; color: var(--text); font-size: 12px; outline: none; font-family: inherit; }
  .card-hw-add button { background: var(--btn-accent); color: var(--on-btn-accent); border: none; border-radius: 50%; width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; cursor: pointer; flex: 0 0 auto; font-size: 16px; line-height: 1; padding: 0; }

  .menu { position: fixed; z-index: 2000; background: var(--card); border: var(--card-border); border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,.5); padding: 7px; min-width: 210px; max-height: 80vh; overflow-y: auto; overscroll-behavior: contain; }
  .menu::-webkit-scrollbar { width: 6px; }
  .menu::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  .menu .label { font-size:11px; text-transform:uppercase; letter-spacing:.6px; color:var(--peach); opacity:.75; padding:7px 10px 5px; font-weight:700; }
  .menu button { display:block; width:100%; text-align:left; border:none; background:transparent; color:var(--text); padding:9px 11px; border-radius:10px; font:inherit; font-size:14px; cursor:pointer; font-family:inherit; }
  .menu button:hover { background:var(--hover); }
  .menu button.danger:hover { background:rgba(180,27,45,.18); color:#ff6b6b; }
  .menu hr { border:none; border-top:1px solid var(--border); margin:6px 4px; }

  .chips { display:flex; flex-wrap:wrap; gap:5px; padding:2px 8px 8px; }
  .chips button { width:auto; display:inline-block; padding:6px 10px; font-size:12.5px; font-weight:600; background:var(--hover); border-radius:8px; }

  .profile-menu { min-width:230px; }
  .profile-item { display:flex; align-items:center; gap:9px; width:100%; padding:8px 10px; background:transparent; color:var(--text); border-radius:10px; cursor:pointer; font-size:14px; text-align:left; }
  .profile-item:hover { background:var(--hover); }
  .profile-item.current { background:color-mix(in srgb,var(--accent) 15%,transparent); }
  .profile-item .pi-emoji { width:30px; height:30px; border-radius:50%; flex:0 0 auto; background:var(--accent); color:var(--on-accent); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:800; overflow:hidden; }
  .profile-item .pi-emoji img { width:100%; height:100%; object-fit:cover; border-radius:50%; }
  .profile-item .pi-name { flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:600; }
  .profile-item .pi-badge { font-size:10px; font-weight:700; color:var(--accent); text-transform:uppercase; }
  .profile-item .pi-del { flex:0 0 auto; border:none; background:transparent; color:var(--muted); cursor:pointer; font-size:16px; padding:2px 6px; border-radius:50%; opacity:.5; font-family:inherit; }

  .modal-input { width:100%; background:var(--hover); border:1px solid var(--border); border-radius:12px; padding:10px 12px; font-size:14px; color:var(--text); outline:none; font-family:inherit; margin-bottom:4px; }

  .home-checklist-sec { margin-top: 14px; background: var(--card); border: var(--card-border); border-radius: var(--card-radius); padding: 16px; box-shadow: var(--shadow); }
  .home-checklist-sec h3 { margin: 0 0 12px; font-size: 15px; display: flex; align-items: center; gap: 6px; }
  .home-checklist-add { display: flex; gap: 8px; align-items: center; }
  .home-checklist-add input { flex: 1; background: var(--hover); border: 1px solid var(--border); border-radius: 12px; padding: 10px 14px; color: var(--text); outline: none; font-size: 14px; }
  .home-checklist-add button { background: var(--btn-accent); color: var(--on-btn-accent); border: none; border-radius: 50%; width: 36px; height: 36px; cursor: pointer; font-size: 24px; display: flex; align-items: center; justify-content: center; flex: 0 0 auto; padding: 0; line-height: 1; }

  .checklist { display:flex; flex-direction:column; gap:1px; margin-bottom:6px; }
  .checklist-empty { color:var(--muted); font-size:13px; text-align:center; padding:8px 0 6px; opacity:.75; }
  .checklist-item { display:flex; gap:10px; align-items:center; padding:8px 6px; border-radius:10px; }
  .checklist-item .cl-check { position:relative; display:flex; align-items:center; cursor:pointer; flex:0 0 auto; }
  .cl-box { width:22px; height:22px; border-radius:50%; border:2px solid var(--accent); display:block; position:relative; background:transparent; }

let isAdmin = sessionStorage.getItem('admin-auth') === '1';

function setSyncStatus(s){
  if(syncStatus === s) return;
  syncStatus = s;
  const el = document.getElementById('syncStatus');
  if(!el) return;
  if(s === 'synced'){ el.textContent='🟢'; el.classList.remove('spin'); }

const pad = n => String(n).padStart(2,'0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
function startOfWeek(d){ const x = new Date(d); x.setHours(0,0,0,0); x.setDate(x.getDate() - ((x.getDay()+6)%7)); return x; }
function addDays(d, n){ const x = new Date(d); x.setDate(x.getDate() + n); return x; }
function sameDay(a, b){ return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }
function daysBetween(a, b){
  const x = new Date(a.getFullYear(), a.getMonth(), a.getDate());
  const y = new Date(b.getFullYear(), b.getMonth(), b.getDate());
  return Math.round((x - y) / 86400000);
}
function parseSlot(str){
  const s = String(str||'').trim(); if(!s) return null;
  const parts = s.split(/[-–—]/).map(x=>x.trim()).filter(Boolean);
  const toMin = t => {
    const m = String(t).match(/^(\d{1,2})[:.\s]?(\d{2})$/); if(!m) return null;
    const h=+m[1], mi=+m[2]; return (h>23||mi>59) ? null : h*60+mi;
  };
  const start = toMin(parts[0]); if(start === null) return null;
  let end = parts[1] ? toMin(parts[1]) : null;
  if(end === null || end <= start) end = start + 90;
  return {start, end};
}
function formatWeekRange(a, b){
  const d1=a.getDate(), m1=a.getMonth(), y1=a.getFullYear();
  const d2=b.getDate(),   m2=b.getMonth(),   y2=b.getFullYear();
  const cy = new Date().getFullYear();
  let s;
  if(m1===m2 && y1===y2) s = `${d1} – ${d2} ${MONTHS_GEN[m1]}`;
  else if(y1===y2) s = `${d1} ${MONTHS_GEN[m1]} – ${d2} ${MONTHS_GEN[m2]}`;
  else s = `${d1} ${MONTHS_GEN[m1]} ${y1} – ${d2} ${MONTHS_GEN[m2]} ${y2}`;
  if(y1===y2 && y1!==cy) s += ` ${y1}`;
  return s;
}
function formatDateShort(d){ return `${d.getDate()} ${MONTHS_SHORT[d.getMonth()]}`; }
function formatDateHuman(d){ return `${DOW_SHORT[(d.getDay()+6)%7]}, ${d.getDate()} ${MONTHS_GEN[d.getMonth()]}`; }
function formatDateFull(d){ return `${DOW_SHORT[(d.getDay()+6)%7]}, ${d.getDate()} ${MONTHS_GEN[d.getMonth()]} ${d.getFullYear()}`; }
function diffWeeks(a, b){ return Math.round((startOfWeek(a).getTime() - startOfWeek(b).getTime()) / (7*86400000)); }

function relativeDayLabel(date){
  const diff = daysBetween(date, todayDate());
  if (diff === 0) return 'сегодня';
  if (diff > 0) return `через ${diff} дн.`;
  if (diff < 0) return `${Math.abs(diff)} дн. назад`;
  return '';
}

function getTypeColor(type) {
  if (type === 'lec') return 'var(--type-lec)';
  if (type === 'prac') return 'var(--type-prac)';
  if (type === 'lab') return 'var(--type-lab)';
  return NO_TYPE_COLOR;
}

function getSubjectColor(subject) {
  if (!subject) return NO_TYPE_COLOR;
  let hash = 0;
  const s = String(subject);
  for (let i = 0; i < s.length; i++) hash = s.charCodeAt(i) + ((hash << 5) - hash);
  return SUBJECT_COLORS[Math.abs(hash) % SUBJECT_COLORS.length];
}

function classColor(item){
  if(!item || !item.type) return NO_TYPE_COLOR;
  return getTypeColor(item.type);
}
function applyCardColor(card, item){
  const c = classColor(item);
  card.style.setProperty('--c', c);
}
function dotColorForClub(){ return 'var(--accent)'; }

function classState(item, dateKey){
  const now = new Date();
  const todayKey = iso(new Date(now.getFullYear(), now.getMonth(), now.getDate()));
  if(dateKey < todayKey) return 'past';
  if(dateKey > todayKey) return 'future';
  const slot = parseSlot(item.time);
  if(!slot) return 'future';
  const nowMin = now.getHours()*60 + now.getMinutes();
  if(nowMin < slot.start) return 'future';
  if(nowMin < slot.end) return 'current';
  return 'past';
}

function isSameData(a, b){
  if(a === b) return true;
  if(a === null || b === null || a === undefined || b === undefined) return false;
  if(typeof a !== typeof b) return false;
  if(typeof a !== 'object') return false;
  const aArr = Array.isArray(a), bArr = Array.isArray(b);
  if(aArr !== bArr) return false;
  if(aArr){
    if(a.length !== b.length) return false;
    for(let i=0;i<a.length;i++) if(!isSameData(a[i], b[i])) return false;
    return true;
  }
  const ak = Object.keys(a).sort(), bk = Object.keys(b).sort();
  if(ak.length !== bk.length) return false;
  for(let i=0;i<ak.length;i++){
    if(ak[i] !== bk[i]) return false;
    if(!isSameData(a[ak[i]], b[bk[i]])) return false;
  }
  return true;
}

function normClub(c){ return { id: c.id || uid(), date: String(c.date||''), repeat: c.repeat === 'weekly' ? 'weekly' : 'once', time: String(c.time||''), name: String(c.name||''), place: String(c.place||'') }; }
function normLink(l){

function splitData(d){
  const shared = { days:{}, homework:{}, materials:{ notes:[], autos:[], methodichki:[] } };
  const personal = defaultPersonal();
  personal.checklists = d.checklists || {};
  personal.planner = d.planner || defaultPlanner();
  personal.clubs = (d.clubs || []).map(normClub).filter(c => c.name || c.date);
  personal.links = (d.links || []).map(normLink).filter(l => l.title || l.url);

  if(d.materials){
    shared.materials = {
      notes: (d.materials.notes||[]).map(normMaterial),
      autos: (d.materials.autos||[]).map(normMaterial),
      methodichki: (d.materials.methodichki||[]).map(normMaterial)
    };
    shared.materials.notes.forEach(n => { personal.materialStates[n.id] = { done: !!n.done }; delete n.done; });
    shared.materials.autos.forEach(a => { personal.materialStates[a.id] = { done: !!a.done }; delete a.done; });
    shared.materials.methodichki.forEach(m => { personal.materialStates[m.id] = { done: !!m.done }; delete m.done; });
  }
  if(d.settings) personal.settings = { ...personal.settings, ...d.settings };

  Object.keys(d.days || {}).forEach(k => {
    const arr = d.days[k];
    if(!Array.isArray(arr) || !arr.length) return;
    shared.days[k] = arr.map(it => ({
      id: it.id,
      time: String(it.time||''),
      subject: String(it.subject||''),
      type: ['lec','prac','lab'].includes(it.type) ? it.type : '',
      teacher: String(it.teacher||''),
      room: String(it.room||''),
      hwIds: Array.isArray(it.hwIds) ? it.hwIds.slice() : []
    }));
    arr.forEach(it => {
      personal.itemStates[it.id] = { done: !!it.done, notes: String(it.notes||''), lmsStatus: ['attended','missed'].includes(it.lmsStatus) ? it.lmsStatus : '' };
    });
  });
  Object.keys(d.homework || {}).forEach(subj => {
    const arr = d.homework[subj];
    if(!Array.isArray(arr) || !arr.length) return;
    shared.homework[subj] = arr.map(h => ({
      id: h.id, text: String(h.text||''), deadline: h.deadline ? String(h.deadline) : '', fromCard: h.fromCard ? String(h.fromCard) : ''
    }));
    arr.forEach(h => { personal.hwStates[h.id] = { done: !!h.done }; });
  });
  return { shared, personal };
}

function mergeData(shared, personal){
  const out = defaultData();
  shared = shared || { days:{}, homework:{}, materials:{ notes:[], autos:[], methodichki:[] } };
  personal = personal || defaultPersonal();
  const itemStates = personal.itemStates || {}, hwStates = personal.hwStates || {}, matStates = personal.materialStates || {};

  out.materials = { notes:[], autos:[], methodichki:[] };
  if(shared.materials){
    out.materials.notes = (shared.materials.notes||[]).map(n => { const st = matStates[n.id] || {}; return { ...normMaterial(n), done: !!st.done }; });
    out.materials.autos = (shared.materials.autos||[]).map(n => { const st = matStates[n.id] || {}; return { ...normMaterial(n), done: !!st.done }; });
    out.materials.methodichki = (shared.materials.methodichki||[]).map(n => { const st = matStates[n.id] || {}; return { ...normMaterial(n), done: !!st.done }; });
  }

  Object.keys(shared.days || {}).forEach(k => {
    const arr = shared.days[k];
    if(!Array.isArray(arr) || !arr.length) return;
    out.days[k] = arr.map(it => {
      const st = itemStates[it.id] || {};
      return {
        id: it.id, time: String(it.time||''), subject: String(it.subject||''),
        type: ['lec','prac','lab'].includes(it.type) ? it.type : '',
        teacher: String(it.teacher||''), room: String(it.room||''),
        notes: String(st.notes||''), done: !!st.done, autoDone: undefined,
        lmsStatus: ['attended','missed'].includes(st.lmsStatus) ? st.lmsStatus : '',
        hwIds: Array.isArray(it.hwIds) ? it.hwIds.slice() : []
      };
    });
  });
  Object.keys(shared.homework || {}).forEach(subj => {
    const arr = shared.homework[subj];
    if(!Array.isArray(arr) || !arr.length) return;
    out.homework[subj] = arr.map(h => {
      const st = hwStates[h.id] || {};
      return { id: h.id, text: String(h.text||''), done: !!st.done, deadline: h.deadline ? String(h.deadline) : '', fromCard: h.fromCard ? String(h.fromCard) : '' };
    });
  });
  if(personal.checklists) out.checklists = personal.checklists;
  if(personal.planner) out.planner = personal.planner;
  if(Array.isArray(personal.clubs)) out.clubs = personal.clubs.map(normClub).filter(c => c.name || c.date);
  if(Array.isArray(personal.links)) out.links = personal.links.map(normLink).filter(l => l.title || l.url);
  if(personal.settings) out.settings = { ...out.settings, ...personal.settings };
  return out;
}

function subscribeRealtime(){
  if(realtimeChannel){ try{ supa.removeChannel(realtimeChannel); }catch(e){} realtimeChannel = null; }
  const pid = profiles.current;
  realtimeChannel = supa.channel('sync-channel')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'shared_data', filter: `id=eq.${SHARED_ID}` }, payload => {
      const row = payload.new;
      if(!row || !row.data) return;
      if(hasPendingSharedChanges()){ scheduleSharedSave(); return; }
      if(!isSameData(lastShared, row.data)){ lastShared = row.data; rebuildAndRender(); }
      setSyncStatus('synced');
    })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'personal_data', filter: `id=eq.personal-${pid}` }, payload => {
      if(pid !== profiles.current) return;
      const row = payload.new;
      if(!row || !row.data) return;
      if(hasPendingPersonalChanges()){ schedulePersonalSave(); return; }
      if(!isSameData(lastPersonal, row.data)){ lastPersonal = row.data; rebuildAndRender(); }
      setSyncStatus('synced');
    })
    .subscribe((status) => {
      if(status === 'SUBSCRIBED') setSyncStatus('synced');
      else if(status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') setSyncStatus('offline');
    });
}

function copyDayTo(fromKey, toKey, replace){
  if(fromKey === toKey) return 0;
  const src = data.days[fromKey] || [];
  if(replace){
    const targetArr = itemsFor(toKey);
    targetArr.forEach(it => {
      (it.hwIds||[]).forEach(hwId => {
        const found = findHWById(hwId);
        if(found){
          data.homework[found.subject] = (data.homework[found.subject]||[]).filter(h => h.id !== hwId);
          if(!data.homework[found.subject].length) delete data.homework[found.subject];
        }
      });
    });
    data.days[toKey] = [];
  }
  const target = itemsFor(toKey);
  let copied = 0;
  src.forEach(item => {
    const newId = uid();
    const newHwIds = [];
    (item.hwIds||[]).forEach(oldHwId => {
      const found = findHWById(oldHwId);
      if(!found) return;
      const newHwId = uid();
      if(!data.homework[found.subject]) data.homework[found.subject] = [];
      data.homework[found.subject].push({ id: newHwId, text: found.item.text, done: false, deadline: toKey, fromCard: newId });
      newHwIds.push(newHwId);
    });
    target.push({
      id: newId, time: item.time, subject: item.subject, type: item.type,
      teacher: item.teacher, room: item.room,
      notes: '', done: false, autoDone: undefined, lmsStatus: '', hwIds: newHwIds
    });
    copied++;
  });
  save();
  return copied;
}

function renderWeekNav(){
  const s = currentWeekStart(), e = addDays(s, 6);
  const today = todayDate();
  const wd = diffWeeks(viewDate, today);
  let sub;
  if(sameDay(viewDate, today)) sub = 'сегодня';
  else if(sameDay(viewDate, addDays(today, 1))) sub = 'завтра';
  else if(sameDay(viewDate, addDays(today, -1))) sub = 'вчера';
  else if(wd === 0) sub = 'текущая неделя';
  else if(wd === -1) sub = 'прошлая неделя';
  else if(wd === 1) sub = 'следующая неделя';
  else if(wd < 0) sub = `${Math.abs(wd)} нед. назад`;
  else sub = `через ${wd} нед.`;

function renderMiniDots(items, clubs){
  items = items || []; clubs = clubs || [];
  const MAX = 6;
  const dots = [...items.map(it => ({ color: classColor(it) })), ...clubs.map(cl => ({ color: dotColorForClub(cl) }))];
  if(!dots.length) return '';
  const shown = dots.slice(0, MAX);
  const extra = dots.length - shown.length;
  let html = shown.map(d => `<span class="mini-dot" style="background:${d.color}"></span>`).join('');
  if(extra > 0) html += `<span class="mini-more">+${extra}</span>`;
  return html;
}

function openCardMenu(card){
  document.body.style.overflow = 'hidden';

  card.classList.add('menu-open');
  const menu = document.createElement('div');
  menu.className = 'menu';

  for(let i=0;i<7;i++){ const d = dateForIdx(i); options.push({ label:`${DOW_SHORT[i]} ${d.getDate()}`, key: iso(d), disabled: iso(d)===fromKey }); }
  menu.innerHTML = `
    <div class="label">Перенести на дату</div>

    <hr>
    <button data-act="dup">Дублировать здесь</button>
    <button data-act="dupNext7">Дублировать +7 дней</button>
    <button data-act="dupNext14">Дублировать +14 дней</button>
    <hr>
    <button class="danger" data-act="delete">Удалить пару</button>
  `;
  document.body.appendChild(menu);
  const rect = card.getBoundingClientRect();
  menu.style.top = `${rect.bottom + 5}px`;
  menu.style.left = `${rect.left}px`;
  if(rect.bottom + 400 > window.innerHeight) menu.style.top = `${rect.top - menu.offsetHeight - 5}px`;

  menu.addEventListener('click', ev => {
    const moveBtn = ev.target.closest('[data-move]');
    if(moveBtn){ moveItem(id, fromKey, moveBtn.dataset.move); closeMenus(); return; }
    const act = ev.target.closest('[data-act]'); if(!act) return;
    const a = act.dataset.act;
    const item = findItem(fromKey, id);
    if(!item){ closeMenus(); return; }
    if(a === 'delete'){
      data.days[fromKey] = itemsFor(fromKey).filter(i => i.id !== id);
      if(!data.days[fromKey].length) delete data.days[fromKey];
      save(); renderHome(); toast('Пара удалена');
    }
    if(a === 'dup'){
      const copy = {...item, id: uid(), done:false, autoDone:undefined, lmsStatus:'', hwIds: []};
      const arr = itemsFor(fromKey);
      arr.splice(arr.indexOf(item) + 1, 0, copy);
      save(); renderHome();
      toast('Пара продублирована');
    }
    if(a === 'dupNext7'){
      const toKey = iso(addDays(new Date(fromKey + 'T00:00:00'), 7));
      itemsFor(toKey).push({...item, id: uid(), done:false, autoDone:undefined, lmsStatus:'', hwIds: []});
      save(); toast('Продублировано +7 дней');
    }
    if(a === 'dupNext14'){
      const toKey = iso(addDays(new Date(fromKey + 'T00:00:00'), 14));
      itemsFor(toKey).push({...item, id: uid(), done:false, autoDone:undefined, lmsStatus:'', hwIds: []});
      save(); toast('Продублировано +14 дней');
    }
    closeMenus();
  });
}
function moveItem(id, fromKey, toKey){
  if(fromKey === toKey) return;
  const fromArr = itemsFor(fromKey);
  const idx = fromArr.findIndex(i => i.id === id);
  if(idx < 0) return;
  const [item] = fromArr.splice(idx, 1);
  if(!fromArr.length) delete data.days[fromKey];
  itemsFor(toKey).push(item);
  save(); renderHome();
}

function autoCrossOut(){
  const now = new Date();
  const todayKey = iso(new Date(now.getFullYear(), now.getMonth(), now.getDate()));
  const nowMin = now.getHours()*60 + now.getMinutes();
  let changed = false;
  Object.keys(data.days).forEach(key => {
    const arr = data.days[key];
    if(!Array.isArray(arr)) return;
    arr.forEach(item => {
      if(item.done || item.autoDone === false) return;
      if(key < todayKey){ item.done = true; item.autoDone = true; changed = true; return; }
      if(key === todayKey){
        const slot = parseSlot(item.time);
        if(!slot) return;
        if(nowMin >= slot.end){ item.done = true; item.autoDone = true; changed = true; }
      }
    });
  });
  if(changed) save();
  if(currentTab === 'home' && !isStandalone){
    const ae = document.activeElement;
    const typing = ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA' || ae.isContentEditable) && ae.closest('.card');
    if(!typing) renderList();
  }
}

let notifiedKeys = new Set();
try { notifiedKeys = new Set(JSON.parse(localStorage.getItem(NOTIFIED_KEY) || '[]')); } catch(e){}
function saveNotified(){ try{ localStorage.setItem(NOTIFIED_KEY, JSON.stringify([...notifiedKeys])); }catch(e){} }
function checkReminders(){
  const s = data.settings || {};
  if(!s.notifyEnabled || !('Notification' in window) || Notification.permission !== 'granted') return;
  const now = new Date();
  const todayKey = iso(new Date(now.getFullYear(), now.getMonth(), now.getDate()));
  const arr = data.days[todayKey] || [];
  const nowMin = now.getHours()*60 + now.getMinutes();
  const mins = parseInt(s.notifyMinutes, 10) || 15;
  let changed = false;
  const icon = document.querySelector('link[rel=icon]')?.href;
  arr.forEach(item => {
    if(!item.subject) return;
    const slot = parseSlot(item.time); if(!slot) return;
    const mb = slot.start - nowMin;
    if(mb <= 0 || mb > mins) return;
    const nKey = todayKey + ':' + item.id;
    if(notifiedKeys.has(nKey)) return;
    try{
      new Notification(`Скоро пара — ${item.subject}`, { body: `Начало в ${item.time}${item.room ? ' · ауд. ' + item.room : ''}`, tag: nKey, icon });
      if(navigator.vibrate) try{ navigator.vibrate([180, 90, 180]); }catch(_){}
    }catch(err){}
    notifiedKeys.add(nKey); changed = true;
  });
  const cutoff = iso(addDays(new Date(), -3));
  [...notifiedKeys].forEach(k => { if(k.split(':')[0] < cutoff){ notifiedKeys.delete(k); changed = true; } });
  if(changed) saveNotified();
}

function renderCalendar(){
  if(isStandalone) return;
  const y = calTabMonth.getFullYear(), m = calTabMonth.getMonth();
  $('#cal2Month').textContent = `${MONTHS_NOM[m]} ${y}`;
  const grid = $('#cal2Grid');
  grid.innerHTML = '';
  const fd = new Date(y, m, 1);
  const so = (fd.getDay() + 6) % 7;
  const dim = new Date(y, m + 1, 0).getDate();
  const today = todayDate();
  for(let i=0;i<so;i++){
    const el = document.createElement('button');
    el.className = 'cal-cell empty'; el.tabIndex = -1;
    grid.appendChild(el);
  }
  for(let d=1; d<=dim; d++){
    const date = new Date(y, m, d);
    const key = iso(date);
    const classes = data.days[key] || [];
    const clubs = clubsForDate(date);
    const isToday = sameDay(date, today);
    const isSelected = sameDay(date, calTabSelected);
    const allDots = [...classes.map(it => classColor(it)), ...clubs.map(cl => dotColorForClub(cl))];
    const shown = allDots.slice(0, 8);
    const dotsHtml = shown.map(c => `<span class="cal2-dot" style="background:${c}"></span>`).join('');
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'cal-cell' + (isToday?' today':'') + (isSelected?' selected':'');
    btn.dataset.date = key;
    btn.innerHTML = `<span class="num">${d}</span>${dotsHtml ? `<span class="cal2-dots">${dotsHtml}</span>` : ''}`;
    grid.appendChild(btn);
  }
  renderCalendarEvents();
  renderCalendarHomework();
}

  if(data.materials){
    (data.materials.notes||[]).forEach(n => { if(n.subject) subjects.add(n.subject); });
    (data.materials.autos||[]).forEach(a => { if(a.subject) subjects.add(a.subject); });

  const opts = '<option value="">— Предмет —</option>' + Array.from(subjects).sort().map(s => `<option value="${esc(s)}">${esc(s)}</option>`).join('');

function renderHomework(){
  if(isStandalone) return;
  updateSubjectDropdowns();
  const list = $('#hwList');
  list.innerHTML = '';
  const activeBySubject = {};
  const doneItems = [];
  let total = 0, doneCount = 0;
  Object.keys(data.homework).forEach(subj => {
    (data.homework[subj] || []).forEach(h => {
      total++;
      if(h.done){ doneCount++; doneItems.push({ ...h, subject: subj }); }
      else { if(!activeBySubject[subj]) activeBySubject[subj] = []; activeBySubject[subj].push(h); }
    });
  });
  $('#hwBadge').textContent = total ? `${doneCount}/${total}` : '';
  const activeSubjects = Object.keys(activeBySubject).sort();
  if(!activeSubjects.length && !doneItems.length){
    list.innerHTML = '<p class="empty"><div class="big">📝</div>ДЗ пока нет.</p>';
    return;
  }
  if(!activeSubjects.length && doneItems.length){
    list.innerHTML = '<p class="empty" style="padding-bottom:0"><div class="big">🎉</div>Все задания выполнены!</p>';
  }

  function hwItemHtml(h, subj, doneGroup){
    const color = getSubjectColor(subj);
    const fromCardTag = h.fromCard ? `<span class="hw-from-card" style="--subj-color:${color}">с карточки</span>` : '';
    const check = h.done ? 'checked' : '';
    return `<div class="hw-item${doneGroup ? ' done' : ''}" data-id="${h.id}" data-subject="${esc(subj)}" style="--subj-color:${color}">
      <label class="cl-check"><input type="checkbox" ${check}><span class="hw-box"></span></label>
      <span class="hw-text ${h.done ? 'strike' : ''}" contenteditable="true" data-hw-id="${h.id}" data-subject="${esc(subj)}">${esc(h.text)}</span>
      ${fromCardTag}
      <input type="date" class="hw-dl-input" value="${esc(h.deadline||'')}" data-hw-id="${h.id}" data-subject="${esc(subj)}">
      ${isAdmin ? '<button class="del" type="button">×</button>' : ''}
    </div>`;
  }

  activeSubjects.forEach(subject => {
    const items = activeBySubject[subject];
    const collapsed = openGroups['hw_' + subject] === false;
    const color = getSubjectColor(subject);
    const group = document.createElement('div');
    group.className = 'hw-group' + (collapsed ? ' collapsed' : '');
    group.dataset.subject = subject;
    group.style.setProperty('--subj-color', color);
    const itemsHtml = items.map(h => hwItemHtml(h, subject, false)).join('');
    group.innerHTML = `<div class="hw-group-head"><span class="hw-dot"></span><span class="hw-name">${esc(subject)}</span><span class="hw-counter">${items.length}</span><span class="hw-arrow">▾</span></div><div class="hw-group-body">${itemsHtml}</div>`;
    list.appendChild(group);
  });

  if(doneItems.length){
    const isExpanded = openGroups['hw_done_section'] === true;
    const group = document.createElement('div');
    group.className = 'hw-group hw-done-group' + (isExpanded ? '' : ' collapsed');
    group.dataset.doneSection = '1';
    const itemsHtml = doneItems.map(h => hwItemHtml(h, h.subject, true)).join('');
    group.innerHTML = `<div class="hw-group-head"><span class="hw-dot"></span><span class="hw-name">✅ Выполненные</span><span class="hw-counter">${doneItems.length}</span><span class="hw-arrow">▾</span></div><div class="hw-group-body">${itemsHtml}</div>`;
    list.appendChild(group);
  }
}

async function storeMaterialFile(file){
  const MAX_BASE64 = 1.5 * 1024 * 1024;
  try {
    const pid = profiles.current;
    const safeName = file.name.replace(/[^\w.\-]/g, '_');
    const path = `materials/${pid}/${Date.now()}-${safeName}`;
    const { error } = await supa.storage.from('materials').upload(path, file, { cacheControl: '3600', upsert: false });
    if(error) throw error;
    const { data: pub } = supa.storage.from('materials').getPublicUrl(path);
    return { url: pub.publicUrl, name: file.name };
  } catch(e) {
    if(file.size > MAX_BASE64) throw new Error('Файл слишком большой (макс. 1.5 МБ)');
    const dataUrl = await new Promise((res, rej) => {
      const r = new FileReader();
      r.onload = () => res(r.result);
      r.onerror = rej;
      r.readAsDataURL(file);
    });
    return { url: dataUrl, name: file.name };
  }
}

function renderMaterialList(arr, containerId, colId) {
  const container = document.getElementById(containerId);
  if(!container) return;
  container.innerHTML = '';
  if(!arr.length) container.innerHTML = '<div class="checklist-empty">Пусто</div>';

  arr.forEach(item => {
    const el = document.createElement('div');
    el.className = 'mat-item' + (item.done ? ' done' : '');
    el.dataset.id = item.id;
    el.dataset.col = colId;

    let content = '';
    if(item.type === 'text') content = `<span class="mat-text ${item.done ? 'strike' : ''}" contenteditable="true" data-id="${item.id}" data-col="${colId}">${esc(item.text)}</span>`;
    else if(item.type === 'image') content = `<a href="${esc(item.url)}" target="_blank"><img class="mat-img" src="${esc(item.url)}"></a>`;
    else content = `<a class="mat-link ${item.done ? 'strike' : ''}" href="${esc(item.url)}" target="_blank">📎 ${esc(item.name||'файл')}</a>`;

    el.innerHTML = `
      <div style="display:flex;gap:8px;align-items:flex-start">
        <label class="cl-check" style="margin-top:2px">
          <input type="checkbox" ${item.done?'checked':''} class="mat-check" data-id="${item.id}" data-col="${colId}">

          ${content}
        </div>
      </div>
      ${isAdmin ? '<button class="mat-del" type="button">×</button>' : ''}
    `;
    container.appendChild(el);
  });
}

/* ============ ПЛАНЕР ============ */
function svgCircularProgress(percent, done, total){
  const r = 42;
  const c = 2 * Math.PI * r;
  const offset = c * (1 - Math.max(0, Math.min(100, percent)) / 100);
  return `
    <div class="ph-progress-block">
      <svg class="cp-svg" viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="${r}" class="cp-bg"/>
        <circle cx="50" cy="50" r="${r}" class="cp-fill" style="stroke-dasharray:${c.toFixed(2)};stroke-dashoffset:${offset.toFixed(2)}" transform="rotate(-90 50 50)"/>
      </svg>
      <div class="cp-center">
        <div class="cp-percent">${percent}%</div>
        <div class="cp-label">${done} / ${total}</div>
      </div>
    </div>
  `;
}

function recurringMatchesDate(r, date){
  if(r.type === 'daily') return true;
  if(r.type === 'weekly'){ const dow = (date.getDay() + 6) % 7; return r.dayOfWeek === dow; }
  if(r.type === 'monthly') return date.getDate() === r.dayOfMonth;
  if(r.type === 'quarterly'){ const q = Math.floor(date.getMonth() / 3) + 1; return q === r.quarter && date.getDate() === (r.dayOfMonth || 1); }
  if(r.type === 'halfYear'){ const half = date.getMonth() < 6 ? 1 : 2; return half === r.half && date.getDate() === (r.dayOfMonth || 1); }
  return false;
}
function getRecurringForDate(date){
  const list = (data.planner && data.planner.recurring) || [];
  return list.filter(r => recurringMatchesDate(r, date));
}

function renderPlanner() {
  const container = document.getElementById('plannerContent');
  if (!container) return;

  if (!data.planner) data.planner = defaultPlanner();
  if (!data.planner.days) data.planner.days = {};
  if (!data.planner.habitList) data.planner.habitList = [];
  if (!data.planner.headers) data.planner.headers = defaultPlanner().headers;
  if (!data.planner.recurring) data.planner.recurring = [];
  if (!data.planner.recurringChecks) data.planner.recurringChecks = {};

  const key = iso(viewDate);

  document.querySelectorAll('.btn-planner').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.ptab === currentPlannerTab);
  });

  if (currentPlannerTab === 'daily') {
    const dayData = data.planner.days[key] || { important: [], additional: [], schedule: [], dontForget: [], notes: '' };
    const important = dayData.important || [];
    const additional = dayData.additional || [];
    const schedule = dayData.schedule || [];
    const dontForget = dayData.dontForget || [];
    const notes = dayData.notes || '';
    const totalTasks = important.length + additional.length;
    const doneTasks = important.filter(t=>t.done).length + additional.filter(t=>t.done).length;
    const progress = totalTasks === 0 ? 0 : Math.round((doneTasks / totalTasks) * 100);
    const dow = DOW_SHORT[(viewDate.getDay()+6)%7];
    const dayNum = viewDate.getDate();
    const monthName = MONTHS_GEN[viewDate.getMonth()];
    const year = viewDate.getFullYear();
    const recToday = getRecurringForDate(viewDate);
    const recChecks = data.planner.recurringChecks;
    const recDone = recToday.filter(r => recChecks[r.id + '@' + key]).length;

    container.innerHTML = `
      <div class="planner-hero">
        <div class="ph-nav">
          <button class="ph-arrow" id="pPrevDay">‹</button>
          <button class="ph-today" id="pToday">Сегодня</button>
          <button class="ph-arrow" id="pNextDay">›</button>

        <div class="ph-main">

            <div class="ph-dow">${dow}</div>
            <div class="ph-day">${dayNum}</div>
            <div class="ph-month">${monthName} ${year}</div>
          </div>
          ${svgCircularProgress(progress, doneTasks, totalTasks)}

      </div>
      <div class="daily-planner-grid">
        <div style="display:flex; flex-direction:column; gap:18px;">
          <div class="p-section">
            <div class="p-section-head" contenteditable="true" data-phead="important">${esc(data.planner.headers.important)}</div>
            <div class="p-list" id="pListImportant"></div>
            <form class="p-add-form" data-list="important">
              <input type="text" placeholder="Добавить..." required>
              <button type="submit">+</button>
            </form>
          </div>
          <div class="p-section">
            <div class="p-section-head" contenteditable="true" data-phead="additional">${esc(data.planner.headers.additional)}</div>
            <div class="p-list" id="pListAdditional"></div>
            <form class="p-add-form" data-list="additional">
              <input type="text" placeholder="Добавить..." required>
              <button type="submit">+</button>
            </form>
          </div>
          <div class="p-section">
            <div class="p-section-head" contenteditable="true" data-phead="schedule">${esc(data.planner.headers.schedule)}</div>
            <div class="p-list" id="pListSchedule"></div>
            <form class="p-add-form" data-list="schedule">
              <input type="text" placeholder="Время" style="flex:0 0 70px;" class="p-time-input">
              <input type="text" placeholder="Дело..." required style="flex:1;">
              <button type="submit">+</button>
            </form>
          </div>
          ${recToday.length ? `
          <div class="p-section">
            <div class="p-section-head">🔁 Повторяющиеся (${recDone}/${recToday.length})</div>
            <div class="p-list" id="pListRecurring"></div>
          </div>` : ''}
        </div>
        <div style="display:flex; flex-direction:column; gap:18px;">
          <div class="p-section">
            <div class="p-section-head" contenteditable="true" data-phead="habits">${esc(data.planner.headers.habits)}</div>
            <div class="habits-grid" id="pHabitGrid" style="grid-template-columns: 1fr repeat(7, 1fr);">
              <div style="font-size:10px; text-align:right; padding-right:8px; color:var(--peach);opacity:.7">Привычка</div>
              ${['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(d=>`<div style="font-size:10px; text-align:center; color:var(--peach);opacity:.7">${d}</div>`).join('')}
            </div>
            <form class="p-add-form" id="pAddHabitForm">
              <input type="text" placeholder="Новая привычка..." required>
              <button type="submit">+</button>
            </form>
          </div>
          <div class="p-section">
            <div class="p-section-head" contenteditable="true" data-phead="dontForget">${esc(data.planner.headers.dontForget)}</div>
            <div class="p-list" id="pListDontForget"></div>
            <form class="p-add-form" data-list="dontForget">
              <input type="text" placeholder="Добавить..." required>
              <button type="submit">+</button>
            </form>
          </div>
          <div class="p-section">
            <div class="p-section-head" contenteditable="true" data-phead="notes">${esc(data.planner.headers.notes)}</div>
            <textarea id="pNotesArea" style="width:100%; min-height:100px; background:var(--bg); border:1px solid var(--border); border-radius:10px; padding:10px; color:var(--text); outline:none; resize:vertical; font-family:inherit;">${esc(notes)}</textarea>
          </div>
        </div>
      </div>
    `;

    function renderPList(listId, arr, listName) {
      const listEl = container.querySelector(`#${listId}`);
      if(!listEl) return;
      listEl.innerHTML = '';
      if (!arr.length) { listEl.innerHTML = '<div style="color:var(--muted); font-size:12px; padding:5px;">Нет задач</div>'; return; }
      arr.forEach((task, idx) => {
        const row = document.createElement('div');
        row.className = 'p-item' + (task.done ? ' done' : '');
        row.innerHTML = `
          <div class="tsk-check ${task.done ? 'checked' : ''}" data-action="toggle" data-list="${listName}" data-idx="${idx}"></div>
          ${listName === 'schedule' ? `<span style="font-size:12px; color:var(--muted); flex:0 0 70px;">${esc(task.time||'')}</span>` : ''}
          <input type="text" value="${esc(task.text)}" data-action="edit" data-list="${listName}" data-idx="${idx}">
          <button class="p-del" data-action="del" data-list="${listName}" data-idx="${idx}">×</button>

        listEl.appendChild(row);
      });
    }
    renderPList('pListImportant', important, 'important');
    renderPList('pListAdditional', additional, 'additional');
    renderPList('pListSchedule', schedule, 'schedule');
    renderPList('pListDontForget', dontForget, 'dontForget');

    const recListEl = container.querySelector('#pListRecurring');
    if (recListEl && recToday.length) {
      recToday.forEach(r => {
        const isDone = !!recChecks[r.id + '@' + key];
        const row = document.createElement('div');
        row.className = 'p-item' + (isDone ? ' done' : '');
        row.innerHTML = `
          <div class="tsk-check ${isDone ? 'checked' : ''}" data-rec-toggle="${r.id}"></div>
          <input type="text" value="${esc(r.text)}" readonly tabindex="-1" style="cursor:default;">
        `;
        recListEl.appendChild(row);
      });
    }

    const weekStart = startOfWeek(viewDate);
    const habitGrid = container.querySelector('#pHabitGrid');
    data.planner.habitList.forEach((habit) => {
      const nameCell = document.createElement('div');
      nameCell.className = 'habit-name';
      nameCell.innerHTML = `<span contenteditable="true" data-habit-id="${habit.id}">${esc(habit.name)}</span> <button class="p-del" style="font-size:12px;" data-del-habit="${habit.id}">×</button>`;
      habitGrid.appendChild(nameCell);
      for(let i=0;i<7;i++){
        const d = addDays(weekStart, i);
        const dKey = iso(d);
        const isDone = habit.history && habit.history[dKey];
        const cell = document.createElement('div');
        cell.className = 'habit-cell' + (isDone ? ' active' : '');
        cell.dataset.habitId = habit.id;
        cell.dataset.dateKey = dKey;
        habitGrid.appendChild(cell);
      }
    });

    container.querySelector('#pPrevDay').onclick = () => { viewDate = addDays(viewDate, -1); renderPlanner(); };
    container.querySelector('#pNextDay').onclick = () => { viewDate = addDays(viewDate, 1); renderPlanner(); };
    container.querySelector('#pToday').onclick = () => { viewDate = todayDate(); renderPlanner(); };

    container.querySelectorAll('.p-add-form[data-list]').forEach(form => {
      form.onsubmit = (e) => {
        e.preventDefault();
        const listName = form.dataset.list;
        if (!data.planner.days[key]) data.planner.days[key] = {};
        if (!data.planner.days[key][listName]) data.planner.days[key][listName] = [];
        let text = form.querySelector('input[type="text"]:last-of-type').value.trim();
        let time = '';
        if (listName === 'schedule') time = form.querySelector('.p-time-input').value.trim();
        if (!text) return;
        data.planner.days[key][listName].push({ id: uid(), text, time, done: false });
        save(); form.reset(); renderPlanner();
      };
    });

    container.querySelector('#pAddHabitForm').onsubmit = (e) => {
      e.preventDefault();
      const input = e.target.querySelector('input');
      if (!input.value.trim()) return;
      data.planner.habitList.push({ id: uid(), name: input.value.trim(), history: {} });
      save(); renderPlanner();
    };

    // ВАЖНО: слушаем контейнер, а не его потомка (исправление бага)
    container.addEventListener('click', e => {
      if (e.target.classList.contains('tsk-check') && e.target.dataset.list) {
        const listName = e.target.dataset.list;
        const idx = parseInt(e.target.dataset.idx);
        const list = data.planner.days[key][listName];
        if (list && list[idx]) { list[idx].done = !list[idx].done; save(); renderPlanner(); }
      }
      if (e.target.dataset.recToggle) {
        const rid = e.target.dataset.recToggle;
        const ck = rid + '@' + key;
        data.planner.recurringChecks[ck] = !data.planner.recurringChecks[ck];
        save(); renderPlanner();
      }
      if (e.target.classList.contains('p-del') && e.target.dataset.list) {
        const listName = e.target.dataset.list;
        const idx = parseInt(e.target.dataset.idx);
        const list = data.planner.days[key][listName];
        if (list) { list.splice(idx, 1); save(); renderPlanner(); }
      }
      if (e.target.classList.contains('habit-cell')) {
        const habitId = e.target.dataset.habitId;
        const dKey = e.target.dataset.dateKey;
        const habit = data.planner.habitList.find(h => h.id === habitId);
        if (habit) { if (!habit.history) habit.history = {}; habit.history[dKey] = !habit.history[dKey]; save(); renderPlanner(); }
      }
      if (e.target.dataset.delHabit) {
        if (!confirm('Удалить привычку?')) return;
        data.planner.habitList = data.planner.habitList.filter(h => h.id !== e.target.dataset.delHabit);
        save(); renderPlanner();

    container.addEventListener('input', e => {
      if (e.target.dataset.action === 'edit') {
        const listName = e.target.dataset.list;

        if (list && list[idx]) { list[idx].text = e.target.value; save(); }

      if (e.target.dataset.habitId && e.target.tagName === 'SPAN') {
        const habit = data.planner.habitList.find(h => h.id === e.target.dataset.habitId);
        if (habit) { habit.name = e.target.textContent; save(); }
      }
      if (e.target.dataset.phead) { data.planner.headers[e.target.dataset.phead] = e.target.textContent; save(); }
      if (e.target.id === 'pNotesArea') { if (!data.planner.days[key]) data.planner.days[key] = {}; data.planner.days[key].notes = e.target.value; save(); }
    });

  } else if (currentPlannerTab === 'weekly') {
    const weekStart = startOfWeek(viewDate);
    let html = `<div style="display:flex; align-items:center; gap:10px; margin-bottom:20px;">
      <button class="icon-btn" id="pPrevWeek">‹</button>
      <h3 style="margin:0; flex:1; text-align:center; font-size:15px;">${formatWeekRange(weekStart, addDays(weekStart, 6))}</h3>

      const d = addDays(weekStart, i);
      const dKey = iso(d);
      const dayData = data.planner.days[dKey] || { important: [], additional: [] };
      const allTasks = [...(dayData.important||[]), ...(dayData.additional||[])];
      const doneCnt = allTasks.filter(t=>t.done).length;
      const pct = allTasks.length ? Math.round((doneCnt / allTasks.length) * 100) : 0;
      html += `
        <div class="weekly-day">
          <div class="weekly-day-head">
            <div>${formatDateHuman(d)}</div>

          </div>
          <div class="weekly-tasks">
            ${allTasks.map(t => `<div style="font-size:12px; text-decoration:${t.done?'line-through':'none'}; opacity:${t.done?0.5:1}; margin-bottom:6px; padding:4px 6px; background:var(--bg); border-radius:6px;">• ${esc(t.text)}</div>`).join('')}
            ${!allTasks.length ? '<div style="font-size:12px; color:var(--muted); text-align:center; padding:10px;">Пусто</div>' : ''}
          </div>
          <div style="padding:10px; border-top:1px solid var(--border);">
            <button class="btn-goto-day" data-date="${dKey}" style="width:100%; padding:8px; border-radius:8px; background:var(--btn-accent); color:var(--on-btn-accent); font-weight:700; font-family:inherit; font-size:12px; cursor:pointer; border:none;">Открыть день</button>
          </div>
        </div>
      `;
    }
    html += `</div>`;
    container.innerHTML = html;
    container.querySelector('#pPrevWeek').onclick = () => { viewDate = addDays(viewDate, -7); renderPlanner(); };
    container.querySelector('#pNextWeek').onclick = () => { viewDate = addDays(viewDate, 7); renderPlanner(); };
    container.querySelectorAll('.btn-goto-day').forEach(btn => {
      btn.onclick = () => { viewDate = new Date(btn.dataset.date + 'T00:00:00'); currentPlannerTab = 'daily'; renderPlanner(); };
    });

  } else if (currentPlannerTab === 'monthly') {
    let html = `
      <div class="monthly-calendar">
        <div class="mc-head">
          <button class="icon-btn" id="pPrevMonth">‹</button>
          <h3>${MONTHS_NOM[calTabMonth.getMonth()]} ${calTabMonth.getFullYear()}</h3>
          <button class="icon-btn" id="pNextMonth">›</button>
        </div>

      </div>`;

      const total = (dayData.important||[]).length + (dayData.additional||[]).length;

            ${type === 'quarterly' ? `<select class="p-rec-q" style="background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:6px;font-family:inherit;font-size:12px;"><option value="1">I</option><option value="2">II</option><option value="3">III</option><option value="4">IV</option></select><input type="number" min="1" max="31" placeholder="День" class="p-rec-dom" style="width:70px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:6px;font-family:inherit;font-size:12px;">` : ''}
            ${type === 'halfYear' ? `<select class="p-rec-half" style="background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:6px;font-family:inherit;font-size:12px;"><option value="1">I</option><option value="2">II</option></select><input type="number" min="1" max="31" placeholder="День" class="p-rec-dom" style="width:70px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:6px;font-family:inherit;font-size:12px;">` : ''}

        if (type === 'quarterly') meta = ' · ' + (r.quarter || 1) + ' кв., ' + (r.dayOfMonth || 1) + '-е';
        if (type === 'halfYear') meta = ' · ' + (r.half || 1) + ' пол., ' + (r.dayOfMonth || 1) + '-е';

      if (form) {
        form.onsubmit = (e) => {
          e.preventDefault();

          if (!text) return;
          const rec = { id: uid(), type, text, checks: {} };
          if (type === 'weekly') rec.dayOfWeek = parseInt(form.querySelector('.p-rec-dow').value, 10) || 0;
          else if (type === 'monthly') rec.dayOfMonth = Math.max(1, Math.min(31, parseInt(form.querySelector('.p-rec-dom').value, 10) || 1));
          else if (type === 'quarterly') { rec.quarter = parseInt(form.querySelector('.p-rec-q').value, 10) || 1; rec.dayOfMonth = Math.max(1, Math.min(31, parseInt(form.querySelector('.p-rec-dom').value, 10) || 1)); }
          else if (type === 'halfYear') { rec.half = parseInt(form.querySelector('.p-rec-half').value, 10) || 1; rec.dayOfMonth = Math.max(1, Math.min(31, parseInt(form.querySelector('.p-rec-dom').value, 10) || 1)); }
          data.planner.recurring.push(rec);
          save(); renderPlanner();
        };
      }
    });
    container.addEventListener('click', e => {
      if (e.target.dataset.recDel) { data.planner.recurring = data.planner.recurring.filter(r => r.id !== e.target.dataset.recDel); save(); renderPlanner(); }
    });
    container.addEventListener('input', e => {

profileBtn.addEventListener('click', e => { e.stopPropagation(); closeMenus(); openProfileMenu(); });

function openProfileMenu(){
  document.body.style.overflow = 'hidden';
  const menu = document.createElement('div');
  menu.className = 'menu profile-menu';
  const rect = profileBtn.getBoundingClientRect();
  menu.style.top = `${rect.bottom + 8}px`;
  menu.style.right = `${window.innerWidth - rect.right}px`;

  const visibleProfiles = isAdmin ? profiles.list : profiles.list.filter(p => p.id === profiles.current);
  const items = visibleProfiles.map(p => {
    const isCur = p.id === profiles.current;
    const del = (isAdmin && profiles.list.length > 1 && !FIXED_PROFILES.some(fp => fp.id === p.id)) ? `<button class="pi-del" data-del="${p.id}">×</button>` : '';
    const letter = (p.name||'?').trim().charAt(0).toUpperCase() || '?';
    const av = p.avatarImg ? `<img src="${esc(p.avatarImg)}" alt="">` : esc(letter);
    return `<div class="profile-item ${isCur?'current':''}" ${isAdmin ? `data-switch="${p.id}"` : ''}>
      <span class="pi-emoji">${av}</span>
      <span class="pi-name">${esc(p.name)}</span>
      ${isCur ? '<span class="pi-badge">вы</span>' : ''}
      ${del}
    </div>`;
  }).join('');

  let extra;
  if(isAdmin){
    extra = `
      <button data-act="openPlanner">🗓 Планер (новая вкладка)</button>
      <hr>
      <button data-act="adminLogout">🚪 Выйти из админа</button>
      <button data-act="profileLinks">🔗 Ссылки профилей</button>
      <button data-act="actions">⚙️ Действия и экспорт</button>
      <hr>
      <button data-act="changeAvatar">🖼 Сменить аватарку</button>
      <button data-act="newProfile">➕ Новый профиль</button>`;
  } else {
    extra = `
      <button data-act="openPlanner">🗓 Планер (новая вкладка)</button>
      <hr>
      <button data-act="adminLogin">🔑 Войти как админ</button>
      <button data-act="changeAvatar">🖼 Сменить аватарку</button>
      <button data-act="actionsUser">⚙️ Мои действия</button>`;
  }
  menu.innerHTML = `<div class="label">${isAdmin ? 'Профили' : 'Мой профиль'}</div>${items}<hr>${extra}`;
  document.body.appendChild(menu);

  menu.addEventListener('click', ev => {
    const del = ev.target.closest('[data-del]');
    if(del){
      ev.stopPropagation();
      if(!isAdmin){ toast('Только админ может удалять профили'); return; }
      const pid = del.dataset.del;
      const prof = profiles.list.find(p => p.id === pid);
      if(profiles.list.length <= 1){ toast('Нельзя удалить последний'); return; }
      if(!confirm(`Удалить профиль «${prof.name}»?`)) return;
      cancelPendingSaves();
      profiles.list = profiles.list.filter(p => p.id !== pid);
      if(profiles.current === pid) profiles.current = profiles.list[0].id;
      try{ localStorage.removeItem(dataKeyFor(pid)); }catch(e){}
      try{ supa.from('personal_data').delete().eq('id', 'personal-' + pid).then(()=>{}, ()=>{}); }catch(e){}
      saveProfiles(profiles); closeMenus();
      (async () => {
        const pid2 = profiles.current;
        const p = await fetchPersonal(pid2);
        lastPersonal = p || defaultPersonal();
        rebuildAndRender();
        subscribeRealtime();
      })();
      toast(`Профиль «${prof.name}» удалён`);
      return;
    }
    const sw = ev.target.closest('[data-switch]');
    if(sw){
      if(!isAdmin){ closeMenus(); return; }
      const pid = sw.dataset.switch;
      if(pid === profiles.current){ closeMenus(); return; }
      persistLocal();
      cancelPendingSaves();
      profiles.current = pid;
      saveProfiles(profiles);
      history.replaceState(null, '', '?p=' + pid);
      closeMenus();
      localPersonalCache = null;
      try{ const p = localStorage.getItem(dataKeyFor(pid)); if(p) localPersonalCache = splitData(JSON.parse(p)).personal; }catch(e){}
      (async () => {
        const p = await fetchPersonal(pid);
        lastPersonal = p || localPersonalCache || defaultPersonal();
        rebuildAndRender();
        subscribeRealtime();
        toast(`Профиль: ${currentProfile().name}`);
      })();
      return;
    }
    const act = ev.target.closest('[data-act]');
    if(!act) return;
    const a = act.dataset.act;
    if(a === 'openPlanner'){
      closeMenus();
      window.open(location.pathname + '?planner=true&p=' + profiles.current, '_blank');
      return;
    }
    if(a === 'adminLogin'){ closeMenus(); adminLogin(); return; }
    if(a === 'adminLogout'){ closeMenus(); adminLogout(); return; }
    if(a === 'profileLinks'){ if(!isAdmin){ toast('Только для админа'); return; } closeMenus(); openProfileLinksModal(); return; }
    if(a === 'actions'){ closeMenus(); openActionsModal(true); return; }
    if(a === 'actionsUser'){ closeMenus(); openActionsModal(false); return; }
    if(a === 'changeAvatar'){
      closeMenus();
      const p = currentProfile();
      openAvatarPicker(p.name, p.avatarImg, (name, img) => {
        const prof = profiles.list.find(x => x.id === profiles.current);
        if(!prof) return;
        prof.name = name; prof.avatarImg = img;
        saveProfiles(profiles);
        renderProfileBadge();
        toast('Аватарка обновлена');
      });
      return;
    }
    if(a === 'newProfile'){
      if(!isAdmin){ toast('Только для админа'); return; }
      closeMenus();
      openAvatarPicker('', '', (name, img) => {
        const newP = { id: 'p_'+Date.now().toString(36)+Math.random().toString(36).slice(2,4), name, avatarImg: img };
        persistLocal(); cancelPendingSaves();
        profiles.list.push(newP); profiles.current = newP.id;
        saveProfiles(profiles);
        history.replaceState(null, '', '?p=' + newP.id);
        lastPersonal = defaultPersonal(); localPersonalCache = null;
        personalWriteInFlight = true;
        pushPersonal(newP.id, lastPersonal).finally(() => { personalWriteInFlight = false; });
        rebuildAndRender(); subscribeRealtime();
        toast(`Создан профиль «${name}»`);
      });
    }
  });
}
function openAvatarPicker(initialName, initialImg, onSave){
