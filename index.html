<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Моё расписание</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%238b7bff'/%3E%3Crect x='16' y='24' width='68' height='62' rx='10' fill='white'/%3E%3Crect x='16' y='24' width='68' height='16' rx='10' fill='%23695cf0'/%3E%3Crect x='24' y='16' width='8' height='20' rx='4' fill='white'/%3E%3Crect x='68' y='16' width='8' height='20' rx='4' fill='white'/%3E%3C/svg%3E">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
  /* ===== ТЕМЫ ===== */
  :root, [data-theme="light"] {
    --bg:#f5f7fb; --card:#ffffff; --text:#1b1f2a; --muted:#6b7280; --border:#e6e9f2; 
    --accent:#6c5ce7; --on-accent:#ffffff; --shadow:0 2px 12px rgba(20,30,60,.07); 
    --hover:#eef1f9; --lms:#38a94e; --miss:#e03131;
  }
  
  /* КИСЛОТНАЯ ТЕМНАЯ ТЕМА */
  [data-theme="dark"] {
    --bg:#050505; 
    --card:#141414; 
    --text:#e0ffe0; 
    --muted:#99cc99; 
    --border:#224422; 
    --accent:#ccff00; 
    --on-accent:#000000; 
    --shadow:0 4px 20px rgba(204,255,0,.15); 
    --hover:#1a2a1a; 
    --lms:#00ffcc; 
    --miss:#ff0055;
  }
  
  /* РОЗОВАЯ ТЕМА (ПИКМИ) */
  [data-theme="pink"] {
    --bg:#fff0f5; 
    --card:#ffffff; 
    --text:#603a48; 
    --muted:#a88492; 
    --border:#fbcfe8; 
    --accent:#f06292; 
    --on-accent:#ffffff; 
    --shadow:0 4px 20px rgba(240,98,146,.12); 
    --hover:#fce7f3; 
    --lms:#10b981; 
    --miss:#ef4444;
  }
  
  [data-theme="pink"] body {
    background-image: radial-gradient(#fbcfe8 1.5px, transparent 1.5px);
    background-size: 24px 24px;
  }

  * { box-sizing: border-box; }
  html { transition: background .45s cubic-bezier(.4,0,.2,1); scroll-behavior: smooth; }
  body { margin:0; padding:14px 14px 110px; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif; background:var(--bg); color:var(--text); transition:background .45s, color .45s; -webkit-font-smoothing:antialiased; }
  body * { transition: background-color .3s, border-color .3s, color .3s, box-shadow .3s; }

  /* Скрываем дефолтные чекбоксы везде */
  input[type="checkbox"] { position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none; }

  .menu, .menu *, .toast, .modal, .modal *, .modal-backdrop, .card.dragging,
  .cal-event:hover, .link-item:hover, .day:hover, .week-nav .arrow:hover,
  .icon-btn:active, .profile-btn:active, .tabbar button, .toggle::after { transition-property: none; }
  .menu { animation: pop .13s ease-out !important; }
  .modal { animation: pop .2s ease-out !important; }

  .app { max-width:900px; margin:0 auto; }
  header.topbar { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px; position:relative; }
  header.topbar h1 { font-size:20px; margin:0; letter-spacing:-.3px; }
  .sync-status { display:flex; align-items:center; justify-content:center; font-size:18px; width:32px; height:32px; border-radius:10px; background:var(--card); border:1px solid var(--border); box-shadow:var(--shadow); flex:0 0 auto; }
  .sync-status.spin { animation: syncSpin 1s linear infinite; }
  @keyframes syncSpin { 0%{transform:rotate(0)} 50%{transform:rotate(180deg)} 100%{transform:rotate(360deg)} }
  .actions { display:flex; gap:8px; align-items:center; }
  .icon-btn { background:var(--card); border:1px solid var(--border); width:40px; height:40px; border-radius:12px; font-size:16px; cursor:pointer; box-shadow:var(--shadow); transition:transform .15s; color:var(--text); display:flex; align-items:center; justify-content:center; position:relative; }
  .icon-btn:active { transform:scale(.92); }
  .icon-btn .bell-dot { position:absolute; top:6px; right:6px; width:7px; height:7px; border-radius:50%; background:var(--lms); border:2px solid var(--card); display:none; }
  .icon-btn.bell-on .bell-dot { display:block; }
  .profile-btn { display:flex; align-items:center; gap:8px; background:var(--card); border:1px solid var(--border); height:40px; padding:0 12px 0 7px; border-radius:12px; cursor:pointer; box-shadow:var(--shadow); font-family:inherit; color:var(--text); font-size:13px; font-weight:600; }
  .profile-btn .profile-emoji { width:26px; height:26px; border-radius:8px; background:var(--accent); color:var(--on-accent); display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:800; overflow:hidden; }
  .profile-btn .profile-emoji img { width:100%; height:100%; object-fit:cover; border-radius:8px; }
  .profile-btn .profile-name { max-width:110px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  
  .view { display:block; animation:fadeIn .18s ease-out; }
  .view[hidden] { display:none !important; }
  @keyframes fadeIn { from{opacity:0;transform:translateY(4px)} to{opacity:1;transform:none} }
  
  .search-wrap { position:relative; margin-bottom:10px; }
  .search { width:100%; padding:11px 42px 11px 40px; border-radius:13px; background:var(--card); border:1px solid var(--border); box-shadow:var(--shadow); font:inherit; font-size:14px; color:var(--text); outline:none; }
  .search::placeholder { color:var(--muted); opacity:.8; }
  .search-icon { position:absolute; left:13px; top:50%; transform:translateY(-50%); color:var(--muted); font-size:14px; pointer-events:none; }
  .search-clear { position:absolute; right:8px; top:50%; transform:translateY(-50%); border:none; background:transparent; color:var(--muted); font-size:16px; cursor:pointer; padding:5px 9px; border-radius:8px; line-height:1; display:none; }
  .search-wrap.has-value .search-clear { display:block; }

  .week-nav { display:flex; align-items:center; gap:4px; margin-bottom:12px; background:var(--card); border-radius:13px; padding:5px 7px; box-shadow:var(--shadow); }
  .week-nav .arrow { border:none; background:transparent; color:var(--text); font-size:24px; line-height:1; height:44px; min-width:44px; padding:0 10px; border-radius:10px; cursor:pointer; display:flex; align-items:center; justify-content:center; font-family:inherit; }
  .week-nav .arrow.week-btn { font-size:22px; letter-spacing:-6px; font-weight:600; padding-right:12px; }
  .week-range { flex:1 1 auto; text-align:center; font-size:14px; font-weight:600; padding:0 4px; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .week-range .sub { font-size:12px; color:var(--muted); font-weight:500; display:block; margin-top:1px; }
  .today-btn { border:none; background:var(--accent); color:var(--on-accent); font:inherit; font-size:13px; font-weight:600; padding:9px 15px; border-radius:10px; cursor:pointer; flex:0 0 auto; }
  .today-btn[hidden] { display:none; }

  .days { display:flex; gap:6px; padding-bottom:4px; margin-bottom:10px; }
  .day { flex:1 1 0; min-width:42px; border:none; background:var(--card); color:var(--muted); padding:6px 3px 7px; border-radius:12px; font-weight:600; cursor:pointer; box-shadow:var(--shadow); position:relative; font-family:inherit; display:flex; flex-direction:column; align-items:center; gap:0; border:1px solid transparent; }
  .day .rel { font-size:8px; font-weight:600; line-height:11px; height:11px; white-space:nowrap; color:var(--muted); opacity:.7; width:100%; text-align:center; overflow:hidden; text-overflow:ellipsis; padding:0 2px; }
  .day.today .rel { color:var(--accent); opacity:1; font-weight:800; }
  .day.active .rel { color:var(--on-accent); opacity:.85; }
  .day .dow { font-size:11px; opacity:.85; margin-top:1px; }
  .day .num { font-size:16px; font-weight:700; color:var(--text); line-height:1.15; }
  .day .mini-dots { display:flex; gap:1.5px; margin-top:3px; flex-wrap:wrap; justify-content:center; max-width:100%; height:5px; align-items:center; }
  .day .mini-dot { width:5px; height:5px; border-radius:50%; flex:0 0 auto; }
  .day .mini-more { font-size:8px; color:var(--muted); line-height:1; margin-left:1px; }
  .day.active { background:var(--accent); color:var(--on-accent); }
  .day.active .num { color:var(--on-accent); }
  .day.today:not(.active) .num { color:var(--accent); }
  .day.today:not(.active) { border-color:var(--accent); }
  .stats { font-size:13px; color:var(--muted); margin:0 0 10px 4px; min-height:16px; }
  .empty { text-align:center; color:var(--muted); padding:28px 12px 16px; font-size:14px; }
  .empty .big { font-size:30px; margin-bottom:6px; opacity:.7; }

  .card { display:flex; gap:10px; align-items:flex-start; position:relative; background:var(--card); border-radius:14px; padding:12px 12px 12px 10px; border-left:6px solid var(--c,#999); box-shadow:var(--shadow); margin-bottom:8px; transition:opacity .3s; }
  .card.done input, .card.done textarea, .card.done .subject, .card.done .time, .card.done .room, .card.done .teacher { text-decoration: line-through !important; opacity: 0.6; }
  .card.done .grip, .card.done .type, .card.done .check, .card.done .dot, .card.done .lms-block { opacity:.5; }
  .card.done { background:color-mix(in srgb,var(--card) 70%,var(--bg)); }
  
  .card.menu-open { z-index:30; }
  .card.attended { box-shadow:0 0 0 1px var(--lms), var(--shadow); }
  .card.missed { box-shadow:0 0 0 1px var(--miss), var(--shadow); }
  .card.past { opacity:.65; }
  .card.past .dot { opacity:.5; }
  .card.current .dot { box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 35%,transparent); animation:dotPulse 1.6s ease-in-out infinite; }
  @keyframes dotPulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.35)} }
  .card.future .dot { background:#8b90a6; box-shadow:0 0 0 3px rgba(139,144,166,.18); }
  
  .grip { flex:0 0 auto; border:none; background:transparent; color:var(--muted); cursor:grab; font-size:20px; padding:2px 3px; line-height:1; opacity:.45; font-family:inherit; }
  .search-mode .grip { display:none; }
  
  .check { display:flex; padding-top:2px; cursor:pointer; flex:0 0 auto; }
  .box { width:22px; height:22px; border-radius:7px; border:2px solid var(--c,#999); display:block; position:relative; }
  .check input:checked + .box { background:var(--c,#999); }
  .check input:checked + .box::after { content:''; position:absolute; left:6px; top:2px; width:5px; height:10px; border:solid var(--on-accent); border-width:0 2.5px 2.5px 0; transform:rotate(45deg); }
  
  .body { flex:1 1 auto; min-width:0; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .dot { flex:0 0 auto; width:12px; height:12px; border-radius:50%; background:#8b90a6; transition:background .2s, box-shadow .2s; }
  .card.current .dot, .card.future .dot { background:var(--c); }
  
  input, textarea, select { font:inherit; background:transparent; border:none; color:inherit; outline:none; padding:2px 0; min-width:0; }
  input::placeholder, textarea::placeholder { color:var(--muted); opacity:.7; }
  .time { width:92px; font-size:14px; color:var(--muted); font-variant-numeric:tabular-nums; }
  .subject { flex:1 1 120px; font-weight:600; font-size:15px; }
  .room { width:80px; font-size:14px; color:var(--muted); text-align:right; }
  .teacher { width:100%; margin-top:3px; font-size:13px; color:var(--muted); font-style:italic; }
  textarea { resize:none; width:100%; margin-top:6px; font-size:13px; color:var(--muted); line-height:1.45; overflow:hidden; }
  
  .type { appearance:none; -webkit-appearance:none; border:1px solid var(--border); border-radius:8px; padding:3px 22px 3px 9px; font-size:11.5px; font-weight:700; cursor:pointer; background:var(--hover); color:var(--muted); text-transform:uppercase; outline:none; font-family:inherit; background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='8' height='5' viewBox='0 0 8 5'><path d='M0 0l4 4 4-4' fill='none' stroke='%238b90a6' stroke-width='1.4'/></svg>"); background-repeat:no-repeat; background-position:right 6px center; }
  .type[data-t="lec"] { background-color:#38a94e29; color:#38a94e; border-color:#38a94e66; }
  .type[data-t="prac"] { background-color:#4dabf729; color:#4dabf7; border-color:#4dabf766; }
  .type[data-t="lab"] { background-color:#e74c3c29; color:#e74c3c; border-color:#e74c3c66; }
  [data-theme="dark"] .type[data-t="lec"] { background-color:#ccff0029; color:#ccff00; border-color:#ccff0066; }
  [data-theme="dark"] .type[data-t="prac"] { background-color:#00ffcc29; color:#00ffcc; border-color:#00ffcc66; }
  [data-theme="dark"] .type[data-t="lab"] { background-color:#ff005529; color:#ff0055; border-color:#ff005566; }
  .type option { background:var(--card); color:var(--text); text-transform:none; font-weight:500; }
  .day-badge { display:none; font-size:10.5px; font-weight:700; background:var(--hover); color:var(--muted); padding:2px 7px; border-radius:6px; margin-right:2px; }
  .search-mode .day-badge { display:inline-block; }
  
  .card-hw { margin-top:8px; padding-top:8px; border-top:1px dashed var(--border); display:flex; flex-direction:column; gap:4px; }
  .card-hw-title { font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.5px; color:var(--muted); opacity:.85; display:flex; align-items:center; gap:6px; padding-left:2px; }
  .card-hw-title .hw-count { font-size:10px; background:var(--hover); color:var(--muted); padding:1px 6px; border-radius:5px; text-transform:none; font-weight:700; }
  .card-hw-list { display:flex; flex-direction:column; gap:1px; }
  .card-hw-item { display:flex; gap:8px; align-items:flex-start; padding:6px 4px; border-radius:7px; font-size:13.5px; }
  .card-hw-item .chw-check { position:relative; display:flex; align-items:center; cursor:pointer; flex:0 0 auto; }
  .chw-box { width:15px; height:15px; border-radius:5px; border:1.5px solid var(--c,#999); display:block; position:relative; background:transparent; margin-top:2px; }
  .chw-check input:checked + .chw-box { background:var(--c,#999); }
  .chw-check input:checked + .chw-box::after { content:''; position:absolute; left:3.5px; top:0.5px; width:4px; height:8px; border:solid var(--on-accent); border-width:0 2px 2px 0; transform:rotate(45deg); }
  .card-hw-item .chw-text { flex:1 1 auto; color:var(--text); min-width:0; word-break:break-word; overflow-wrap:anywhere; line-height:1.4; padding:2px 0; }
  .card-hw-item .chw-del { flex:0 0 auto; border:none; background:transparent; color:var(--muted); cursor:pointer; font-size:14px; padding:1px 5px; border-radius:5px; opacity:.4; font-family:inherit; }
  .card-hw-empty { font-size:12px; color:var(--muted); padding:2px 4px 4px; opacity:.7; }
  .card-hw-add { display:flex; gap:6px; align-items:center; margin-top:2px; }
  .card-hw-add input { flex:1 1 auto; background:var(--hover); border:1px solid var(--border); border-radius:8px; padding:6px 9px; font-size:13px; color:var(--text); outline:none; }
  .card-hw-add input::placeholder { color:var(--muted); opacity:.6; }
  .card-hw-add button { flex:0 0 auto; width:30px; height:30px; border-radius:8px; background:var(--accent); color:var(--on-accent); border:none; font-size:17px; cursor:pointer; font-family:inherit; display:flex; align-items:center; justify-content:center; }
  .search-mode .card-hw { display:none; }
  
  .lms-block { flex:0 0 auto; align-self:flex-start; display:flex; flex-direction:column; align-items:center; gap:4px; padding-top:1px; }
  .lms-label { font-size:9px; font-weight:800; text-transform:uppercase; letter-spacing:.3px; color:var(--muted); text-align:center; line-height:1.15; white-space:nowrap; }
  .lms-btns { display:flex; gap:3px; }
  .lms-btn { width:26px; height:26px; border-radius:8px; border:1.5px solid var(--border); background:transparent; color:var(--muted); cursor:pointer; font-size:13px; font-weight:800; line-height:1; display:flex; align-items:center; justify-content:center; font-family:inherit; padding:0; }
  .lms-btn.attended.active { background:var(--lms); color:#0d2a13; border-color:var(--lms); }
  [data-theme="light"] .lms-btn.attended.active { color:#fff; }
  [data-theme="pink"] .lms-btn.attended.active { color:#fff; }
  .lms-btn.missed.active { background:var(--miss); color:#fff; border-color:var(--miss); }
  .search-mode .lms-block { display:none; }
  
  .more { flex:0 0 auto; align-self:flex-start; background:transparent; border:none; color:var(--muted); cursor:pointer; font-size:20px; padding:3px 7px; border-radius:8px; opacity:.6; line-height:1; font-family:inherit; }
  
  .menu { position:absolute; right:6px; top:calc(100% - 4px); z-index:60; background:var(--card); border:1px solid var(--border); border-radius:14px; box-shadow:0 10px 40px rgba(0,0,0,.5); padding:7px; min-width:210px; }
  .menu.up { top:auto; bottom:calc(100% - 4px); }
  @keyframes pop { from{opacity:0;transform:translateY(-5px)} to{opacity:1;transform:none} }
  .menu .label { font-size:11px; text-transform:uppercase; letter-spacing:.6px; color:var(--muted); padding:7px 10px 5px; font-weight:700; }
  .menu button { display:block; width:100%; text-align:left; border:none; background:transparent; color:var(--text); padding:9px 11px; border-radius:9px; font:inherit; font-size:14px; cursor:pointer; font-family:inherit; }
  .menu button:hover { background:var(--hover); }
  .menu button.danger:hover { background:rgba(255,107,107,.18); color:#ff6b6b; }
  .menu hr { border:none; border-top:1px solid var(--border); margin:6px 4px; }
  
  .chips { display:flex; flex-wrap:wrap; gap:5px; padding:2px 8px 8px; }
  .chips button { width:auto; display:inline-block; padding:6px 10px; font-size:12.5px; font-weight:600; background:var(--hover); border-radius:8px; }
  .chips button:disabled { opacity:.35; pointer-events:none; }
  
  .profile-menu { min-width:230px; }
  .profile-item { display:flex; align-items:center; gap:9px; width:100%; padding:8px 10px; background:transparent; color:var(--text); border-radius:9px; cursor:pointer; font-size:14px; text-align:left; }
  .profile-item:hover { background:var(--hover); }
  .profile-item.current { background:color-mix(in srgb,var(--accent) 15%,transparent); }
  .profile-item .pi-emoji { width:28px; height:28px; border-radius:9px; flex:0 0 auto; background:var(--accent); color:var(--on-accent); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:800; overflow:hidden; }
  .profile-item .pi-emoji img { width:100%; height:100%; object-fit:cover; border-radius:9px; }
  .profile-item .pi-name { flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:600; }
  .profile-item .pi-badge { font-size:10px; font-weight:700; color:var(--accent); text-transform:uppercase; }
  .profile-item .pi-del { flex:0 0 auto; border:none; background:transparent; color:var(--muted); cursor:pointer; font-size:16px; padding:2px 6px; border-radius:6px; opacity:.5; font-family:inherit; }
  
  .modal-input { width:100%; background:var(--hover); border:1px solid var(--border); border-radius:10px; padding:10px 12px; font-size:14px; color:var(--text); outline:none; font-family:inherit; margin-bottom:4px; }
  
  .bottom { display:grid; grid-template-columns:1fr; gap:16px; margin-top:16px; align-items:start; }
  .add { display:flex; gap:8px; flex-wrap:wrap; padding:12px; border-radius:14px; border:2px dashed var(--border); }
  .add input { flex:1 1 120px; background:var(--card); border:1px solid var(--border); border-radius:10px; padding:10px 12px; font-size:14px; }
  .add select { flex:1 1 120px; background:var(--card); border:1px solid var(--border); border-radius:10px; padding:10px 30px 10px 12px; font-size:14px; cursor:pointer; color:var(--text); background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M0 0l5 5 5-5' fill='none' stroke='%238b90a6' stroke-width='1.5'/></svg>"); background-repeat:no-repeat; background-position:right 10px center; appearance:none; }
  .add button[type="submit"] { flex:1 1 100%; background:var(--accent); color:var(--on-accent); border:none; padding:11px 18px; border-radius:10px; font-weight:600; cursor:pointer; font-size:14px; font-family:inherit; }
  .add-note { width:100%; font-size:12px; color:var(--muted); margin-top:2px; padding-left:4px; }
  .add-note b { color:var(--text); font-weight:600; }
  
  /* Главный экран: Мои дела */
  .home-checklist-sec { margin-top: 14px; background: var(--card); border-radius: 14px; padding: 14px; box-shadow: var(--shadow); }
  .home-checklist-sec h3 { margin: 0 0 10px; font-size: 15px; display: flex; align-items: center; gap: 6px; }
  .home-checklist-list { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }

const pad = n => String(n).padStart(2,'0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
function startOfWeek(d){ const x = new Date(d); x.setHours(0,0,0,0); x.setDate(x.getDate() - ((x.getDay()+6)%7)); return x; }
function addDays(d, n){ const x = new Date(d); x.setDate(x.getDate() + n); return x; }
function sameDay(a, b){ return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }
function daysBetween(a, b){
  const x = new Date(a.getFullYear(), a.getMonth(), a.getDate());
  const y = new Date(b.getFullYear(), b.getMonth(), b.getDate());
  return Math.round((x - y) / 86400000);
}
function parseSlot(str){
  const s = String(str||'').trim(); if(!s) return null;
  const parts = s.split(/[-–—]/).map(x=>x.trim()).filter(Boolean);
  const toMin = t => {
    const m = String(t).match(/^(\d{1,2})[:.\s]?(\d{2})$/); if(!m) return null;
    const h=+m[1], mi=+m[2]; return (h>23||mi>59) ? null : h*60+mi;
  };
  const start = toMin(parts[0]); if(start === null) return null;
  let end = parts[1] ? toMin(parts[1]) : null;
  if(end === null || end <= start) end = start + 90;
  return {start, end};
}
function formatWeekRange(a, b){
  const d1=a.getDate(), m1=a.getMonth(), y1=a.getFullYear();
  const d2=b.getDate(),   m2=b.getMonth(),   y2=b.getFullYear();
  const cy = new Date().getFullYear();
  let s;
  if(m1===m2 && y1===y2) s = `${d1} – ${d2} ${MONTHS_GEN[m1]}`;
  else if(y1===y2) s = `${d1} ${MONTHS_GEN[m1]} – ${d2} ${MONTHS_GEN[m2]}`;
  else s = `${d1} ${MONTHS_GEN[m1]} ${y1} – ${d2} ${MONTHS_GEN[m2]} ${y2}`;
  if(y1===y2 && y1!==cy) s += ` ${y1}`;
  return s;
}
function formatDateShort(d){ return `${d.getDate()} ${MONTHS_SHORT[d.getMonth()]}`; }
function formatDateHuman(d){ return `${DOW_SHORT[(d.getDay()+6)%7]}, ${d.getDate()} ${MONTHS_GEN[d.getMonth()]}`; }
function formatDateFull(d){ return `${DOW_SHORT[(d.getDay()+6)%7]}, ${d.getDate()} ${MONTHS_GEN[d.getMonth()]} ${d.getFullYear()}`; }
function diffWeeks(a, b){ return Math.round((startOfWeek(a).getTime() - startOfWeek(b).getTime()) / (7*86400000)); }
function relativeDayLabel(date){
  const diff = daysBetween(date, todayDate());
  switch(diff){
    case 0: return 'сегодня'; case 1: return 'завтра'; case 2: return 'послезавтра';
    case -1: return 'вчера'; case -2: return 'позавчера';
    default: return '';
  }
}

function isDark(){ return document.documentElement.dataset.theme === 'dark'; }
function hashStr(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=(h*16777619)|0; } return Math.abs(h); }
function clubColor(name){
  const s = String(name||'').trim().toLowerCase();
  if(!s) return '#9aa1b5';
  const h1 = hashStr(s), h2 = hashStr(s + '·x');
  const hue = (h1*137.508)%360;
  const sat = 55+(h2%26);
  const light = isDark() ? 55+((h2>>8)%15) : 42+((h2>>8)%15);
  return `hsl(${hue.toFixed(0)}, ${sat}%, ${light}%)`;
}
function classColor(item){
  if(!item || !item.type) return NO_TYPE_COLOR;
  return (isDark() ? TYPE_COLORS_DARK : TYPE_COLORS)[item.type] || NO_TYPE_COLOR;
}
function applyCardColor(card, item){
  const c = classColor(item);
  card.style.setProperty('--c', c);
}
function dotColorForClub(club){ return clubColor(club.name); }

function classState(item, dateKey){
  const now = new Date();
  const todayKey = iso(new Date(now.getFullYear(), now.getMonth(), now.getDate()));
  if(dateKey < todayKey) return 'past';
  if(dateKey > todayKey) return 'future';
  const slot = parseSlot(item.time);
  if(!slot) return 'future';
  const nowMin = now.getHours()*60 + now.getMinutes();
  if(nowMin < slot.start) return 'future';
  if(nowMin < slot.end) return 'current';
  return 'past';
}

function isSameData(a, b){
  if(a === b) return true;
  if(a === null || b === null || a === undefined || b === undefined) return false;
  if(typeof a !== typeof b) return false;
  if(typeof a !== 'object') return false;
  const aArr = Array.isArray(a), bArr = Array.isArray(b);
  if(aArr !== bArr) return false;
  if(aArr){
    if(a.length !== b.length) return false;
    for(let i=0;i<a.length;i++) if(!isSameData(a[i], b[i])) return false;
    return true;
  }
  const ak = Object.keys(a).sort(), bk = Object.keys(b).sort();
  if(ak.length !== bk.length) return false;
  for(let i=0;i<ak.length;i++){
    if(ak[i] !== bk[i]) return false;
    if(!isSameData(a[ak[i]], b[bk[i]])) return false;
  }
  return true;
}

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function defaultPlanner(){

}
function defaultData(){

}
function normClub(c){ return { id: c.id || uid(), date: String(c.date||''), repeat: c.repeat === 'weekly' ? 'weekly' : 'once', time: String(c.time||''), name: String(c.name||''), place: String(c.place||'') }; }
function normLink(l){

  if(url && !/^https?:\/\//i.test(url)) url = 'https://' + url;
  return { id: l.id || uid(), title: String(l.title||''), url };
}
function normMaterial(m){
  return { id: m.id || uid(), subject: String(m.subject||''), type: m.type || 'text', text: String(m.text||''), url: String(m.url||''), name: String(m.name||'') };
}

function splitData(d){
  const shared = { days:{}, homework:{}, materials:{ notes:[], autos:[], methodichki:[] } };
  const personal = defaultPersonal();
  personal.checklists = d.checklists || {};
  personal.planner = d.planner || {};
  personal.clubs = (d.clubs || []).map(normClub).filter(c => c.name || c.date);
  personal.links = (d.links || []).map(normLink).filter(l => l.title || l.url);
  
  if(d.materials){
    shared.materials = {
      notes: (d.materials.notes||[]).map(normMaterial),
      autos: (d.materials.autos||[]).map(normMaterial),
      methodichki: (d.materials.methodichki||[]).map(normMaterial)
    };
    shared.materials.notes.forEach(n => {
      personal.materialStates[n.id] = { done: !!n.done };
      delete n.done;
    });
    shared.materials.autos.forEach(a => {
      personal.materialStates[a.id] = { done: !!a.done };
      delete a.done;
    });
    shared.materials.methodichki.forEach(m => {
      personal.materialStates[m.id] = { done: !!m.done };
      delete m.done;
    });
  }
  if(d.settings) personal.settings = { ...personal.settings, ...d.settings };
  
  Object.keys(d.days || {}).forEach(k => {
    const arr = d.days[k];
    if(!Array.isArray(arr) || !arr.length) return;
    shared.days[k] = arr.map(it => ({
      id: it.id,
      time: String(it.time||''),
      subject: String(it.subject||''),
      type: ['lec','prac','lab'].includes(it.type) ? it.type : '',
      teacher: String(it.teacher||''),
      room: String(it.room||''),
      hwIds: Array.isArray(it.hwIds) ? it.hwIds.slice() : []
    }));
    arr.forEach(it => {
      personal.itemStates[it.id] = { done: !!it.done, notes: String(it.notes||''), lmsStatus: ['attended','missed'].includes(it.lmsStatus) ? it.lmsStatus : '' };
    });
  });
  Object.keys(d.homework || {}).forEach(subj => {
    const arr = d.homework[subj];
    if(!Array.isArray(arr) || !arr.length) return;
    shared.homework[subj] = arr.map(h => ({
      id: h.id, text: String(h.text||''), deadline: h.deadline ? String(h.deadline) : '', fromCard: h.fromCard ? String(h.fromCard) : ''
    }));
    arr.forEach(h => { personal.hwStates[h.id] = { done: !!h.done }; });
  });
  return { shared, personal };
}

function mergeData(shared, personal){
  const out = defaultData();
  shared = shared || { days:{}, homework:{}, materials:{ notes:[], autos:[], methodichki:[] } };
  personal = personal || defaultPersonal();
  const itemStates = personal.itemStates || {}, hwStates = personal.hwStates || {}, matStates = personal.materialStates || {};
  
  out.materials = { notes:[], autos:[], methodichki:[] };
  if(shared.materials){
    out.materials.notes = (shared.materials.notes||[]).map(n => {
      const st = matStates[n.id] || {};
      return { ...normMaterial(n), done: !!st.done };
    });
    out.materials.autos = (shared.materials.autos||[]).map(n => {
      const st = matStates[n.id] || {};
      return { ...normMaterial(n), done: !!st.done };
    });
    out.materials.methodichki = (shared.materials.methodichki||[]).map(n => {
      const st = matStates[n.id] || {};
      return { ...normMaterial(n), done: !!st.done };
    });
  }

  Object.keys(shared.days || {}).forEach(k => {
    const arr = shared.days[k];
    if(!Array.isArray(arr) || !arr.length) return;
    out.days[k] = arr.map(it => {
      const st = itemStates[it.id] || {};
      return {
        id: it.id, time: String(it.time||''), subject: String(it.subject||''),
        type: ['lec','prac','lab'].includes(it.type) ? it.type : '',
        teacher: String(it.teacher||''), room: String(it.room||''),
        notes: String(st.notes||''), done: !!st.done, autoDone: undefined,
        lmsStatus: ['attended','missed'].includes(st.lmsStatus) ? st.lmsStatus : '',
        hwIds: Array.isArray(it.hwIds) ? it.hwIds.slice() : []
      };
    });
  });
  Object.keys(shared.homework || {}).forEach(subj => {
    const arr = shared.homework[subj];
    if(!Array.isArray(arr) || !arr.length) return;
    out.homework[subj] = arr.map(h => {
      const st = hwStates[h.id] || {};
      return { id: h.id, text: String(h.text||''), done: !!st.done, deadline: h.deadline ? String(h.deadline) : '', fromCard: h.fromCard ? String(h.fromCard) : '' };
    });
  });
  if(personal.checklists) out.checklists = personal.checklists;
  if(personal.planner) out.planner = personal.planner;
  if(Array.isArray(personal.clubs)) out.clubs = personal.clubs.map(normClub).filter(c => c.name || c.date);
  if(Array.isArray(personal.links)) out.links = personal.links.map(normLink).filter(l => l.title || l.url);
  if(personal.settings) out.settings = { ...out.settings, ...personal.settings };
  return out;
}

function scheduleSharedSave(){
  clearTimeout(sharedSaveTimer);
  sharedSaveTimer = setTimeout(trySharedSave, 300);
}
function schedulePersonalSave(){
  clearTimeout(personalSaveTimer);
  personalSaveTimer = setTimeout(tryPersonalSave, 300);
}
async function trySharedSave(){
  if(sharedWriteInFlight){ sharedSaveQueued = true; return; }
  const { shared } = splitData(data);
  if(isSameData(shared, lastShared)) return;
  setSyncStatus('saving');
  sharedWriteInFlight = true;
  const ok = await pushShared(shared);
  if(ok){ lastShared = shared; setSyncStatus('synced'); }
  sharedWriteInFlight = false;
  if(sharedSaveQueued){ sharedSaveQueued = false; scheduleSharedSave(); }
}
async function tryPersonalSave(){
  if(personalWriteInFlight){ personalSaveQueued = true; return; }
  const { personal } = splitData(data);
  if(isSameData(personal, lastPersonal)) return;
  setSyncStatus('saving');
  personalWriteInFlight = true;
  const ok = await pushPersonal(profiles.current, personal);
  if(ok){ lastPersonal = personal; setSyncStatus('synced'); }
  personalWriteInFlight = false;
  if(personalSaveQueued){ personalSaveQueued = false; schedulePersonalSave(); }
}
function hasPendingSharedChanges(){
  if(sharedWriteInFlight || sharedSaveQueued) return true;
  return !isSameData(splitData(data).shared, lastShared);
}
function hasPendingPersonalChanges(){
  if(personalWriteInFlight || personalSaveQueued) return true;
  return !isSameData(splitData(data).personal, lastPersonal);
}
function cancelPendingSaves(){
  clearTimeout(sharedSaveTimer);
  clearTimeout(personalSaveTimer);
  sharedSaveQueued = false;
  personalSaveQueued = false;
}
function save(){
  persistLocal();
  scheduleSharedSave();
  schedulePersonalSave();
}
function flushSaves(){
  const { shared, personal } = splitData(data);
  if(!isSameData(shared, lastShared)){ pushShared(shared); lastShared = shared; }
  if(!isSameData(personal, lastPersonal)){ pushPersonal(profiles.current, personal); lastPersonal = personal; }
}

function subscribeRealtime(){
  if(realtimeChannel){ try{ supa.removeChannel(realtimeChannel); }catch(e){} realtimeChannel = null; }
  const pid = profiles.current;
  realtimeChannel = supa.channel('sync-channel')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'shared_data', filter: `id=eq.${SHARED_ID}` }, payload => {
      const row = payload.new;
      if(!row || !row.data) return;
      if(hasPendingSharedChanges()){ scheduleSharedSave(); return; }
      if(!isSameData(lastShared, row.data)){ lastShared = row.data; rebuildAndRender(); }
      setSyncStatus('synced');
    })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'personal_data', filter: `id=eq.personal-${pid}` }, payload => {
      if(pid !== profiles.current) return;
      const row = payload.new;
      if(!row || !row.data) return;
      if(hasPendingPersonalChanges()){ schedulePersonalSave(); return; }
      if(!isSameData(lastPersonal, row.data)){ lastPersonal = row.data; rebuildAndRender(); }
      setSyncStatus('synced');
    })
    .subscribe((status) => {
      if(status === 'SUBSCRIBED') setSyncStatus('synced');
      else if(status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') setSyncStatus('offline');
    });
}

function copyDayTo(fromKey, toKey, replace){
  if(fromKey === toKey) return 0;
  const src = data.days[fromKey] || [];
  if(replace){
    const targetArr = itemsFor(toKey);
    targetArr.forEach(it => {
      (it.hwIds||[]).forEach(hwId => {
        const found = findHWById(hwId);
        if(found){
          data.homework[found.subject] = (data.homework[found.subject]||[]).filter(h => h.id !== hwId);
          if(!data.homework[found.subject].length) delete data.homework[found.subject];
        }
      });
    });
    data.days[toKey] = [];
  }
  const target = itemsFor(toKey);
  let copied = 0;
  src.forEach(item => {
    const newId = uid();
    const newHwIds = [];
    (item.hwIds||[]).forEach(oldHwId => {
      const found = findHWById(oldHwId);
      if(!found) return;
      const newHwId = uid();
      if(!data.homework[found.subject]) data.homework[found.subject] = [];
      data.homework[found.subject].push({ id: newHwId, text: found.item.text, done: false, deadline: toKey, fromCard: newId });
      newHwIds.push(newHwId);
    });
    target.push({
      id: newId, time: item.time, subject: item.subject, type: item.type,
      teacher: item.teacher, room: item.room,
      notes: '', done: false, autoDone: undefined, lmsStatus: '', hwIds: newHwIds
    });
    copied++;
  });
  save();
  return copied;
}

function renderWeekNav(){
  const s = currentWeekStart(), e = addDays(s, 6);
  const today = todayDate();
  const wd = diffWeeks(viewDate, today);
  let sub;
  if(sameDay(viewDate, today)) sub = 'сегодня';
  else if(sameDay(viewDate, addDays(today, 1))) sub = 'завтра';
  else if(sameDay(viewDate, addDays(today, -1))) sub = 'вчера';
  else if(wd === 0) sub = 'текущая неделя';
  else if(wd === -1) sub = 'прошлая неделя';
  else if(wd === 1) sub = 'следующая неделя';
  else if(wd < 0) sub = `${Math.abs(wd)} нед. назад`;
  else sub = `через ${wd} нед.`;
  $('#weekRange').innerHTML = `${esc(formatWeekRange(s,e))}<span class="sub">${esc(sub)}</span>`;
  $('#todayBtn').hidden = isCurrentDay();
}

    const date = dateForIdx(i);
    const isToday = sameDay(date, today);
    const dayItems = data.days[iso(date)] || [];
    const dayClubs = clubsForDate(date);
    const rel = relativeDayLabel(date);
    const b = document.createElement('button');
    b.type = 'button';
    b.dataset.idx = i;
    b.className = 'day' + (i === cdi ? ' active' : '') + (isToday ? ' today' : '') + ((dayItems.length || dayClubs.length) ? ' has-items' : '');
    b.innerHTML = `
      <span class="rel" title="${esc(rel)}">${esc(rel)}</span>
      <span class="dow">${DOW_SHORT[i]}</span>
      <span class="num">${date.getDate()}</span>
      <span class="mini-dots">${renderMiniDots(dayItems, dayClubs)}</span>
    `;
    daysNav.appendChild(b);
  }
}
function renderMiniDots(items, clubs){
  items = items || []; clubs = clubs || [];
  const MAX = 6;
  const dots = [
    ...items.map(it => ({ color: classColor(it) })),
    ...clubs.map(cl => ({ color: dotColorForClub(cl) }))
  ];
  if(!dots.length) return '';
  const shown = dots.slice(0, MAX);
  const extra = dots.length - shown.length;
  let html = shown.map(d => `<span class="mini-dot" style="background:${d.color}"></span>`).join('');
  if(extra > 0) html += `<span class="mini-more">+${extra}</span>`;
  return html;
}

function renderList(){

  $('#searchWrap').classList.toggle('has-value', searching);
  const rendered = [];
  if(searching){
    Object.keys(data.days).sort().forEach(key => {
      const arr = data.days[key] || [];
      const d = new Date(key + 'T00:00:00');
      const badge = `${DOW_SHORT[(d.getDay()+6)%7]}, ${formatDateShort(d)}`;
      arr.forEach(item => {
        const hay = (item.subject+' '+item.teacher+' '+item.room+' '+item.notes+' '+(TYPE_LABEL[item.type]||'')).toLowerCase();
        if(hay.includes(q)) rendered.push({ item, dateKey: key, badge, readonly: true });
      });

    const key = currentKey();
    const arr = data.days[key] || [];
    arr.forEach(item => rendered.push({ item, dateKey: key, badge: '', readonly: false }));

function addHomeworkFromCard(card, text){

  const item = findItem(card.dataset.dateKey, card.dataset.id);
  if(!item) return false;
  const subject = (item.subject||'').trim();
  if(!subject){ toast('Сначала укажи название пары'); return false; }
  const deadline = card.dataset.dateKey;
  const hwId = uid();
  if(!data.homework[subject]) data.homework[subject] = [];

  item.hwIds.push(hwId);
  save();
  return true;

function openCardMenu(card){
  const id = card.dataset.id, fromKey = card.dataset.dateKey;
  card.classList.add('menu-open');
  const menu = document.createElement('div');
  menu.className = 'menu';
  const options = [];
  for(let i=0;i<7;i++){ const d = dateForIdx(i); options.push({ label:`${DOW_SHORT[i]} ${d.getDate()}`, key: iso(d), disabled: iso(d)===fromKey }); }
  menu.innerHTML = `
    <div class="label">Перенести на дату</div>
    <div class="chips">${options.map(o => `<button data-move="${o.key}" ${o.disabled?'disabled':''}>${o.label}</button>`).join('')}</div>
    <hr>
    <button data-act="dup">Дублировать здесь</button>
    <button data-act="dupNext7">Дублировать +7 дней</button>
    <button data-act="dupNext14">Дублировать +14 дней</button>
    <hr>
    <button class="danger" data-act="delete">Удалить пару</button>
  `;
  card.appendChild(menu);
  const rect = card.getBoundingClientRect();
  if(rect.bottom + 400 > window.innerHeight) menu.classList.add('up');
  menu.addEventListener('click', ev => {
    const moveBtn = ev.target.closest('[data-move]');
    if(moveBtn){ moveItem(id, fromKey, moveBtn.dataset.move); closeMenus(); return; }
    const act = ev.target.closest('[data-act]'); if(!act) return;
    const a = act.dataset.act;
    const item = findItem(fromKey, id);
    if(!item){ closeMenus(); return; }
    if(a === 'delete'){
      data.days[fromKey] = itemsFor(fromKey).filter(i => i.id !== id);
      if(!data.days[fromKey].length) delete data.days[fromKey];
      save(); renderHome(); toast('Пара удалена');
    }
    if(a === 'dup'){
      const copy = {...item, id: uid(), done:false, autoDone:undefined, lmsStatus:'', hwIds: []};
      const arr = itemsFor(fromKey);
      arr.splice(arr.indexOf(item) + 1, 0, copy);
      save(); renderHome();
      toast('Пара продублирована (оригинал сохранён)');
    }
    if(a === 'dupNext7'){
      const toKey = iso(addDays(new Date(fromKey + 'T00:00:00'), 7));
      itemsFor(toKey).push({...item, id: uid(), done:false, autoDone:undefined, lmsStatus:'', hwIds: []});
      save();
      toast('Пара продублирована на +7 дней (оригинал сохранён)');
    }
    if(a === 'dupNext14'){
      const toKey = iso(addDays(new Date(fromKey + 'T00:00:00'), 14));
      itemsFor(toKey).push({...item, id: uid(), done:false, autoDone:undefined, lmsStatus:'', hwIds: []});
      save();
      toast('Пара продублирована на +14 дней (оригинал сохранён)');
    }
    closeMenus();
  });
}
function moveItem(id, fromKey, toKey){
  if(fromKey === toKey) return;
  const fromArr = itemsFor(fromKey);
  const idx = fromArr.findIndex(i => i.id === id);
  if(idx < 0) return;
  const [item] = fromArr.splice(idx, 1);
  if(!fromArr.length) delete data.days[fromKey];
  itemsFor(toKey).push(item);
  save(); renderHome();
}

function autoCrossOut(){
  const now = new Date();
  const todayKey = iso(new Date(now.getFullYear(), now.getMonth(), now.getDate()));
  const nowMin = now.getHours()*60 + now.getMinutes();
  let changed = false;
  Object.keys(data.days).forEach(key => {
    const arr = data.days[key];
    if(!Array.isArray(arr)) return;
    arr.forEach(item => {
      if(item.done) return;
      if(item.autoDone === false) return;
      if(key < todayKey){ item.done = true; item.autoDone = true; changed = true; return; }
      if(key === todayKey){
        const slot = parseSlot(item.time);
        if(!slot) return;
        if(nowMin >= slot.end){ item.done = true; item.autoDone = true; changed = true; }
      }
    });
  });
  if(changed) save();
  if(currentTab === 'home'){
    const ae = document.activeElement;
    const typing = ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA' || ae.isContentEditable) && ae.closest('.card');
    if(!typing) renderList();
  }
}

let notifiedKeys = new Set();
try { notifiedKeys = new Set(JSON.parse(localStorage.getItem(NOTIFIED_KEY) || '[]')); } catch(e){}
function saveNotified(){ try{ localStorage.setItem(NOTIFIED_KEY, JSON.stringify([...notifiedKeys])); }catch(e){} }
function checkReminders(){
  const s = data.settings || {};
  if(!s.notifyEnabled || !('Notification' in window) || Notification.permission !== 'granted') return;
  const now = new Date();
  const todayKey = iso(new Date(now.getFullYear(), now.getMonth(), now.getDate()));
  const arr = data.days[todayKey] || [];
  const nowMin = now.getHours()*60 + now.getMinutes();
  const mins = parseInt(s.notifyMinutes, 10) || 15;
  let changed = false;
  const icon = document.querySelector('link[rel=icon]')?.href;
  arr.forEach(item => {
    if(!item.subject) return;
    const slot = parseSlot(item.time); if(!slot) return;
    const mb = slot.start - nowMin;
    if(mb <= 0 || mb > mins) return;
    const nKey = todayKey + ':' + item.id;
    if(notifiedKeys.has(nKey)) return;
    try{
      new Notification(`Скоро пара — ${item.subject}`, { body: `Начало в ${item.time}${item.room ? ' · ауд. ' + item.room : ''}`, tag: nKey, icon });
      if(navigator.vibrate) try{ navigator.vibrate([180, 90, 180]); }catch(_){}
    }catch(err){}
    notifiedKeys.add(nKey); changed = true;
  });
  const cutoff = iso(addDays(new Date(), -3));
  [...notifiedKeys].forEach(k => { if(k.split(':')[0] < cutoff){ notifiedKeys.delete(k); changed = true; } });
  if(changed) saveNotified();
}

function renderCalendar(){
  const y = calTabMonth.getFullYear(), m = calTabMonth.getMonth();
  $('#cal2Month').textContent = `${MONTHS_NOM[m]} ${y}`;
  const grid = $('#cal2Grid');
  grid.innerHTML = '';
  const fd = new Date(y, m, 1);
  const so = (fd.getDay() + 6) % 7;
  const dim = new Date(y, m + 1, 0).getDate();
  const today = todayDate();
  for(let i=0;i<so;i++){
    const el = document.createElement('button');
    el.className = 'cal-cell empty'; el.tabIndex = -1;
    grid.appendChild(el);
  }
  for(let d=1; d<=dim; d++){
    const date = new Date(y, m, d);
    const key = iso(date);
    const classes = data.days[key] || [];
    const clubs = clubsForDate(date);
    const isToday = sameDay(date, today);
    const isSelected = sameDay(date, calTabSelected);
    const hasAny = classes.length || clubs.length;
    const allDots = [...classes.map(it => classColor(it)), ...clubs.map(cl => dotColorForClub(cl))];
    const shown = allDots.slice(0, 8);
    const dotsHtml = shown.map(c => `<span class="cal2-dot" style="background:${c}"></span>`).join('');
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'cal-cell' + (isToday?' today':'') + (isSelected?' selected':'') + (hasAny?' has':'');
    btn.dataset.date = key;
    btn.innerHTML = `<span class="num">${d}</span>${dotsHtml ? `<span class="cal2-dots">${dotsHtml}</span>` : ''}`;
    grid.appendChild(btn);
  }
  renderCalendarEvents();
  renderCalendarHomework();
}

function updateSubjectDropdowns(){
  const subjects = new Set(Object.keys(data.homework));
  Object.values(data.days).forEach(arr => arr.forEach(i => { if(i.subject) subjects.add(i.subject); }));
  if(data.materials){
    (data.materials.notes||[]).forEach(n => { if(n.subject) subjects.add(n.subject); });
    (data.materials.autos||[]).forEach(a => { if(a.subject) subjects.add(a.subject); });
    (data.materials.methodichki||[]).forEach(m => { if(m.subject) subjects.add(m.subject); });
  }
  
  const opts = '<option value="">— Предмет —</option>' + Array.from(subjects).sort().map(s => `<option value="${esc(s)}">${esc(s)}</option>`).join('');
  
  const hwSelect = document.querySelector('#hwSubjectSelect');
  if(hwSelect){
    const cur = hwSelect.value;
    hwSelect.innerHTML = opts;
    hwSelect.value = cur;
  }
  
  document.querySelectorAll('.mat-subj').forEach(sel => {
    const cur = sel.value;
    sel.innerHTML = '<option value="">Предмет</option>' + Array.from(subjects).sort().map(s => `<option value="${esc(s)}">${esc(s)}</option>`).join('');
    sel.value = cur;
  });
}

function renderHomework(){
  updateSubjectDropdowns();
  const list = $('#hwList');
  list.innerHTML = '';

  const activeBySubject = {};
  const doneItems = [];
  let total = 0, doneCount = 0;
  Object.keys(data.homework).forEach(subj => {
    (data.homework[subj] || []).forEach(h => {
      total++;
      if(h.done){
        doneCount++;
        doneItems.push({ ...h, subject: subj });
      } else {
        if(!activeBySubject[subj]) activeBySubject[subj] = [];
        activeBySubject[subj].push(h);
      }
    });
  });
  $('#hwBadge').textContent = total ? `${doneCount}/${total}` : '';

  const activeSubjects = Object.keys(activeBySubject).sort();

  if(!activeSubjects.length && !doneItems.length){
    list.innerHTML = '<p class="empty"><div class="big">📝</div>ДЗ пока нет.</p>';
    return;
  }
  if(!activeSubjects.length && doneItems.length){
    list.innerHTML = '<p class="empty" style="padding-bottom:0"><div class="big">🎉</div>Все задания выполнены!</p>';
  }

  function hwItemHtml(h, subj, doneGroup){
    const fromCardTag = h.fromCard ? '<span class="hw-from-card">с карточки</span>' : '';
    const check = h.done ? 'checked' : '';
    return `<div class="hw-item${doneGroup ? ' done' : ''}" data-id="${h.id}" data-subject="${esc(subj)}">
      <label class="cl-check"><input type="checkbox" ${check}><span class="hw-box"></span></label>
      <span class="hw-text" contenteditable="true" data-hw-id="${h.id}" data-subject="${esc(subj)}">${esc(h.text)}</span>
      ${fromCardTag}
      <input type="date" class="hw-dl-input" value="${esc(h.deadline||'')}" data-hw-id="${h.id}" data-subject="${esc(subj)}">
      ${isAdmin ? '<button class="del" type="button">×</button>' : ''}
    </div>`;
  }

  activeSubjects.forEach(subject => {
    const items = activeBySubject[subject];
    const collapsed = openGroups['hw_' + subject] === false;
    const group = document.createElement('div');
    group.className = 'hw-group' + (collapsed ? ' collapsed' : '');
    group.dataset.subject = subject;
    const itemsHtml = items.map(h => hwItemHtml(h, subject, false)).join('');
    group.innerHTML = `<div class="hw-group-head"><span class="hw-dot"></span><span class="hw-name">${esc(subject)}</span><span class="hw-counter">${items.length}</span><span class="hw-arrow">▾</span></div><div class="hw-group-body">${itemsHtml}</div>`;
    list.appendChild(group);
  });

  if(doneItems.length){
    const isExpanded = openGroups['hw_done_section'] === true;
    const group = document.createElement('div');
    group.className = 'hw-group hw-done-group' + (isExpanded ? '' : ' collapsed');
    group.dataset.doneSection = '1';
    const itemsHtml = doneItems.map(h => hwItemHtml(h, h.subject, true)).join('');
    group.innerHTML = `<div class="hw-group-head"><span class="hw-dot"></span><span class="hw-name">✅ Выполненные</span><span class="hw-counter">${doneItems.length}</span><span class="hw-arrow">▾</span></div><div class="hw-group-body">${itemsHtml}</div>`;
    list.appendChild(group);
  }
}

async function storeMaterialFile(file){
  const MAX_BASE64 = 1.5 * 1024 * 1024;
  try {
    const pid = profiles.current;
    const safeName = file.name.replace(/[^\w.\-]/g, '_');
    const path = `materials/${pid}/${Date.now()}-${safeName}`;
    const { error } = await supa.storage.from('materials').upload(path, file, { cacheControl: '3600', upsert: false });
    if(error) throw error;
    const { data: pub } = supa.storage.from('materials').getPublicUrl(path);
    return { url: pub.publicUrl, name: file.name };
  } catch(e) {
    if(file.size > MAX_BASE64) throw new Error('Файл слишком большой (макс. 1.5 МБ)');
    const dataUrl = await new Promise((res, rej) => {
      const r = new FileReader();
      r.onload = () => res(r.result);
      r.onerror = rej;
      r.readAsDataURL(file);
    });
    return { url: dataUrl, name: file.name };
  }
}

async function handleFileUpload(e, col) {
  const file = e.target.files && e.target.files[0];
  if(!file) return;
  const formId = col === 'notes' ? 'materialsNotesForm' : col === 'methodichki' ? 'materialsMethodichkiForm' : 'materialsAutosForm';
  const subj = document.querySelector(`#${formId} select[name="subject"]`).value;
  try {
    const res = await storeMaterialFile(file);
    const isImg = file.type.startsWith('image/');
    if(!data.materials[col]) data.materials[col] = [];
    data.materials[col].push({ id: uid(), subject: subj, type: isImg ? 'image' : 'file', url: res.url, name: file.name, done: false });
    save(); renderMaterials();
    toast('Файл загружен ✓');
  } catch(err){
    toast('Ошибка: ' + (err.message || ''));
  }
  e.target.value = '';
}

function copyWeekForward(){
  const src = currentWeekStart();
  let copied = 0;
  for(let i=0;i<7;i++){
    const fromKey = iso(addDays(src, i));
    const toKey = iso(addDays(src, i+7));
    const fromArr = data.days[fromKey] || [];
    if(!fromArr.length) continue;
    fromArr.forEach(item => {
      itemsFor(toKey).push({...item, id: uid(), done:false, autoDone:undefined, lmsStatus:'', hwIds:[]});
      copied++;
    });
  }
  if(!copied){ toast('Нет пар на этой неделе'); return; }
  save(); renderAll(); toast(`Скопировано ${copied} пар`);
}

    const isCur = p.id === profiles.current;

      ? `<button class="pi-del" data-del="${p.id}">×</button>` : '';

  } else {

      <hr>
      <button data-act="adminLogin">🔑 Войти как админ</button>

  }

  profileBtn.parentElement.appendChild(menu);

  menu.addEventListener('click', ev => {
    const del = ev.target.closest('[data-del]');
    if(del){
      ev.stopPropagation();
      if(!isAdmin){ toast('Только админ может удалять профили'); return; }
      const pid = del.dataset.del;
      const prof = profiles.list.find(p => p.id === pid);
      if(profiles.list.length <= 1){ toast('Нельзя удалить последний'); return; }
      if(!confirm(`Удалить профиль «${prof.name}»?`)) return;
      cancelPendingSaves();
      profiles.list = profiles.list.filter(p => p.id !== pid);
      if(profiles.current === pid) profiles.current = profiles.list[0].id;
      try{ localStorage.removeItem(dataKeyFor(pid)); }catch(e){}
      try{ supa.from('personal_data').delete().eq('id', 'personal-' + pid).then(()=>{}, ()=>{}); }catch(e){}
      saveProfiles(profiles); closeMenus();
      (async () => {
        const pid2 = profiles.current;
        const p = await fetchPersonal(pid2);
        lastPersonal = p || defaultPersonal();
        rebuildAndRender();
        subscribeRealtime();
      })();
      toast(`Профиль «${prof.name}» удалён`);
      return;
    }
    const sw = ev.target.closest('[data-switch]');
    if(sw){
      if(!isAdmin){ closeMenus(); return; }
      const pid = sw.dataset.switch;
      if(pid === profiles.current){ closeMenus(); return; }
      persistLocal();
      cancelPendingSaves();
      profiles.current = pid;
      saveProfiles(profiles);
      history.replaceState(null, '', '?p=' + pid);
      closeMenus();
      localPersonalCache = null;
      try{
        const p = localStorage.getItem(dataKeyFor(pid));
        if(p) localPersonalCache = splitData(JSON.parse(p)).personal;
      }catch(e){}
      (async () => {
        const p = await fetchPersonal(pid);
        lastPersonal = p || localPersonalCache || defaultPersonal();
        rebuildAndRender();
        subscribeRealtime();
        toast(`Профиль: ${currentProfile().name}`);
      })();
      return;
    }
    const act = ev.target.closest('[data-act]');
    if(!act) return;
    const a = act.dataset.act;
    if(a === 'openPlanner'){ closeMenus(); openPlannerModal(); return; }
    if(a === 'adminLogin'){ closeMenus(); adminLogin(); return; }
    if(a === 'adminLogout'){ closeMenus(); adminLogout(); return; }
    if(a === 'profileLinks'){
      if(!isAdmin){ toast('Только для админа'); return; }
      closeMenus(); openProfileLinksModal(); return;
    }
    if(a === 'actions'){ closeMenus(); openActionsModal(true); return; }
    if(a === 'actionsUser'){ closeMenus(); openActionsModal(false); return; }
    if(a === 'changeAvatar'){
      closeMenus();
      const p = currentProfile();
      openAvatarPicker(p.name, p.avatarImg, (name, img) => {
        const prof = profiles.list.find(x => x.id === profiles.current);
        if(!prof) return;
        prof.name = name;
        prof.avatarImg = img;
        saveProfiles(profiles);
        renderProfileBadge();
        toast('Аватарка обновлена');
      });
      return;
    }
    if(a === 'newProfile'){
      if(!isAdmin){ toast('Только для админа'); return; }
      closeMenus();
      openAvatarPicker('', '', (name, img) => {
        const newP = { id: 'p_'+Date.now().toString(36)+Math.random().toString(36).slice(2,4), name, avatarImg: img };
        persistLocal();
        cancelPendingSaves();
        profiles.list.push(newP);
        profiles.current = newP.id;
        saveProfiles(profiles);
        history.replaceState(null, '', '?p=' + newP.id);
        lastPersonal = defaultPersonal();
        localPersonalCache = null;
        personalWriteInFlight = true;
        pushPersonal(newP.id, lastPersonal).finally(() => { personalWriteInFlight = false; });
        rebuildAndRender();
        subscribeRealtime();
        toast(`Создан профиль «${name}»`);
      });
    }
  });
}
function openAvatarPicker(initialName, initialImg, onSave){
  let selectedImg = initialImg || '';
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.innerHTML = `
    <div class="modal">
      <h3>${initialName ? 'Настройки профиля' : 'Новый профиль'}</h3>
      <input class="modal-input" id="avName" placeholder="Имя профиля" maxlength="30" value="${esc(initialName||'')}" autocomplete="off">
      <div style="margin-top:12px">
        <div style="font-size:12px;color:var(--muted);margin-bottom:8px;font-weight:600">Аватарка</div>
        <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
          <div id="avPreview" style="width:64px;height:64px;border-radius:16px;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800;overflow:hidden;flex:0 0 auto"></div>
          <input type="file" id="avFile" accept="image/*" hidden>
          <button type="button" id="avUploadBtn" style="padding:8px 14px;border-radius:8px;border:1px solid var(--border);background:var(--hover);color:var(--text);cursor:pointer;font-family:inherit;font-size:13px">🖼 Загрузить из галереи</button>
          <span id="avFileName" style="font-size:12px;color:var(--muted)"></span>
        </div>
      </div>
      <div class="modal-actions">
        <button class="secondary" id="avCancel" type="button">Отмена</button>
        <button class="primary" id="avSave" type="button">Сохранить</button>
      </div>
    </div>`;
  document.body.appendChild(backdrop);
  const nameInput = backdrop.querySelector('#avName');
  const avFile = backdrop.querySelector('#avFile');
  const avUploadBtn = backdrop.querySelector('#avUploadBtn');
  const avFileName = backdrop.querySelector('#avFileName');
  const avPreview = backdrop.querySelector('#avPreview');
  function updatePreview(){
    if(selectedImg){
      avPreview.innerHTML = `<img src="${esc(selectedImg)}" style="width:100%;height:100%;object-fit:cover">`;
    } else {
      const n = nameInput.value.trim();
      avPreview.textContent = (n||'?').charAt(0).toUpperCase() || '?';
    }
  }
  setTimeout(() => nameInput.focus(), 50);
  updatePreview();
  nameInput.addEventListener('input', updatePreview);
  avUploadBtn.onclick = () => avFile.click();
  avFile.onchange = () => {
    const file = avFile.files && avFile.files[0];
    if(!file) return;
    if(file.size > 300 * 1024){ toast('Макс. 300 КБ для аватарки'); avFile.value = ''; return; }
    const r = new FileReader();
    r.onload = () => {
      selectedImg = r.result;
      avFileName.textContent = file.name;
      updatePreview();
    };
    r.readAsDataURL(file);
  };
  nameInput.addEventListener('keydown', e => { if(e.key === 'Enter') backdrop.querySelector('#avSave').click(); });
  const close = () => backdrop.remove();
  backdrop.addEventListener('click', e => { if(e.target === backdrop) close(); });
  backdrop.querySelector('#avCancel').onclick = close;
  backdrop.querySelector('#avSave').onclick = () => {
    const name = nameInput.value.trim().slice(0, 30);
    if(!name){ toast('Введи имя'); nameInput.focus(); return; }
    close();
    onSave(name, selectedImg);
  };
}

function download(name, text, type){
  const blob = new Blob([text], {type});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}
function exportJSON(){
  const payload = { ...data, profileName: currentProfile().name };
  download(`raspisanie-${currentProfile().name}.json`, JSON.stringify(payload, null, 2), 'application/json');
  toast('Бэкап сохранён');
}
$('#fileInput').addEventListener('change', e => {
  const file = e.target.files && e.target.files[0]; if(!file) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const parsed = JSON.parse(r.result);
      if(!parsed || typeof parsed !== 'object') throw new Error('bad');
      const sp = splitData(parsed);
      data = mergeData(sp.shared, sp.personal);
      save(); renderAll();
      toast('Расписание загружено ✓');
    }catch(err){ toast('Не удалось прочитать файл'); }
  };
  r.readAsText(file); e.target.value = '';
});

function icsEsc(s){ return String(s||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n'); }
function icsStamp(d){ return `${d.getUTCFullYear()}${pad(d.getUTCMonth()+1)}${pad(d.getUTCDate())}T${pad(d.getUTCHours())}${pad(d.getUTCMinutes())}${pad(d.getUTCSeconds())}Z`; }
function icsDT(date, minutes){
  const d = new Date(date.getFullYear(), date.getMonth(), date.getDate(), 0, minutes, 0);
  return `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}00`;
}
function fold(line){
  if(line.length <= 74) return line;
  let out = line.slice(0,74), rest = line.slice(74);
  while(rest.length){ out += '\r\n ' + rest.slice(0,73); rest = rest.slice(73); }
  return out;
}
function exportICS(){
  const stamp = icsStamp(new Date());
  const lines = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Study Schedule//RU','CALSCALE:GREGORIAN','METHOD:PUBLISH',
    'X-WR-CALNAME:' + icsEsc('Расписание — ' + currentProfile().name),
    'X-WR-TIMEZONE:' + (Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC')];
  let count = 0;
  Object.keys(data.days).sort().forEach(key => {
    const date = new Date(key + 'T00:00:00');
    (data.days[key] || []).forEach(item => {
      const slot = parseSlot(item.time);
      if(!slot || !item.subject) return;
      count++;
      const tLabel = TYPE_LABEL[item.type] || '';
      const summary = tLabel ? `${item.subject} (${tLabel})` : item.subject;
      lines.push('BEGIN:VEVENT');
      lines.push('UID:' + date.getTime() + '-' + item.id + '@study-schedule');
      lines.push('DTSTAMP:' + stamp);
      lines.push('DTSTART:' + icsDT(date, slot.start));
      lines.push('DTEND:' + icsDT(date, slot.end));
      lines.push('SUMMARY:' + icsEsc(summary));
      if(item.room) lines.push('LOCATION:' + icsEsc(item.room));
      const desc = [];
      if(tLabel) desc.push('Тип: ' + tLabel);
      if(item.teacher) desc.push('Преподаватель: ' + item.teacher);
      if(item.notes) desc.push(item.notes);
      const cardHw = (item.hwIds||[]).map(id => findHWById(id)).filter(Boolean).map(h => (h.item.done?'✓ ':'• ') + h.item.text);
      if(cardHw.length) desc.push('ДЗ:\n' + cardHw.join('\n'));
      if(desc.length) lines.push('DESCRIPTION:' + icsEsc(desc.join('\n')));
      lines.push('END:VEVENT');
    });
  });
  data.clubs.forEach(c => {
    if(!c.date || !c.name) return;
    const date = new Date(c.date + 'T00:00:00');
    const slot = parseSlot(c.time) || {start: 0, end: 60};
    count++;
    lines.push('BEGIN:VEVENT');
    lines.push('UID:' + date.getTime() + '-' + c.id + '@clubs');
    lines.push('DTSTAMP:' + stamp);
    lines.push('DTSTART:' + icsDT(date, slot.start));
    lines.push('DTEND:' + icsDT(date, slot.end));
    lines.push('SUMMARY:' + icsEsc('🎨 ' + c.name));
    if(c.place) lines.push('LOCATION:' + icsEsc(c.place));
    lines.push('END:VEVENT');
  });
  lines.push('END:VCALENDAR');
  if(!count){ toast('Нет данных'); return; }
  download('raspisanie.ics', lines.map(fold).join('\r\n') + '\r\n', 'text/calendar;charset=utf-8');
  toast(`Экспортировано ${count} событий`);
}

$('#searchInput').addEventListener('input', () => renderList());
$('#searchClear').addEventListener('click', () => { $('#searchInput').value = ''; renderList(); });

function renderAll(){
  renderProfileBadge();
  renderHome();
  if(currentTab === 'calendar') renderCalendar();
  if(currentTab === 'homework') renderHomework();
  if(currentTab === 'clubs') renderClubs();
  if(currentTab === 'materials') renderMaterials();
  if(currentTab === 'links') renderLinks();
}

async function initApp(){
  try{
    const urlP = new URLSearchParams(location.search).get('p');
    if(urlP && profiles.list.some(p => p.id === urlP)){
      profiles.current = urlP;
      saveProfiles(profiles);
    }
  }catch(e){}

  switchTab('home');
  try{
    const s = localStorage.getItem(SHARED_LOCAL_KEY);
    if(s) localSharedCache = JSON.parse(s);
    const p = localStorage.getItem(dataKeyFor(profiles.current));
    if(p) localPersonalCache = splitData(JSON.parse(p)).personal;
  }catch(e){}
  if(localSharedCache) lastShared = localSharedCache;
  if(localPersonalCache) lastPersonal = localPersonalCache;
  if(lastShared || lastPersonal) rebuildAndRender();

  setSyncStatus('saving');
  const cloudShared = await fetchShared();
  const cloudPersonal = await fetchPersonal(profiles.current);

  if(cloudShared){ lastShared = cloudShared; }
  else if(localSharedCache){ lastShared = localSharedCache; await pushShared(lastShared); toast('Расписание перенесено в облако ✓'); }
  else { lastShared = { days:{}, homework:{}, materials:{} }; await pushShared(lastShared); }

  if(cloudPersonal){ lastPersonal = cloudPersonal; }
  else if(localPersonalCache){ lastPersonal = localPersonalCache; await pushPersonal(profiles.current, lastPersonal); }
  else { lastPersonal = defaultPersonal(); await pushPersonal(profiles.current, lastPersonal); }

  rebuildAndRender();
  setSyncStatus('synced');
  subscribeRealtime();

  autoCrossOut();
  setInterval(autoCrossOut, 30000);
  checkReminders();
  setInterval(checkReminders, 30000);
}
initApp();
</script>
